<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>রাস্ট ও Tauri — বেসিক থেকে প্রজেক্ট</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#f2f5f7;--panel:#fff;--ink:#12232e;--mute:#5a6b77;--line:#d5dee4;--acc:#0b7a75;--accbg:#dff1ef;--ok:#1d7a3a;--okbg:#e0f3e6;--bad:#b4372f;--badbg:#fbe5e3;--code:#12232e;--codeink:#d7ecf0}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a22;--panel:#15252f;--ink:#e3eef2;--mute:#8fa5b1;--line:#27404d;--acc:#4cc3bb;--accbg:#173a3d;--ok:#6fd48c;--okbg:#14331f;--bad:#ff8a80;--badbg:#3a1a18;--code:#08121a;--codeink:#cfe8ee}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:17px/1.8 "Noto Sans Bengali",system-ui,sans-serif}
.app{display:grid;grid-template-columns:310px 1fr;min-height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:19px;margin:0 0 10px;font-weight:800}
.grp{margin:18px 0 4px;font-size:14px;color:var(--acc);font-weight:800}
nav button{display:flex;gap:6px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px;color:var(--ink);font:inherit;font-size:15px;line-height:1.4;cursor:pointer}
nav button:hover{background:var(--accbg)}nav button.on{background:var(--accbg);font-weight:600;box-shadow:inset 3px 0 0 var(--acc)}
nav .st{margin-left:auto;font-size:13px;color:var(--ok);white-space:nowrap}
main{padding:28px clamp(16px,4vw,48px) 90px;max-width:900px;width:100%}
h2{font-size:27px;line-height:1.35;margin:4px 0 16px;font-weight:800}
h3{font-size:21px;margin:26px 0 6px}h4{font-size:18px;margin:18px 0 4px}p{margin:8px 0}
ul{padding-left:22px;margin:6px 0}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 16px;font:inherit;font-weight:600;color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--acc);border-color:var(--acc)}
.cb{position:relative;margin:10px 0}
pre{background:var(--code);color:var(--codeink);padding:14px 16px;border-radius:8px;overflow-x:auto;font:14px/1.7 "JetBrains Mono",ui-monospace,monospace;margin:0;white-space:pre}
.tg{position:absolute;top:6px;right:6px;background:var(--accbg);color:var(--acc);border:0;border-radius:6px;padding:2px 10px;font:600 13px "Noto Sans Bengali";cursor:pointer}
.gap{width:var(--w);font:inherit;background:#fff3;color:inherit;border:1px dashed var(--acc);border-radius:4px;padding:0 3px;text-align:center}
.gap.ok{border:1px solid var(--ok);color:var(--ok)}.gap.no{border:1px solid var(--bad);color:var(--bad)}
table{border-collapse:collapse;width:100%;margin:10px 0;font-size:15px;display:block;overflow-x:auto}td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}
details.ex{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 16px;margin:10px 0}
details.ex summary{cursor:pointer;font-weight:600;padding:6px 0}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:14px 0}.q b{display:block;margin-bottom:8px}
.o{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
.o.right{background:var(--okbg);border-color:var(--ok)}.o.wrong{background:var(--badbg);border-color:var(--bad)}
.exp{margin-top:6px;font-size:15px;color:var(--mute)}.score{font-weight:800;font-size:20px;margin:16px 0}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 18px;margin:12px 0}.step.cur{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.btn{background:var(--acc);color:var(--bg);border:0;border-radius:8px;padding:9px 20px;font:inherit;font-weight:600;cursor:pointer;margin:8px 8px 0 0}.btn.alt{background:none;color:var(--acc);border:1px solid var(--acc)}
.bn{background:var(--accbg);border-left:4px solid var(--acc);padding:8px 14px;border-radius:0 8px 8px 0;margin:8px 0 12px}
.lg{margin:0 0 14px;border:0}.lg button{border:1px solid var(--line);border-radius:8px;padding:5px 14px;margin-right:6px}.lg button.on{border-color:var(--acc)}
.gp{display:block;width:100%;font:inherit;background:#ffffff14;color:var(--codeink);border:1px dashed var(--acc);border-radius:6px;padding:4px 8px;margin:4px 0;white-space:pre;resize:vertical}.gp.ok{border:1px solid var(--ok)}.gp.no{border:1px solid var(--bad)}.hint{color:#7f98a3}.sc{margin-left:6px;font-weight:700}a{color:var(--acc)}
code{font:14px "JetBrains Mono",ui-monospace,monospace;background:var(--accbg);padding:1px 6px;border-radius:4px}
.chead{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 14px}.chead>div:first-child{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}.chead .bar{margin:0 0 8px}.how0{font-size:15px;color:var(--mute)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}.toc button{background:var(--panel);color:var(--ink);font:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;min-width:40px;padding:2px 10px;cursor:pointer}.toc button:hover{border-color:var(--acc)}.toc button.dn{background:var(--okbg);border-color:var(--ok);color:var(--ok);margin:0}
details.card{padding:0;overflow:hidden;margin:12px 0}
details.card>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer}details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary{background:var(--accbg);border-bottom:1px solid var(--line)}
.num{flex:none;min-width:36px;height:36px;border-radius:18px;background:var(--acc);color:var(--bg);display:grid;place-items:center;font:700 14px "JetBrains Mono",monospace;padding:0 6px}
.tt{display:flex;flex-direction:column;line-height:1.4}.tt small{color:var(--mute);font-weight:400;font-size:14px}
.dn{margin-left:auto;color:var(--ok);font-size:13px;font-weight:700;white-space:nowrap}
.cbody{padding:4px 18px 16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}.chips span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 10px;font:13px "JetBrains Mono",monospace}
.sec{margin:16px 0}.sec>h4{margin:0 0 6px;font-size:16px;color:var(--acc)}
.en{border-left:4px solid var(--line);padding:2px 12px;color:var(--mute);margin:8px 0}
.how{margin:4px 0;padding-left:22px}.how li{margin:4px 0}
pre.tests{border-left:4px solid var(--ok)}.mt{font-size:14px;color:var(--mute)}
.todo{color:#ffd479;background:#ffd47922;border-radius:3px}
details.sub{border:1px dashed var(--line);border-radius:8px;padding:2px 12px;margin:12px 0}details.sub summary{cursor:pointer;font-weight:600;padding:5px 0}
.menu{display:none}
@media(max-width:800px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:none}nav.open{display:block}.menu{display:block;margin:12px 16px 0}}
</style></head><body>
<button class="btn alt menu" id="menu">☰ তালিকা</button>

িত্তি করে।"]]}]},{"g":"২. কোড এক্সারসাইজ (চ্যাপ্টার ওয়াইজ)","items":[{"id":"c1","t":"Chapter 1: Introduction to Rust","k":"chapter","ex":[{"t":"1. Welcome to Rust | রাস্টে স্বাগতম","b":[["p","Path: 01_intro/00_welcome    |    Page Reference: 10"],["p","Welcome to \"100 Exercises To Learn Rust\"!"],["p","Your first task is to make the test suite pass. Open the exercise file located at exercises/01_intro/00_welcome/src/lib.rs. You will find a failing test inside. Your job is to edit the source file so that the test passes."],["p","Instructions:"],["li","Do NOT modify the test — only the implementation code."],["li","Run cargo test inside the exercise folder to verify your solution."],["li","Read the test carefully: it tells you exactly what the function should return."],["p","Goal: Get familiar with the project layout, the cargo test command, and the workflow you will use throughout the entire course."]],"n":1,"en":["Your very first Rust exercise. Open the file src/lib.rs inside the exercise folder. You will find a greeting() function that currently returns a placeholder string. Fix the function so that it returns the exact string \"I'm ready to learn Rust!\". Run `wr` (the course verification tool) to confirm your solution. This exercise familiarises you with the overall course workflow: read the instructions in src/lib.rs, make your edit, and run the automated test suite to verify your answer."],"bt":["এটি তোমার প্রথম Rust এক্সারসাইজ। exercises/01_intro/00_welcome ফোল্ডারের src/lib.rs ফাইলটি খোলো। greeting() ফাংশনটি এখন একটি placeholder string রিটার্ন করছে। ফাংশনটিকে ঠিক করো যাতে এটি \"I'm ready to learn Rust!\" স্ট্রিংটি রিটার্ন করে। সমাধান যাচাই করতে `wr` কমান্ড চালাও।"],"loc":"exercises/01_intro/00_welcome","f":[{"n":"src/lib.rs","s":[["c","// This is a Rust file. It is a plain text file with a `.rs` extension.\n//\n// Like most modern programming languages, Rust supports comments. You're looking at one right now!\n// Comments are ignored by the compiler; you can leverage them to annotate code with notes and\n// explanations.\n// There are various ways to write comments in Rust, each with its own purpose.\n// For now we'll stick to the most common one: the line comment.\n// Everything from `//` to the end of the line is considered a comment.\n\n// Exercises will include `TODO`, `todo!()` or `__` markers to draw your attention to the lines\n// where you need to write code.\n// You'll need to replace these markers with your own code to complete the exercise.\n// Sometimes it'll be enough to write a single line of code, other times you'll have to write\n// longer sections.\n//\n// If you get stuck for more than 10 minutes on an exercise, grab a trainer! We're here to help!\n// You can also find solutions to all exercises in the `solutions` git branch.\nfn greeting() -> &'static str {\n    // TODO: fix me 👇\n"],["g","    \"I'm ready to learn Rust!\""],["c","}\n\n// Your solutions will be automatically verified by a set of tests.\n// You can run these tests directly by invoking the `cargo test` command in your terminal,\n// from the root of this exercise's directory. That's what the `wr` command does for you\n// under the hood.\n//\n// Rust lets you write tests alongside your code.\n// The `#[cfg(test)]` attribute tells the compiler to only compile the code below when\n// running tests (i.e. when you run `cargo test`).\n// You'll learn more about attributes and testing later in the course.\n// For now, just know that you need to look for the `#[cfg(test)]` attribute to find the tests\n// that will be verifying the correctness of your solutions!\n//\n// ⚠️ **DO NOT MODIFY THE TESTS** ⚠️\n// They are there to help you validate your solutions. You should only change the code that's being\n// tested, not the tests themselves.\n#[cfg(test)]\nmod tests {\n    use crate::greeting;\n\n    #[test]\n    fn test_welcome() {\n        assert_eq!(greeting(), \"I'm ready to learn Rust!\");\n    }\n}\n"]]}]},{"t":"2. Rust Syntax Basics | রাস্টের মৌলিক সিনট্যাক্স","b":[["p","Path: 01_intro/01_syntax    |    Page Reference: 13"],["p","This exercise introduces you to the basic syntax of a Rust function."],["p","You are given a skeleton function in exercises/01_intro/01_syntax/src/lib.rs. The function currently does nothing (or will not compile). Your task is to:"],["li","Understand the function signature: its name, parameter list, and return type."],["li","Provide a correct function body so the existing tests pass."],["li","Pay attention to Rust's syntax for declaring variables with let, returning values (the last expression is implicitly returned), and type annotations."],["p","Key concepts to practice:"],["li","Function definitions with fn keyword"],["li","Explicit return types using ->"],["li","Implicit return via the final expression (no semicolon)"],["li","Basic integer arithmetic"],["p","Run cargo test to confirm your solution."]],"n":2,"en":["Practice Rust's fundamental syntax elements. You will work with function definitions using the `fn` keyword, function parameters with type annotations (e.g. `name: &str`), return types declared with `->`, single-line comments using `//`, and the unit type `()`. You will also practice returning values — both explicitly using the `return` keyword and implicitly by writing an expression as the last line of a function body (without a semicolon). Rust is a statically typed language, so every value must have a known type at compile time."],"bt":["Rust-এর মৌলিক সিনট্যাক্স উপাদান নিয়ে অনুশীলন করো। `fn` কীওয়ার্ড দিয়ে ফাংশন সংজ্ঞায়িত করা, টাইপ অ্যানোটেশন সহ প্যারামিটার, `->` দিয়ে রিটার্ন টাইপ ঘোষণা, `//` দিয়ে কমেন্ট এবং ইউনিট টাইপ `()` নিয়ে কাজ করবে। Rust একটি statically typed ভাষা, তাই প্রতিটি মানের টাইপ কম্পাইল-টাইমে জানা থাকতে হবে।"],"loc":"exercises/01_intro/01_syntax","f":[{"n":"src/lib.rs","s":[["c","// TODO: fix the function signature below to make the tests pass.\n//  Make sure to read the compiler error message—the Rust compiler is your pair programming\n//  partner in this course and it'll often guide you in the right direction!\n//\n// The input parameters should have the same type of the return type.\n"],["g","fn compute(a: u32, b: u32) -> u32 {"],["c","    // Don't touch the function body.\n    a + b * 2\n}\n\n#[cfg(test)]\nmod tests {\n    use crate::compute;\n\n    #[test]\n    fn case() {\n        assert_eq!(compute(1, 2), 5);\n    }\n}\n"]]}]},{"t":"অতিরিক্ত কোড — প্রথম ফাংশন","b":[["p","Exercise 1-2 এর workflow এই ছোট কোড দিয়ে বোঝা যায়। test পাস করাই লক্ষ্য।"],["code","fn greet(name: &str) -> String {\n    let msg = format!(\"Hello, {}!\", name);\n    msg\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn works() {\n        assert_eq!(greet(\"Rust\"), \"Hello, Rust!\");\n    }\n}"]]}]},{"id":"c2","t":"Chapter 2: A Basic Calculator","k":"chapter","ex":[{"t":"3. Calculator Introduction | ক্যালকুলেটর পরিচিতি","b":[["p","Path: 02_basic_calculator/00_intro    |    Page Reference: 14"],["p","This is the introductory exercise for Chapter 2, which focuses on building a basic calculator."],["p","Open exercises/02_basic_calculator/00_intro/src/lib.rs. You will find an incomplete function. Your task is to implement the function body so that all tests pass."],["p","The exercise sets the stage for the chapter: you will practise writing simple Rust functions that take numeric arguments and return computed results."],["p","Instructions:"],["li","Study the test cases to understand the expected input/output behaviour."],["li","Use integer arithmetic operators: + (add), - (subtract), * (multiply), / (divide), % (remainder)."],["li","Make sure the function compiles without warnings."],["p","Run cargo test to verify."]],"n":3,"en":["This is the introductory exercise for the Basic Calculator chapter. Familiarise yourself with the chapter topics: defining and calling functions, declaring and using variables, Rust's primitive integer and boolean types, arithmetic operators (including overflow/underflow behaviour), comparison operators, control flow using `if`/`else`, and panics. Complete this exercise before moving on — it builds the foundation for all subsequent calculator exercises."],"bt":["এটি বেসিক ক্যালকুলেটর অধ্যায়ের ভূমিকামূলক এক্সারসাইজ। ফাংশন সংজ্ঞায়িত ও কল করা, ভেরিয়েবল ডিক্লেয়ার করা, পূর্ণসংখ্যা ও বুলিয়ান টাইপ, অ্যারিথমেটিক অপারেটর (overflow/underflow সহ), তুলনা অপারেটর এবং `if`/`else` ব্যবহার করে কন্ট্রোল ফ্লো সম্পর্কে জানো।"],"loc":"exercises/02_basic_calculator/00_intro","f":[{"n":"src/lib.rs","s":[["c","fn intro() -> &'static str {\n    // TODO: fix me 👇\n"],["g","    \"I'm ready to build a calculator in Rust!\""],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::intro;\n\n    #[test]\n    fn test_intro() {\n        assert_eq!(intro(), \"I'm ready to build a calculator in Rust!\");\n    }\n}\n"]]}]},{"t":"4. Integer Types | পূর্ণসংখ্যার ধরন","b":[["p","Path: 02_basic_calculator/01_integers    |    Page Reference: 17"],["p","Rust has several integer types. This exercise explores the differences between them."],["p","Your task: Open exercises/02_basic_calculator/01_integers/src/lib.rs and implement a function that works with specific integer types."],["p","Concepts you must understand:"],["li","Signed integers: i8, i16, i32, i64, i128, isize"],["li","Unsigned integers: u8, u16, u32, u64, u128, usize"],["li","The default integer type in Rust is i32"],["li","Integer literals: decimal (42), hexadecimal (0xFF), octal (0o77), binary (0b1010)"],["li","Numeric separators for readability: 1_000_000"],["p","The tests will verify that you use the correct types and that arithmetic operations produce the expected results. Mismatched types are compile errors in Rust — you may need explicit casts using the as keyword."]],"n":4,"en":["Work with Rust's integer types. Rust provides both signed integers (`i8`, `i16`, `i32`, `i64`, `i128`, `isize`) and unsigned integers (`u8`, `u16`, `u32`, `u64`, `u128`, `usize`). The number suffix indicates the bit-width. The `usize` and `isize` types are pointer-sized and depend on the target architecture. Practice computing arithmetic expressions using `u32` and other integer types. Remember that all type conversions in Rust are explicit — the compiler will not automatically convert between integer types of different widths."],"bt":["Rust-এর integer টাইপগুলো নিয়ে কাজ করো। Rust-এ signed integer (`i8`, `i16`, `i32`, `i64`, `i128`, `isize`) এবং unsigned integer (`u8`, `u16`, `u32`, `u64`, `u128`, `usize`) রয়েছে। সংখ্যার suffix bit-width নির্দেশ করে। `u32` এবং অন্যান্য integer টাইপ ব্যবহার করে অ্যারিথমেটিক এক্সপ্রেশন গণনার অনুশীলন করো।"],"loc":"exercises/02_basic_calculator/01_integers","f":[{"n":"src/lib.rs","s":[["c","fn compute(a: u32, b: u32) -> u32 {\n"],["g","    let multiplier: u32 = 4;\n    // ^ You could also omit `: u32` entirely.\n    // The compiler will infer the correct type based on the usage below."],["c","    a + b * multiplier\n}\n\n#[cfg(test)]\nmod tests {\n    use crate::compute;\n\n    #[test]\n    fn case() {\n        assert_eq!(compute(1, 2), 9);\n    }\n}\n"]]}]},{"t":"5. Variables | ভেরিয়েবল","b":[["p","Path: 02_basic_calculator/02_variables    |    Page Reference: 19"],["p","This exercise focuses on variable bindings in Rust."],["p","Open exercises/02_basic_calculator/02_variables/src/lib.rs and make the tests pass."],["p","Key concepts:"],["li","Immutable bindings: let x = 5; — by default, variables are immutable."],["li","Mutable bindings: let mut x = 5; — you must add mut to allow reassignment."],["li","Shadowing: you can declare a new variable with the same name using let again, which shadows the previous binding."],["li","Variable types are inferred from context, but you can also annotate them: let x: i32 = 5;"],["p","In this exercise you will likely need to use mutable variables and/or shadowing to accumulate an intermediate result across multiple steps. Study the tests to understand what transformation the function must perform."]],"n":5,"en":["Declare and use variables in Rust. Use the `let` keyword to create variable bindings. By default, variables are immutable in Rust; add the `mut` keyword to make a variable mutable. Type annotations are optional when the compiler can infer the type, but are required otherwise. Practice writing a `speed(start, end, time_elapsed)` function that computes distance divided by elapsed time. Also learn that using an uninitialised variable triggers a compile-time error, not a runtime crash — Rust's safety guarantees start at compile time."],"bt":["Rust-এ ভেরিয়েবল ডিক্লেয়ার ও ব্যবহার করো। `let` কীওয়ার্ড দিয়ে ভেরিয়েবল বাইন্ডিং তৈরি করো। Rust-এ ডিফল্টভাবে ভেরিয়েবল immutable; মিউটেবল করতে `mut` কীওয়ার্ড যোগ করো। শুরু না করা ভেরিয়েবল ব্যবহার করলে কম্পাইল-টাইম এরর হয়, রানটাইম ক্র্যাশ নয়।"],"loc":"exercises/02_basic_calculator/02_variables","f":[{"n":"src/lib.rs","s":[["c","// 👇 The lines below, starting with `///`, are called **documentation comments**.\n//    They attach documentation to the item that follows them. In this case, the `speed` function.\n//    If you run `cargo doc --open` from this exercise's directory, Rust will generate\n//    HTML documentation from these comments and open it in your browser.\n\n/// Given the start and end points of a journey, and the time it took to complete it,\n/// calculate the average speed.\npub fn speed(start: u32, end: u32, time_elapsed: u32) -> u32 {\n    // TODO: define a variable named `distance` with the right value to get tests to pass\n    //  Do you need to annotate the type of `distance`? Why or why not?\n"],["g","    let distance = end - start;"],["c","\n    // Don't change the line below\n    distance / time_elapsed\n}\n\n#[cfg(test)]\nmod tests {\n    use crate::speed;\n\n    #[test]\n    fn case1() {\n        assert_eq!(speed(0, 10, 10), 1);\n    }\n\n    #[test]\n    fn case2() {\n        assert_eq!(speed(10, 30, 10), 2);\n    }\n\n    #[test]\n    fn case3() {\n        assert_eq!(speed(10, 31, 10), 2);\n    }\n}\n"]]}]},{"t":"6. Control Flow — if/else | কন্ট্রোল ফ্লো — if/else","b":[["p","Path: 02_basic_calculator/03_if_else    |    Page Reference: 22"],["p","Control flow with if/else in Rust."],["p","In Rust, if is an expression, not just a statement. That means it can return a value and be used on the right-hand side of a let binding."],["p","Your task: implement a function in exercises/02_basic_calculator/03_if_else/src/lib.rs that performs conditional logic."],["p","Things to understand:"],["li","Basic if/else syntax:"],["code","if condition { ... } else { ... }"],["li","if/else chains with else if"],["li","Using if as an expression:"],["code","let result = if condition { value_a } else { value_b };"],["li","Both branches of an if expression must have the same type."],["li","Comparison operators: ==, !=, <, >, <=, >="],["li","Logical operators: && (and), || (or), ! (not)"],["p","Make all tests pass using conditional expressions. Avoid using match for now (that comes later in the course)."]],"n":6,"en":["Write conditional logic in Rust using `if`/`else` expressions. Unlike many languages, `if`/`else` is an expression in Rust — it evaluates to a value, which means it can be used on the right-hand side of a `let` binding. When used this way, both branches must evaluate to the same type. Practice using comparison operators (`>`, `<`, `>=`, `<=`, `==`, `!=`) and logical operators (`&&`, `||`, `!`) inside conditions. Complete the exercise to handle arithmetic operations that require branching based on the input values."],"bt":["Rust-এ `if`/`else` এক্সপ্রেশন ব্যবহার করে কন্ডিশনাল লজিক লেখো। Rust-এ `if`/`else` একটি expression — এটি একটি মান মূল্যায়ন করে, তাই `let` বাইন্ডিং-এর ডানদিকে ব্যবহার করা যায়। তুলনা অপারেটর (`>`, `<`, `>=`, `<=`, `==`, `!=`) এবং লজিক্যাল অপারেটর (`&&`, `||`, `!`) অনুশীলন করো।"],"loc":"exercises/02_basic_calculator/03_if_else","f":[{"n":"src/lib.rs","s":[["c","/// Return `12` if `n` is even,\n/// `13` if `n` is divisible by `3`,\n/// `17` otherwise.\nfn magic_number(n: u32) -> u32 {\n"],["g","    if n % 2 == 0 {\n        12\n    } else if n % 3 == 0 {\n        13\n    } else {\n        17\n    }"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::magic_number;\n\n    #[test]\n    fn one() {\n        assert_eq!(magic_number(1), 17);\n    }\n\n    #[test]\n    fn two() {\n        assert_eq!(magic_number(2), 12);\n    }\n\n    #[test]\n    fn six() {\n        assert_eq!(magic_number(6), 12);\n    }\n\n    #[test]\n    fn nine() {\n        assert_eq!(magic_number(9), 13);\n    }\n\n    #[test]\n    fn high() {\n        assert_eq!(magic_number(233), 17);\n    }\n}\n"]]}]},{"t":"7. Panics | প্যানিক","b":[["p","Path: 02_basic_calculator/04_panics    |    Page Reference: 23"],["p","This exercise teaches you about runtime panics — Rust's mechanism for unrecoverable errors."],["p","A panic immediately terminates the current thread, printing an error message and a backtrace."],["p","Your task: open exercises/02_basic_calculator/04_panics/src/lib.rs. You must implement a function that panics under certain conditions (e.g., invalid input such as division by zero)."],["p","Key concepts:"],["li","panic!(\"message\") — triggers an unrecoverable error."],["li","assert!(condition) — panics if condition is false."],["li","assert_eq!(left, right) — panics if the two values are not equal."],["li","Guarding against invalid inputs using if + panic! is a simple but blunt strategy."],["p","The tests use #[should_panic] to verify that your function panics in the expected cases. Study this attribute carefully — the test passes only when the code panics."],["p","Note: Panics are not the idiomatic way to handle recoverable errors in Rust (that's what Result is for), but they are useful as a learning tool and for truly unrecoverable situations."]],"n":7,"en":["Learn about Rust's panic mechanism for unrecoverable errors. A panic is triggered when the program encounters a situation it cannot safely continue from — for example, dividing by zero or accessing an array out of bounds. You can intentionally trigger a panic using the `panic!` macro. Your task is to modify the `speed` function from the previous section to explicitly panic with a descriptive error message when `time_elapsed` is zero, rather than causing an implicit divide-by-zero panic. Use `panic!(\"error message\")` to signal the problem clearly."],"bt":["Rust-এর panic মেকানিজম সম্পর্কে জানো যা অপুনরুদ্ধারযোগ্য ত্রুটির জন্য ব্যবহৃত হয়। `panic!` ম্যাক্রো ব্যবহার করে ইচ্ছাকৃতভাবে panic ট্রিগার করা যায়। `time_elapsed` শূন্য হলে একটি বর্ণনামূলক এরর মেসেজ সহ `panic!` ব্যবহার করো।"],"loc":"exercises/02_basic_calculator/04_panics","f":[{"n":"src/lib.rs","s":[["c","/// Given the start and end points of a journey, and the time it took to complete the journey,\n/// calculate the average speed of the journey.\nfn speed(start: u32, end: u32, time_elapsed: u32) -> u32 {\n    // TODO: Panic with a custom message if `time_elapsed` is 0\n"],["g","    if time_elapsed == 0 {\n        panic!(\"The journey took no time at all. That's impossible!\");\n    }"],["c","\n    (end - start) / time_elapsed\n}\n\n#[cfg(test)]\nmod tests {\n    use crate::speed;\n\n    #[test]\n    fn case1() {\n        assert_eq!(speed(0, 10, 10), 1);\n    }\n\n    #[test]\n    // 👇 With the `#[should_panic]` annotation we can assert that we expect the code\n    //    under test to panic. We can also check the panic message by using `expected`.\n    //    This is all part of Rust's built-in test framework!\n    #[should_panic(expected = \"The journey took no time at all. That's impossible!\")]\n    fn by_zero() {\n        speed(0, 10, 0);\n    }\n}\n"]]}]},{"t":"8. Factorial (Recursion) | ফ্যাক্টোরিয়াল (পুনরাবৃত্তি)","b":[["p","Path: 02_basic_calculator/05_factorial    |    Page Reference: 24"],["p","Implement the factorial function in Rust."],["p","The factorial of a non-negative integer n is defined as:"],["li","factorial(0) = 1"],["li","factorial(n) = n × (n-1) × (n-2) × … × 1"],["p","Open exercises/02_basic_calculator/05_factorial/src/lib.rs and implement the factorial function so that all tests pass."],["p","You are encouraged to use a loop or recursion — choose whichever you feel comfortable with."],["p","Requirements:"],["li","The function should accept a u64 argument and return a u64."],["li","It should handle the base case (n = 0) correctly."],["li","Be careful about integer overflow for large inputs — the tests will clarify the expected range."],["li","You may use panic! if the input would cause overflow, or rely on Rust's debug-mode overflow detection."],["p","Hints:"],["li","Iterative approach: use a for loop over 1..=n and accumulate a product."],["li","Recursive approach: call factorial(n - 1) inside the function body."]],"n":8,"en":["Implement the factorial function using recursion. Given the concepts covered so far — functions, integer types, arithmetic operators, `if`/`else` expressions — implement `factorial(n: u32) -> u32` that returns n! (n factorial). Recall that 0! = 1, 1! = 1, and n! = n × (n-1)! for n > 1. This is a classic recursive algorithm that will test your understanding of function calls, return values, and conditional branching in Rust."],"bt":["পুনরাবৃত্তি (recursion) ব্যবহার করে factorial ফাংশন ইমপ্লিমেন্ট করো। `factorial(n: u32) -> u32` ফাংশন লেখো যা n! (n ফ্যাক্টোরিয়াল) রিটার্ন করে। মনে রাখো: 0! = 1, 1! = 1, এবং n > 1 হলে n! = n × (n-1)!।"],"loc":"exercises/02_basic_calculator/05_factorial","f":[{"n":"src/lib.rs","s":[["c","// Define a function named `factorial` that, given a non-negative integer `n`,\n// returns `n!`, the factorial of `n`.\n//\n// The factorial of `n` is defined as the product of all positive integers up to `n`.\n// For example, `5!` (read \"five factorial\") is `5 * 4 * 3 * 2 * 1`, which is `120`.\n// `0!` is defined to be `1`.\n//\n// We expect `factorial(0)` to return `1`, `factorial(1)` to return `1`,\n// `factorial(2)` to return `2`, and so on.\n//\n// Use only what you learned! No loops yet, so you'll have to use recursion!\n"],["g","fn factorial(n: u32) -> u32 {\n    if n == 0 {\n        1\n    } else {\n        n * factorial(n - 1)\n    }\n}"],["c","\n#[cfg(test)]\nmod tests {\n    use crate::factorial;\n\n    #[test]\n    fn first() {\n        assert_eq!(factorial(0), 1);\n    }\n\n    #[test]\n    fn second() {\n        assert_eq!(factorial(1), 1);\n    }\n\n    #[test]\n    fn third() {\n        assert_eq!(factorial(2), 2);\n    }\n\n    #[test]\n    fn fifth() {\n        assert_eq!(factorial(5), 120);\n    }\n}\n"]]}]},{"t":"9. Loops — while | লুপ — while","b":[["p","Path: 02_basic_calculator/06_while    |    Page Reference: 26"],["p","Practice using while loops in Rust."],["p","The while loop repeatedly executes its body as long as the given condition is true:"],["code","while condition { /* body */ }"],["p","Open exercises/02_basic_calculator/06_while/src/lib.rs and implement the required function using a while loop."],["p","Key points:"],["li","The condition is evaluated before each iteration."],["li","Use break to exit a while loop early."],["li","Use continue to skip to the next iteration."],["li","Rust also provides the infinite loop construct: loop { ... } which must be exited with break."],["li","A loop expression can return a value: let result = loop { break 42; };"],["p","The tests verify that your implementation produces the correct result for various inputs. Make sure you handle edge cases such as when the loop body should execute zero times."]],"n":9,"en":["Re-implement the factorial function using a `while` loop instead of recursion. A `while` loop executes its body repeatedly as long as the given condition evaluates to `true`. Syntax: `while <condition> { /* body */ }`. Practice using a mutable accumulator variable (`let mut result = 1u64`) and a loop counter to iteratively compute the factorial. Loops are useful when you need to repeat a block of code a variable number of times based on a runtime condition."],"bt":["`while` লুপ ব্যবহার করে factorial ফাংশন পুনরায় ইমপ্লিমেন্ট করো। `while` লুপ শর্ত সত্য থাকা পর্যন্ত বারবার চলে। একটি mutable accumulator ভেরিয়েবল এবং লুপ কাউন্টার ব্যবহার করে iteratively factorial গণনার অনুশীলন করো।"],"loc":"exercises/02_basic_calculator/06_while","f":[{"n":"src/lib.rs","s":[["c","// Rewrite the factorial function using a `while` loop.\npub fn factorial(n: u32) -> u32 {\n    // The `todo!()` macro is a placeholder that the compiler\n    // interprets as \"I'll get back to this later\", thus\n    // suppressing type errors.\n    // It panics at runtime.\n"],["g","    let mut result = 1;\n    let mut i = 1;\n    while i <= n {\n        result *= i;\n        i += 1;\n    }\n    result"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::factorial;\n\n    #[test]\n    fn first() {\n        assert_eq!(factorial(0), 1);\n    }\n\n    #[test]\n    fn second() {\n        assert_eq!(factorial(1), 1);\n    }\n\n    #[test]\n    fn third() {\n        assert_eq!(factorial(2), 2);\n    }\n\n    #[test]\n    fn fifth() {\n        assert_eq!(factorial(5), 120);\n    }\n}\n"]]}]},{"t":"10. Loops — for | লুপ — for","b":[["p","Path: 02_basic_calculator/07_for    |    Page Reference: 28"],["p","Practice using for loops and iterators in Rust."],["p","Rust's for loop iterates over anything that implements the IntoIterator trait. The most common usage is with ranges:"],["code","for i in 0..10 { /* 0, 1, ..., 9 */ }\nfor i in 0..=10 { /* 0, 1, ..., 10 */ }"],["p","Open exercises/02_basic_calculator/07_for/src/lib.rs and implement the required function using a for loop."],["p","Important concepts:"],["li","Ranges: a..b (exclusive end) vs a..=b (inclusive end)"],["li","Iterating over a collection: for item in collection { ... }"],["li","Iterator methods: .sum(), .product(), .count(), .enumerate(), .zip(), .map(), .filter()"],["li","Collecting results: iterator.collect::<Vec<_>>()"],["p","The tests check specific accumulation patterns. Using an iterator adapter chain (e.g., .map().sum()) is often more idiomatic in Rust than an explicit loop. Try both approaches."]],"n":10,"en":["Re-implement the factorial function once more, this time using a `for` loop with a range expression. Range syntax: `for i in 1..=n { ... }` iterates over the inclusive range [1, n]. The `..` operator creates an exclusive range and `..=` creates an inclusive range. For loops in Rust are actually iterators under the hood — any type implementing the `IntoIterator` trait can be used in a `for` loop. Practice this more idiomatic Rust style for bounded iteration."],"bt":["`for` লুপ ও range expression ব্যবহার করে factorial ফাংশন আবার ইমপ্লিমেন্ট করো। Range সিনট্যাক্স: `for i in 1..=n { ... }` inclusive range [1, n] iterate করে। `..` exclusive range এবং `..=` inclusive range তৈরি করে।"],"loc":"exercises/02_basic_calculator/07_for","f":[{"n":"src/lib.rs","s":[["c","// Rewrite the factorial function using a `for` loop.\npub fn factorial(n: u32) -> u32 {\n"],["g","    let mut result = 1;\n    for i in 1..=n {\n        result *= i;\n    }\n    result"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::factorial;\n\n    #[test]\n    fn first() {\n        assert_eq!(factorial(0), 1);\n    }\n\n    #[test]\n    fn second() {\n        assert_eq!(factorial(1), 1);\n    }\n\n    #[test]\n    fn third() {\n        assert_eq!(factorial(2), 2);\n    }\n\n    #[test]\n    fn fifth() {\n        assert_eq!(factorial(5), 120);\n    }\n}\n"]]}]},{"t":"11. Integer Overflow | পূর্ণসংখ্যার উপচে পড়া (Overflow)","b":[["p","Path: 02_basic_calculator/08_overflow    |    Page Reference: 31"],["p","Understand how Rust handles integer overflow."],["p","Unlike C/C++, Rust does not allow silent undefined behavior from integer overflow. Instead:"],["li","In debug builds: overflow causes a panic at runtime."],["li","In release builds: overflow wraps around (two's complement wrap)."],["p","Open exercises/02_basic_calculator/08_overflow/src/lib.rs and implement a function that deliberately avoids overflow by choosing an appropriate strategy."],["p","Overflow-safe methods available on integer types:"],["li","checked_add(rhs) → Option<T> — returns None on overflow"],["li","saturating_add(rhs) → T — clamps at the type's min/max"],["li","wrapping_add(rhs) → T — wraps around modulo 2^N"],["li","overflowing_add(rhs) → (T, bool) — returns (result, did_overflow)"],["p","The tests will exercise edge cases near integer boundaries (e.g., u8::MAX, i32::MIN). Use the appropriate overflow-aware method to satisfy each test case."]],"n":11,"en":["Understand how Rust handles integer overflow. In debug builds, Rust will panic at runtime when integer arithmetic overflows (e.g. `255u8 + 1`). In release builds (compiled with `--release`), the same operation wraps around silently. You can opt into specific overflow behaviours explicitly using the wrapping methods (`wrapping_add`, `wrapping_sub`, `wrapping_mul`), the checked methods (returning `Option`), or the saturating/overflowing methods. Modify a function to handle potential overflow by choosing the appropriate method."],"bt":["Rust কীভাবে integer overflow সামলায় তা বোঝো। Debug build-এ overflow হলে runtime panic হয়। Release build-এ (`--release`) একই অপারেশন silently wrap করে। `wrapping_add`, `wrapping_sub`, `wrapping_mul` বা checked/saturating মেথড ব্যবহার করে overflow সামলাও।"],"loc":"exercises/02_basic_calculator/08_overflow","f":[{"n":"src/lib.rs","s":[["c","// Customize the `dev` profile to wrap around on overflow.\n// Check Cargo's documentation to find out the right syntax:\n// https://doc.rust-lang.org/cargo/reference/profiles.html\n//\n// For reasons that we'll explain later, the customization needs to be done in the `Cargo.toml`\n// at the root of the repository, not in the `Cargo.toml` of the exercise.\n\npub fn factorial(n: u32) -> u32 {\n    let mut result = 1;\n    for i in 1..=n {\n        result *= i;\n    }\n    result\n}\n\n#[cfg(test)]\nmod tests {\n    use crate::factorial;\n\n    #[test]\n    fn twentieth() {\n        // 20! is 2432902008176640000, which is too large to fit in a u32\n        // With the default dev profile, this will panic when you run `cargo test`\n        // We want it to wrap around instead\n        assert_eq!(factorial(20), 2_192_834_560);\n        //                           ☝️\n        // A large number literal using underscores to improve readability!\n    }\n\n    #[test]\n    fn first() {\n        assert_eq!(factorial(0), 1);\n    }\n\n    #[test]\n    fn second() {\n        assert_eq!(factorial(1), 1);\n    }\n\n    #[test]\n    fn third() {\n        assert_eq!(factorial(2), 2);\n    }\n\n    #[test]\n    fn fifth() {\n        assert_eq!(factorial(5), 120);\n    }\n}\n"]]}]},{"t":"12. Saturating Arithmetic | স্যাচুরেটিং অ্যারিথমেটিক","b":[["p","Path: 02_basic_calculator/09_saturating    |    Page Reference: 32"],["p","This exercise focuses on saturating arithmetic — a strategy where values \"clamp\" at the type's minimum or maximum instead of overflowing."],["p","With saturating arithmetic:"],["li","u8::MAX.saturating_add(1) == 255 (stays at max, does not wrap to 0)"],["li","0u8.saturating_sub(1) == 0 (stays at min, does not go negative)"],["p","Open exercises/02_basic_calculator/09_saturating/src/lib.rs and implement a function that uses saturating operations to avoid panics and wrapping."],["p","Available methods on all integer primitives:"],["code","saturating_add, saturating_sub, saturating_mul, saturating_div, saturating_pow, saturating_neg (signed only)"],["p","Your implementation must not use checked_* or wrapping_* — use the saturating_* family exclusively where overflow could occur."],["p","Read the test cases carefully: they verify behaviour at the boundary values of the integer type being used."]],"n":12,"en":["Use saturating arithmetic to handle edge cases gracefully. Saturating operations clamp the result to the type's maximum or minimum value rather than wrapping or panicking. For example, `255u8.saturating_add(1)` returns `255` (not 0 or a panic). Similarly, `0u8.saturating_sub(1)` returns `0`. The standard library provides `saturating_add`, `saturating_sub`, `saturating_mul`, and `saturating_pow` methods on all integer types. Implement a function using saturating arithmetic to safely compute results without risk of overflow."],"bt":["Edge case গুলো সুন্দরভাবে সামলাতে saturating arithmetic ব্যবহার করো। Saturating অপারেশন ফলাফলকে টাইপের সর্বোচ্চ বা সর্বনিম্ন মানে ক্ল্যাম্প করে। উদাহরণ: `255u8.saturating_add(1)` রিটার্ন করে `255`। `saturating_add`, `saturating_sub`, `saturating_mul` মেথড ব্যবহার করো।"],"loc":"exercises/02_basic_calculator/09_saturating","f":[{"n":"src/lib.rs","s":[["c","pub fn factorial(n: u32) -> u32 {\n"],["g","    let mut result: u32 = 1;"],["c","    for i in 1..=n {\n        // Use saturating multiplication to stop at the maximum value of u32\n        // rather than overflowing and wrapping around\n"],["g","        result = result.saturating_mul(i);"],["c","    }\n    result\n}\n\n#[cfg(test)]\nmod tests {\n    use crate::factorial;\n\n    #[test]\n    fn twentieth() {\n        assert_eq!(factorial(20), u32::MAX);\n    }\n\n    #[test]\n    fn first() {\n        assert_eq!(factorial(0), 1);\n    }\n\n    #[test]\n    fn second() {\n        assert_eq!(factorial(1), 1);\n    }\n\n    #[test]\n    fn third() {\n        assert_eq!(factorial(2), 2);\n    }\n\n    #[test]\n    fn fifth() {\n        assert_eq!(factorial(5), 120);\n    }\n}\n"]]}]},{"t":"13. Type Casting with as | `as` দিয়ে টাইপ কাস্টিং","b":[["p","Path: 02_basic_calculator/10_as_casting    |    Page Reference: 34"],["p","Learn how to cast between numeric types using the as keyword."],["p","Rust requires explicit type conversions — there is no implicit numeric promotion. The as keyword performs a potentially lossy numeric cast:"],["code","let x: i32 = 300;\nlet y = x as u8; // y == 44 (truncated, wraps)"],["p","Open exercises/02_basic_calculator/10_as_casting/src/lib.rs and implement the function by casting between integer types as required by the tests."],["p","Important behaviour of as:"],["li","Narrowing casts (e.g., i32 → u8) truncate the high bits."],["li","Casting a negative signed integer to an unsigned type wraps around."],["li","Casting a floating-point to an integer truncates towards zero."],["li","Casting between same-width signed/unsigned types reinterprets the bits."],["p","The tests will give you both the input value and the expected cast result. Determine which casts are needed and apply them with as. Note any cases where the cast is lossy and understand why the test expects the specific output value it does."]],"n":13,"en":["Learn to convert between numeric types using Rust's `as` casting operator. The `as` keyword performs primitive type conversions: `let x: i32 = 5; let y = x as u32;`. When casting from a larger type to a smaller one, the value is truncated (the high bits are dropped). When casting from a signed type to unsigned, the bit pattern is preserved and reinterpreted. Use `as` carefully because it can silently lose information. The exercise requires you to apply `as` casting to bridge between two integer types in a calculation."],"bt":["Rust-এর `as` কাস্টিং অপারেটর ব্যবহার করে numeric টাইপের মধ্যে রূপান্তর করতে শেখো। `let x: i32 = 5; let y = x as u32;` এর মতো লেখো। বড় থেকে ছোট টাইপে কাস্ট করলে মান truncate হয়। `as` সাবধানে ব্যবহার করো কারণ এটি নিঃশব্দে তথ্য হারাতে পারে।"],"loc":"exercises/02_basic_calculator/10_as_casting","f":[{"n":"src/lib.rs","s":[["c","// TODO: based on what you learned in this section, replace `todo!()` with\n//  the correct value after the conversion.\n\n#[cfg(test)]\nmod tests {\n\n    #[test]\n    fn u16_to_u32() {\n"],["g","        let v: u32 = 47;"],["c","        assert_eq!(47u16 as u32, v);\n    }\n\n    #[test]\n    fn u8_to_i8() {\n        // The compiler is smart enough to know that the value 255 cannot fit\n        // inside an i8, so it'll emit a hard error. We intentionally disable\n        // this guardrail to make this (bad) conversion possible.\n        // The compiler is only able to pick on this because the value is a\n        // literal. If we were to use a variable, the compiler wouldn't be able to\n        // catch this at compile time.\n        #[allow(overflowing_literals)]\n        let x = { 255 as i8 };\n\n        // You could solve this by using exactly the same expression as above,\n        // but that would defeat the purpose of the exercise. Instead, use a genuine\n        // `i8` value that is equivalent to `255` when converted to `u8`.\n"],["g","        let y: i8 = -1;"],["c","\n        assert_eq!(x, y);\n    }\n\n    #[test]\n    fn bool_to_u8() {\n"],["g","        let v: u8 = 1;"],["c","        assert_eq!(true as u8, v);\n    }\n}\n"]]}]}]},{"id":"c3","t":"Chapter 3: Modelling a Ticket (Part 1)","k":"chapter","ex":[{"t":"14. Ticket Introduction | টিকেট পরিচিতি","b":[["p","Path: 03_ticket_v1/00_intro    |    Page Reference: 36"],["p","Introduction to modelling a domain entity — a \"Ticket\" — using Rust structs."],["p","This exercise marks the beginning of a multi-chapter project. You will build a simplified ticket-tracking system (think GitHub Issues or Jira tickets)."],["p","Open exercises/03_ticket_v1/00_intro/src/lib.rs. Your task is to make the initial scaffolding compile and the first test pass."],["p","At this stage, a Ticket has three fields:"],["li","title: String"],["li","description: String"],["li","status: String"],["p","You need to define the Ticket struct and provide a constructor or factory function as specified by the tests. Focus on getting the struct definition right and ensuring the field names and types match what the tests expect."],["p","This introductory exercise should be straightforward — the goal is to set up the foundation for the more complex exercises that follow in this chapter."]],"n":14,"en":["This is the intro to the Ticket modelling chapter, which covers structs, ownership, references and borrowing, and memory management (stack vs. heap). You will build a simple ticket-tracking data structure similar to a project-management task. The exercise asks you to set up the initial project structure and understand the topics to be covered: custom types with `struct`, Rust's ownership rules, references, and how memory is allocated and freed."],"bt":["এটি টিকেট মডেলিং অধ্যায়ের ভূমিকা, যা struct, ownership, references এবং borrowing, এবং মেমরি ম্যানেজমেন্ট (stack বনাম heap) কভার করে। একটি simple ticket-tracking ডেটা স্ট্রাকচার তৈরি করো।"],"loc":"exercises/03_ticket_v1/00_intro","f":[{"n":"src/lib.rs","s":[["c","fn intro() -> &'static str {\n    // TODO: fix me 👇\n"],["g","    \"I'm ready to start modelling a software ticket!\""],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::intro;\n\n    #[test]\n    fn test_intro() {\n        assert_eq!(intro(), \"I'm ready to start modelling a software ticket!\");\n    }\n}\n"]]}]},{"t":"15. Structs | স্ট্রাক্ট","b":[["p","Path: 03_ticket_v1/01_struct    |    Page Reference: 39"],["p","Deep dive into defining and instantiating structs in Rust."],["p","Structs are the primary way to group related data in Rust. A named-field struct looks like:"],["code","struct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}"],["p","Instantiation:"],["code","let t = Ticket { title: String::from(\"Fix bug\"), description: String::from(\"...\"), status: String::from(\"Open\") };"],["p","Open exercises/03_ticket_v1/01_struct/src/lib.rs. Your tasks:"],["p","1. Define the Ticket struct with the correct fields and types."],["p","2. Implement a new() associated function (constructor) that accepts the three field values and returns a Ticket instance."],["p","3. Ensure the struct fields are accessible in the tests as specified."],["p","Key points:"],["li","Use String (heap-allocated, owned) not &str (borrowed slice) for the fields."],["li","Associated functions are defined inside an impl Ticket { ... } block."],["li","Struct update syntax: Ticket { status: String::from(\"Done\"), ..other_ticket }"]],"n":15,"en":["Define a Rust struct to model a support ticket. A struct is a custom data type that groups related fields together. Define a `Ticket` struct with three fields: `title: String`, `description: String`, and `status: String`. Then implement a `Ticket::new` associated function (constructor) that creates a new `Ticket` instance from provided values. Practice the field access syntax (`ticket.title`) and the method call syntax (`ticket.method()`). Remember that `impl` blocks are used to attach methods and associated functions to a struct."],"bt":["একটি support ticket মডেল করতে Rust struct সংজ্ঞায়িত করো। `title: String`, `description: String`, এবং `status: String` তিনটি ফিল্ড সহ একটি `Ticket` struct তৈরি করো। তারপর `Ticket::new` associated function (constructor) ইমপ্লিমেন্ট করো।"],"loc":"exercises/03_ticket_v1/01_struct","f":[{"n":"src/lib.rs","s":[["c","// Define a struct named `Order` with the following fields:\n// - `price`, an unsigned integer\n// - `quantity`, an unsigned integer\n//\n// It should also have a method named `is_available` that returns a `true` if the quantity is\n// greater than 0, otherwise `false`.\n"],["g","struct Order {\n    price: u32,\n    quantity: u32,\n}\n\nimpl Order {\n    fn is_available(&self) -> bool {\n        self.quantity > 0\n    }\n}"],["c","\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_order_is_available() {\n        let order = Order {\n            price: 100,\n            quantity: 10,\n        };\n        assert!(order.is_available());\n    }\n\n    #[test]\n    fn test_order_is_not_available() {\n        let order = Order {\n            price: 100,\n            quantity: 0,\n        };\n        assert!(!order.is_available());\n    }\n}\n"]]}]},{"t":"16. Validation | বৈধতা যাচাই (Validation)","b":[["p","Path: 03_ticket_v1/02_validation    |    Page Reference: 40"],["p","Add validation logic to the Ticket constructor."],["p","Currently the Ticket::new() function accepts any strings — a caller could pass an empty title, an absurdly long description, or a nonsensical status value. This exercise adds input validation."],["p","Open exercises/03_ticket_v1/02_validation/src/lib.rs and update Ticket::new() to enforce these business rules:"],["code","1. Title must not be empty.\n2. Title must not exceed 50 characters.\n3. Description must not be empty.\n4. Description must not exceed 500 characters.\n5. Status must be one of: \"To-Do\", \"In Progress\", or \"Done\"."],["p","Violations should cause a panic with a descriptive message (e.g., panic!(\"Title cannot be empty\"))."],["p","Useful String methods:"],["li","s.is_empty() — true if the string has zero bytes"],["li","s.len() — byte length"],["li","s == \"To-Do\" — string equality comparison"],["p","The tests include both valid inputs (which should not panic) and invalid inputs wrapped in #[should_panic]."]],"n":16,"en":["Add input validation to the `Ticket::new` constructor. Currently any string can be passed as a title, description, or status. Improve this by panicking when invalid values are supplied: the title must not be empty and must not exceed 50 characters; the description must not be empty and must not exceed 500 characters; the status must be one of \"To-Do\", \"In Progress\", or \"Done\". Use `String` methods such as `.is_empty()`, `.len()`, and comparison operators. Check the `String` documentation for a full list of available methods."],"bt":["`Ticket::new` কনস্ট্রাক্টরে input validation যোগ করো। title খালি হওয়া চলবে না ও ৫০ অক্ষরের বেশি হওয়া চলবে না; description খালি হওয়া চলবে না ও ৫০০ অক্ষরের বেশি হওয়া চলবে না; status শুধুমাত্র \"To-Do\", \"In Progress\", বা \"Done\" হতে পারবে।"],"loc":"exercises/03_ticket_v1/02_validation","f":[{"n":"src/lib.rs","s":[["c","struct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\nimpl Ticket {\n    // TODO: implement the `new` function.\n    //  The following requirements should be met:\n    //   - Only `To-Do`, `In Progress`, and `Done` statuses are allowed.\n    //   - The `title` and `description` fields should not be empty.\n    //   - the `title` should be at most 50 bytes long.\n    //   - the `description` should be at most 500 bytes long.\n    //  The method should panic if any of the requirements are not met.\n    //  You can find the needed panic messages in the tests.\n    //\n    // You'll have to use what you learned in the previous exercises,\n    // as well as some `String` methods. Use the documentation of Rust's standard library\n    // to find the most appropriate options -> https://doc.rust-lang.org/std/string/struct.String.html\n    fn new(title: String, description: String, status: String) -> Self {\n"],["g","        if title.is_empty() {\n            panic!(\"Title cannot be empty\");\n        }\n        if title.len() > 50 {\n            panic!(\"Title cannot be longer than 50 bytes\");\n        }\n\n        if description.is_empty() {\n            panic!(\"Description cannot be empty\");\n        }\n        if description.len() > 500 {\n            panic!(\"Description cannot be longer than 500 bytes\");\n        }\n\n        if status != \"To-Do\" && status != \"In Progress\" && status != \"Done\" {\n            panic!(\"Only `To-Do`, `In Progress`, and `Done` statuses are allowed\");\n        }"],["c","        Self {\n            title,\n            description,\n            status,\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{overly_long_description, overly_long_title, valid_description, valid_title};\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be empty\")]\n    fn title_cannot_be_empty() {\n        Ticket::new(\"\".into(), valid_description(), \"To-Do\".into());\n    }\n\n    #[test]\n    #[should_panic(expected = \"Description cannot be empty\")]\n    fn description_cannot_be_empty() {\n        Ticket::new(valid_title(), \"\".into(), \"To-Do\".into());\n    }\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be longer than 50 bytes\")]\n    fn title_cannot_be_longer_than_fifty_chars() {\n        Ticket::new(overly_long_title(), valid_description(), \"To-Do\".into());\n    }\n\n    #[test]\n    #[should_panic(expected = \"Description cannot be longer than 500 bytes\")]\n    fn description_cannot_be_longer_than_500_chars() {\n        Ticket::new(valid_title(), overly_long_description(), \"To-Do\".into());\n    }\n\n    #[test]\n    #[should_panic(expected = \"Only `To-Do`, `In Progress`, and `Done` statuses are allowed\")]\n    fn status_must_be_valid() {\n        Ticket::new(valid_title(), valid_description(), \"Funny\".into());\n    }\n\n    #[test]\n    fn done_is_allowed() {\n        Ticket::new(valid_title(), valid_description(), \"Done\".into());\n    }\n\n    #[test]\n    fn in_progress_is_allowed() {\n        Ticket::new(valid_title(), valid_description(), \"In Progress\".into());\n    }\n}\n"]]}]},{"t":"17. Modules | মডিউল","b":[["p","Path: 03_ticket_v1/03_modules    |    Page Reference: 43"],["p","Organise Rust code using the module system."],["p","As projects grow, it becomes essential to split code into modules for better organisation and namespacing."],["p","Open exercises/03_ticket_v1/03_modules/src/lib.rs. You will find (or need to create) a module structure. Your task is to:"],["p","1. Declare modules using the mod keyword."],["p","2. Place the Ticket struct and its impl block inside the appropriate module."],["p","3. Use use statements or full paths to refer to items across modules."],["p","Key syntax:"],["code","mod helpers {\n    pub fn some_function() { ... }\n}\nuse helpers::some_function;"],["p","The module system also controls file organisation: mod foo; (without a block) looks for code in foo.rs or foo/mod.rs."],["p","The tests import items using the module path written in the test file — make your module structure match those import paths."]],"n":17,"en":["Organise your code into Rust modules. A module is declared with the `mod` keyword and creates a new namespace. You can have inline modules (`mod my_module { ... }`) or file-based modules (a file named `my_module.rs` or a directory `my_module/mod.rs`). Use `use` to bring items into scope and `super::` to refer to the parent module. The exercise asks you to split the ticket-related code into a separate module and properly expose the types and functions that need to be public. Visualise the module tree to check your structure."],"bt":["Rust মডিউল ব্যবহার করে কোড সংগঠিত করো। `mod` কীওয়ার্ড দিয়ে মডিউল ঘোষণা করো, যা একটি নতুন namespace তৈরি করে। `use` দিয়ে items scope-এ আনো এবং `super::` দিয়ে parent মডিউলে রেফার করো। টিকেট-সম্পর্কিত কোড একটি পৃথক মডিউলে বিভক্ত করো।"],"loc":"exercises/03_ticket_v1/03_modules","f":[{"n":"src/lib.rs","s":[["c","mod helpers {\n    // TODO: Make this code compile, either by adding a `use` statement or by using\n    //  the appropriate path to refer to the `Ticket` struct.\n"],["g","    use super::Ticket;"],["c","\n    fn create_todo_ticket(title: String, description: String) -> Ticket {\n        Ticket::new(title, description, \"To-Do\".into())\n    }\n}\n\nstruct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\nimpl Ticket {\n    fn new(title: String, description: String, status: String) -> Ticket {\n        if title.is_empty() {\n            panic!(\"Title cannot be empty\");\n        }\n        if title.len() > 50 {\n            panic!(\"Title cannot be longer than 50 bytes\");\n        }\n        if description.is_empty() {\n            panic!(\"Description cannot be empty\");\n        }\n        if description.len() > 500 {\n            panic!(\"Description cannot be longer than 500 bytes\");\n        }\n        if status != \"To-Do\" && status != \"In Progress\" && status != \"Done\" {\n            panic!(\"Only `To-Do`, `In Progress`, and `Done` statuses are allowed\");\n        }\n\n        Ticket {\n            title,\n            description,\n            status,\n        }\n    }\n}\n"]]}]},{"t":"18. Visibility | দৃশ্যমানতা (Visibility)","b":[["p","Path: 03_ticket_v1/04_visibility    |    Page Reference: 44"],["p","Control the visibility of Rust items using pub, pub(crate), and private access."],["p","By default, everything in Rust is private — only visible within the current module and its descendants. Visibility must be explicitly granted."],["p","Open exercises/03_ticket_v1/04_visibility/src/lib.rs. Your tasks:"],["p","1. Mark the Ticket struct as pub so it is accessible from outside its module."],["p","2. Make struct fields pub or keep them private and provide accessor methods."],["p","3. Mark the new() constructor as pub so callers can create Ticket instances."],["p","Visibility levels:"],["li","(no keyword) — private: only the current module and submodules"],["li","pub(crate) — visible anywhere within the crate"],["li","pub(super) — visible in the parent module"],["li","pub — fully public, visible to external crates too"],["p","The tests try to create Ticket instances from a different module — your visibility annotations must permit this while hiding internal details that should not be exposed."]],"n":18,"en":["Control what is accessible from outside a module using Rust's visibility modifiers. By default, all items in Rust are private to the module they are defined in. Use `pub` to make an item public (accessible from anywhere), `pub(crate)` to restrict access to within the same crate, and `pub(super)` to allow access from the parent module only. Apply the appropriate visibility modifiers to the `Ticket` struct and its fields so that the struct itself is public but certain fields remain private, enforcing encapsulation."],"bt":["Rust-এর visibility modifier ব্যবহার করে মডিউলের বাইরে থেকে কী অ্যাক্সেসযোগ্য তা নিয়ন্ত্রণ করো। ডিফল্টভাবে সব item private। `pub` দিয়ে public করো, `pub(crate)` দিয়ে একই crate-এ সীমাবদ্ধ করো, এবং `pub(super)` দিয়ে parent মডিউলে সীমাবদ্ধ করো।"],"loc":"exercises/03_ticket_v1/04_visibility","f":[{"n":"src/lib.rs","s":[["c","mod ticket {\n"],["g","    pub struct Ticket {"],["c","        title: String,\n        description: String,\n        status: String,\n    }\n\n    impl Ticket {\n"],["g","        pub fn new(title: String, description: String, status: String) -> Ticket {"],["c","            if title.is_empty() {\n                panic!(\"Title cannot be empty\");\n            }\n            if title.len() > 50 {\n                panic!(\"Title cannot be longer than 50 bytes\");\n            }\n            if description.is_empty() {\n                panic!(\"Description cannot be empty\");\n            }\n            if description.len() > 500 {\n                panic!(\"Description cannot be longer than 500 bytes\");\n            }\n            if status != \"To-Do\" && status != \"In Progress\" && status != \"Done\" {\n                panic!(\"Only `To-Do`, `In Progress`, and `Done` statuses are allowed\");\n            }\n\n            Ticket {\n                title,\n                description,\n                status,\n            }\n        }\n    }\n}\n\n// TODO: **Exceptionally**, you'll be modifying both the `ticket` module and the `tests` module\n//  in this exercise.\n#[cfg(test)]\nmod tests {\n    // TODO: Add the necessary `pub` modifiers in the parent module to remove the compiler\n    //  errors about the use statement below.\n    use super::ticket::Ticket;\n\n    // Be careful though! We don't want this function to compile after you have changed\n    // visibility to make the use statement compile!\n    // Once you have verified that it indeed doesn't compile, comment it out.\n    fn should_not_be_possible() {\n        let ticket = Ticket::new(\"A title\".into(), \"A description\".into(), \"To-Do\".into());\n\n        // You should be seeing this error when trying to run this exercise:\n        //\n        // error[E0616]: field `description` of struct `Ticket` is private\n        //    |\n        //    |              assert_eq!(ticket.description, \"A description\");\n        //    |                         ^^^^^^^^^^^^^^^^^^\n        //\n        // TODO: Once you have verified that the below does not compile,\n        //   comment the line out to move on to the next exercise!\n"],["g","        // assert_eq!(ticket.description, \"A description\");"],["c","    }\n\n    fn encapsulation_cannot_be_violated() {\n        // This should be impossible as well, with a similar error as the one encountered above.\n        // (It will throw a compilation error only after you have commented the faulty line\n        // in the previous test - next compilation stage!)\n        //\n        // This proves that `Ticket::new` is now the only way to get a `Ticket` instance.\n        // It's impossible to create a ticket with an illegal title or description!\n        //\n        // TODO: Once you have verified that the below does not compile,\n        //   comment the lines out to move on to the next exercise!\n"],["g","        // let ticket = Ticket {\n        //     title: \"A title\".into(),\n        //     description: \"A description\".into(),\n        //     status: \"To-Do\".into(),\n        // };"],["c","    }\n}\n"]]}]},{"t":"19. Encapsulation | এনক্যাপসুলেশন","b":[["p","Path: 03_ticket_v1/05_encapsulation    |    Page Reference: 46"],["p","Encapsulate the Ticket struct so that its fields are private but accessible via public methods."],["p","Encapsulation is a design principle that hides implementation details and exposes only a controlled interface. In Rust, this is achieved by making struct fields private and providing public accessor (getter) methods."],["p","Open exercises/03_ticket_v1/05_encapsulation/src/lib.rs and:"],["p","1. Make all fields of Ticket private (remove any pub from the fields)."],["p","2. Keep Ticket::new() public so callers can create instances."],["p","3. Add public getter methods:"],["code","pub fn title(&self) -> &str { &self.title }\npub fn description(&self) -> &str { &self.description }\npub fn status(&self) -> &str { &self.status }"],["p","Note that the getters return &str (a borrowed string slice), not String. This avoids unnecessary cloning."],["p","The tests will call these getter methods to inspect a Ticket's data after construction. Ensure the validation from the previous exercise (Exercise 16) is still enforced in new()."]],"n":19,"en":["Achieve proper encapsulation by making struct fields private and exposing only accessor (getter) methods. Once a field is private, code outside the module cannot read or modify it directly. Add public getter methods `title(&self) -> &str`, `description(&self) -> &str`, and `status(&self) -> &str` to the `Ticket` struct. These methods borrow `self` immutably (using `&self`) and return a reference to the field value. This pattern prevents external code from reading internal state directly and is the standard Rust approach to encapsulation."],"bt":["struct field গুলো private করে এবং শুধুমাত্র accessor (getter) মেথড expose করে সঠিক encapsulation অর্জন করো। `title(&self) -> &str`, `description(&self) -> &str`, এবং `status(&self) -> &str` পাবলিক getter মেথড যোগ করো।"],"loc":"exercises/03_ticket_v1/05_encapsulation","f":[{"n":"src/lib.rs","s":[["c","pub mod ticket {\n    pub struct Ticket {\n        title: String,\n        description: String,\n        status: String,\n    }\n\n    impl Ticket {\n        pub fn new(title: String, description: String, status: String) -> Ticket {\n            if title.is_empty() {\n                panic!(\"Title cannot be empty\");\n            }\n            if title.len() > 50 {\n                panic!(\"Title cannot be longer than 50 bytes\");\n            }\n            if description.is_empty() {\n                panic!(\"Description cannot be empty\");\n            }\n            if description.len() > 500 {\n                panic!(\"Description cannot be longer than 500 bytes\");\n            }\n            if status != \"To-Do\" && status != \"In Progress\" && status != \"Done\" {\n                panic!(\"Only `To-Do`, `In Progress`, and `Done` statuses are allowed\");\n            }\n\n            Ticket {\n                title,\n                description,\n                status,\n            }\n        }\n\n        // TODO: Add three public methods to the `Ticket` struct:\n        //  - `title` that returns the `title` field.\n        //  - `description` that returns the `description` field.\n        //  - `status` that returns the `status` field.\n"],["g","        pub fn title(self) -> String {\n            self.title\n        }\n\n        pub fn description(self) -> String {\n            self.description\n        }\n\n        pub fn status(self) -> String {\n            self.status\n        }"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::ticket::Ticket;\n\n    #[test]\n    fn description() {\n        let ticket = Ticket::new(\"A title\".into(), \"A description\".into(), \"To-Do\".into());\n        assert_eq!(ticket.description(), \"A description\");\n    }\n\n    #[test]\n    fn title() {\n        let ticket = Ticket::new(\"A title\".into(), \"A description\".into(), \"To-Do\".into());\n        assert_eq!(ticket.title(), \"A title\");\n    }\n\n    #[test]\n    fn status() {\n        let ticket = Ticket::new(\"A title\".into(), \"A description\".into(), \"To-Do\".into());\n        assert_eq!(ticket.status(), \"To-Do\");\n    }\n}\n"]]}]},{"t":"20. Ownership | মালিকানা (Ownership)","b":[["p","Path: 03_ticket_v1/06_ownership    |    Page Reference: 51"],["p","Understand Rust's ownership system — the core of Rust's memory safety guarantees."],["p","Rust's ownership rules:"],["code","1. Every value has exactly one owner.\n2. When the owner goes out of scope, the value is dropped (memory freed).\n3. Ownership can be transferred (moved) to another variable."],["p","Open exercises/03_ticket_v1/06_ownership/src/lib.rs. The exercise will demonstrate situations where ownership is moved and where it causes compile errors if you try to use a value after it has been moved."],["p","Key scenarios:"],["li","let t2 = t1; — t1 is moved into t2; t1 is no longer accessible."],["li","Passing a value to a function moves it into the function."],["li","Returning a value from a function moves it to the caller."],["li","Types that implement Copy (like integers) are copied instead of moved."],["p","Your task: fix the code so that the tests compile and pass. You may need to clone values, restructure the ownership transfer, or adjust the function signatures to take references instead of owned values."]],"n":20,"en":["Understand Rust's ownership system — the foundation of its memory safety guarantees. Every value in Rust has exactly one owner at any time. When the owner goes out of scope, the value is dropped (memory freed). Ownership can be transferred (moved) to another variable or function. Once a value has been moved, the original variable can no longer be used. Practice ownership transfer by working with `String` values and understanding when the compiler reports \"value used after move\" errors. Use borrowing (references) when you only need temporary access without transferring ownership."],"bt":["Rust-এর ownership সিস্টেম বোঝো — এটি Rust-এর মেমরি সেফটি গ্যারান্টির ভিত্তি। প্রতিটি মানের ঠিক একজন owner থাকে। owner scope-এর বাইরে গেলে মান drop হয়। ownership transfer (move) করা যায়। `String` মান নিয়ে কাজ করে ownership transfer অনুশীলন করো।"],"loc":"exercises/03_ticket_v1/06_ownership","f":[{"n":"src/lib.rs","s":[["c","// TODO: based on what we just learned about ownership, it sounds like immutable references\n//   are a good fit for our accessor methods.\n//   Change the existing implementation of `Ticket`'s accessor methods to take a reference\n//   to `self` as an argument, rather than taking ownership of it.\n\npub struct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\nimpl Ticket {\n    pub fn new(title: String, description: String, status: String) -> Ticket {\n        if title.is_empty() {\n            panic!(\"Title cannot be empty\");\n        }\n        if title.len() > 50 {\n            panic!(\"Title cannot be longer than 50 bytes\");\n        }\n        if description.is_empty() {\n            panic!(\"Description cannot be empty\");\n        }\n        if description.len() > 500 {\n            panic!(\"Description cannot be longer than 500 bytes\");\n        }\n        if status != \"To-Do\" && status != \"In Progress\" && status != \"Done\" {\n            panic!(\"Only `To-Do`, `In Progress`, and `Done` statuses are allowed\");\n        }\n\n        Ticket {\n            title,\n            description,\n            status,\n        }\n    }\n\n"],["g","    pub fn title(&self) -> &String {\n        &self.title"],["c","    }\n\n"],["g","    pub fn description(&self) -> &String {\n        &self.description"],["c","    }\n\n"],["g","    pub fn status(&self) -> &String {\n        &self.status"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::Ticket;\n\n    #[test]\n    fn works() {\n        let ticket = Ticket::new(\"A title\".into(), \"A description\".into(), \"To-Do\".into());\n        // If you change the signatures as requested, this should compile:\n        // we can call these methods one after the other because they borrow `self`\n        // rather than taking ownership of it.\n        assert_eq!(ticket.title(), \"A title\");\n        assert_eq!(ticket.description(), \"A description\");\n        assert_eq!(ticket.status(), \"To-Do\");\n    }\n}\n"]]}]},{"t":"21. Mutable References / Setters | মিউটেবল রেফারেন্স / সেটার","b":[["p","Path: 03_ticket_v1/07_setters    |    Page Reference: 54"],["p","Add setter methods to Ticket that allow modifying individual fields after construction."],["p","While the Ticket struct has private fields and a constructor with validation, there is currently no way to update a ticket after it has been created. This exercise adds setter methods."],["p","Open exercises/03_ticket_v1/07_setters/src/lib.rs and add:"],["code","pub fn set_title(&mut self, new_title: String) { ... }\npub fn set_description(&mut self, new_description: String) { ... }\npub fn set_status(&mut self, new_status: String) { ... }"],["p","Requirements:"],["p","1. Each setter must validate its input using the same rules as the constructor (Exercise 16): reject empty strings, titles > 50 chars, descriptions > 500 chars, invalid status values."],["p","2. The parameter takes &mut self — the method needs a mutable reference to self."],["p","3. The caller must declare the variable as mut: let mut ticket = Ticket::new(...);"],["p","The tests will create a ticket, call a setter, and then verify the field was updated correctly. They will also verify that invalid inputs still panic."]],"n":21,"en":["Add setter methods to `Ticket` that allow callers to modify field values after construction. There are two approaches: take `&mut self` (mutable reference to self) and mutate the field in place, or take `self` (ownership), update the field, and return the modified struct. Implement `set_title`, `set_description`, and `set_status` methods. When you take `&mut self`, at most one mutable reference to a value may exist at any time (the borrow checker enforces this). Methods that take `self` and return `Self` can be chained: `ticket.set_title(...).set_description(...)...`."],"bt":["`Ticket`-এ setter মেথড যোগ করো যা কলারদের তৈরির পরে field মান পরিবর্তন করতে দেয়। `&mut self` নিয়ে in-place পরিবর্তন করার পদ্ধতি বা `self` ownership নিয়ে পরিবর্তন করে struct রিটার্ন করার পদ্ধতি — দুটি approach আছে। `set_title`, `set_description`, এবং `set_status` মেথড ইমপ্লিমেন্ট করো।"],"loc":"exercises/03_ticket_v1/07_setters","f":[{"n":"src/lib.rs","s":[["c","// TODO: Add &mut-setters to the `Ticket` struct for each of its fields.\n//   Make sure to enforce the same validation rules you have in `Ticket::new`!\n//   Even better, extract that logic and reuse it in both places. You can use\n//   private functions or private static methods for that.\n\npub struct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\nimpl Ticket {\n    pub fn new(title: String, description: String, status: String) -> Ticket {\n"],["g","        validate_title(&title);\n        validate_description(&description);\n        validate_status(&status);"],["c","\n        Ticket {\n            title,\n            description,\n            status,\n        }\n    }\n\n    pub fn title(&self) -> &String {\n        &self.title\n    }\n\n    pub fn description(&self) -> &String {\n        &self.description\n    }\n\n    pub fn status(&self) -> &String {\n        &self.status\n"],["g","    }\n\n    pub fn set_title(&mut self, title: String) {\n        validate_title(&title);\n        self.title = title;\n    }\n\n    pub fn set_description(&mut self, description: String) {\n        validate_description(&description);\n        self.description = description;\n    }\n\n    pub fn set_status(&mut self, status: String) {\n        validate_status(&status);\n        self.status = status;\n    }\n}\n\nfn validate_title(title: &String) {\n    if title.is_empty() {\n        panic!(\"Title cannot be empty\");\n    }\n    if title.len() > 50 {\n        panic!(\"Title cannot be longer than 50 bytes\");\n    }\n}\n\nfn validate_description(description: &String) {\n    if description.is_empty() {\n        panic!(\"Description cannot be empty\");\n    }\n    if description.len() > 500 {\n        panic!(\"Description cannot be longer than 500 bytes\");\n    }\n}\n\nfn validate_status(status: &String) {\n    if status != \"To-Do\" && status != \"In Progress\" && status != \"Done\" {\n        panic!(\"Only `To-Do`, `In Progress`, and `Done` statuses are allowed\");"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::Ticket;\n    use common::{overly_long_description, overly_long_title, valid_description, valid_title};\n\n    #[test]\n    fn works() {\n        let mut ticket = Ticket::new(\"A title\".into(), \"A description\".into(), \"To-Do\".into());\n        ticket.set_title(\"A new title\".into());\n        ticket.set_description(\"A new description\".into());\n        ticket.set_status(\"Done\".into());\n\n        assert_eq!(ticket.title(), \"A new title\");\n        assert_eq!(ticket.description(), \"A new description\");\n        assert_eq!(ticket.status(), \"Done\");\n    }\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be empty\")]\n    fn title_cannot_be_empty() {\n        Ticket::new(valid_title(), valid_description(), \"To-Do\".into()).set_title(\"\".into());\n    }\n\n    #[test]\n    #[should_panic(expected = \"Description cannot be empty\")]\n    fn description_cannot_be_empty() {\n        Ticket::new(valid_title(), valid_description(), \"To-Do\".into()).set_description(\"\".into());\n    }\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be longer than 50 bytes\")]\n    fn title_cannot_be_longer_than_fifty_chars() {\n        Ticket::new(valid_title(), valid_description(), \"To-Do\".into())\n            .set_title(overly_long_title())\n    }\n\n    #[test]\n    #[should_panic(expected = \"Description cannot be longer than 500 bytes\")]\n    fn description_cannot_be_longer_than_500_chars() {\n        Ticket::new(valid_title(), valid_description(), \"To-Do\".into())\n            .set_description(overly_long_description())\n    }\n\n    #[test]\n    #[should_panic(expected = \"Only `To-Do`, `In Progress`, and `Done` statuses are allowed\")]\n    fn status_must_be_valid() {\n        Ticket::new(valid_title(), valid_description(), \"To-Do\".into()).set_status(\"Funny\".into());\n    }\n}\n"]]}]},{"t":"22. Stack Memory Layout | স্ট্যাক মেমরি লেআউট","b":[["p","Path: 03_ticket_v1/08_stack    |    Page Reference: 56"],["p","Understand how Rust allocates data on the stack vs the heap."],["p","The stack stores data of fixed, known size. Stack allocation and deallocation are extremely fast (just moving a stack pointer)."],["p","Open exercises/03_ticket_v1/08_stack/src/lib.rs. This exercise explores which types live on the stack and why."],["p","Stack-allocated types:"],["li","All primitive integer and float types (i32, f64, etc.)"],["li","bool, char"],["li","Fixed-size arrays: [T; N]"],["li","Tuples of stack-allocated types"],["li","Structs/enums composed entirely of stack types"],["p","Types NOT on the stack (heap-allocated):"],["li","String (stores its buffer on the heap)"],["li","Vec<T> (heap-allocated buffer)"],["li","Box<T> (explicit heap allocation)"],["p","Your task is to understand how the Ticket struct (which contains String fields) is laid out in memory — the struct itself is on the stack (the three String fat-pointer values), but the actual text data resides on the heap."],["p","Implement or fix the function in the exercise to demonstrate stack vs heap understanding as required by the tests."]],"n":22,"en":["Explore how values are laid out on the stack. The stack is a region of memory used for local variables and function call frames; it operates in a last-in, first-out (LIFO) manner. Stack-allocated values have a fixed, compile-time-known size. For example, `u8` is 1 byte, `u32` is 4 bytes, and `bool` is 1 byte. Use `std::mem::size_of::<T>()` to determine the size of a type. Practice printing the sizes of various types and understanding how struct fields contribute to the overall struct size."],"bt":["মানগুলো stack-এ কীভাবে সাজানো থাকে তা অন্বেষণ করো। Stack হলো local variable ও function call frame-এর জন্য ব্যবহৃত মেমরির একটি অংশ। `std::mem::size_of::<T>()` ব্যবহার করে টাইপের আকার নির্ধারণ করো।"],"loc":"exercises/03_ticket_v1/08_stack","f":[{"n":"src/lib.rs","s":[["c","// TODO: based on what you learned in this section, replace `todo!()` with\n//  the correct **stack size** for the respective type.\n#[cfg(test)]\nmod tests {\n    use std::mem::size_of;\n\n    #[test]\n    fn u16_size() {\n"],["g","        assert_e
