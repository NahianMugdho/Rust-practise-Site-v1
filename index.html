() {\n    setDisplay(\"0\"); setFirstNum(\"\"); setOperator(\"\");\n    setExpression(\"\"); setWaitingForSecond(false);\n  }"]]},{"t":"ধাপ ৫.৩ (শেষ): বাটন লেআউট ও App.tsx","b":[["code","  const buttons = [\n    [\"C\", \"+/-\", \"%\", \"÷\"],\n    [\"7\", \"8\", \"9\", \"×\"],\n    [\"4\", \"5\", \"6\", \"−\"],\n    [\"1\", \"2\", \"3\", \"+\"],\n    [\"0\", \".\", \"=\"],\n  ];\n  function handleButton(btn: string) {\n    if (\"0123456789\".includes(btn)) handleNumber(btn);\n    else if (btn === \".\") handleDecimal();\n    else if (btn === \"C\") handleClear();\n    else if (btn === \"=\") handleEquals();\n    else if (btn === \"÷\") handleOperator(\"/\");\n    else if (btn === \"×\") handleOperator(\"*\");\n    else if (btn === \"−\") handleOperator(\"-\");\n    else if (btn === \"+\") handleOperator(\"+\");\n  }\n  // return: <Display .../> + buttons.map(row => row.map(btn => <button onClick={() => handleButton(btn)}>{btn}<\/button>))\n}"],["code","import Calculator from \"./components/Calculator\";\nimport \"./App.css\";\nfunction App() { return (<div className=\"app\"><Calculator /><\/div>); }\nexport default App;"],["p","বাকি `%` ও `+/-` হ্যান্ডলার এবং `App.css` (iPhone-style রঙ: btn-gray, btn-orange, btn-dark) PDF-এ আছে; এগুলো দেখতে সম্পর্কিত।"]]},{"t":"ধাপ ৬–৯: Run, Build, কনফিগ","b":[["code","npm run tauri dev\nnpm run tauri build"],["p","Windows exe: `src-tauri/target/release/tauri-calculator.exe`; installer: `.../release/bundle/`।"],["code","{\n  \"app\": { \"windows\": [ { \"title\": \"আমার Calculator\", \"width\": 360, \"height\": 620, \"resizable\": false } ] },\n  \"bundle\": { \"identifier\": \"com.yourname.calculator\", \"productName\": \"Calculator\" }\n}"],["p","নতুন command বানাতে: `#[tauri::command]` ফাংশন লেখো → `generate_handler![calculate, my_new_command]` এ যোগ করো → React-এ `invoke(\"my_new_command\", {...})`।"]]}]},{"id":"p_note","t":"Note Taker অ্যাপ (Tauri)","k":"steps","s":[{"t":"১. প্রজেক্ট সম্পর্কে","b":[["p","আমরা একটি ছোট 'Note Taker' Desktop App বানাবো — যেখানে ব্যবহারকারী নোট লিখতে পারবে, সেভ করতে পারবে, এবং আগের নোটগুলো দেখতে পারবে। Tauri-এর frontend হবে HTML + CSS + JavaScript, আর backend হবে Rust।"],["h",3,"কী কী শিখবে এই প্রজেক্টে"],["p","Tauri কীভাবে কাজ করে (Process Model, WebView, Core)"],["p","Frontend (JS) থেকে Rust function কল করা — Commands"],["p","Rust থেকে Frontend-এ data পাঠানো — Events"],["p","Tauri-এর Permissions ও Capabilities সিস্টেম"],["p","Basic Rust: functions, structs, error handling"]]},{"t":"২. Prerequisites — কী ইনস্টল করতে হবে","b":[["p","Tauri ব্যবহার করতে হলে Tauri Slideshow অনুযায়ী একটি Rust toolchain এবং Node.js অবশ্যই লাগবে।"],["tbl",[["Step 1","Rust Toolchain ইনস্টল করো\nrustup.rs থেকে Rust ইনস্টল করো। Windows-এ Visual Studio C++ Build Tools লাগবে।"]]],["code","# Linux / macOS\ncurl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh"],["p","# ইনস্টলের পর verify করো"],["code","rustc --version\ncargo --version"],["tbl",[["Step 2","Node.js ইনস্টল করো\nnodejs.org থেকে LTS version ডাউনলোড করো (v18+ recommended)।"]]],["code","node --version\nnpm --version"],["tbl",[["Step 3","System Dependencies (Linux হলে)\nLinux-এ WebView2 এবং GTK লাইব্রেরি লাগে।"]]],["code","# Ubuntu/Debian\nsudo apt update\nsudo apt install libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev \\\n  libayatana-appindicator3-dev librsvg2-dev"],["tbl",[["Step 4","IDE Setup\nVS Code রেকমেন্ড করা হয় (Tauri Slideshow-এ উল্লেখ আছে)। rust-analyzer এবং Tauri extension ইনস্টল করো।"]]],["code","💡 Note: Tauri Slideshow-এ বলা আছে — 'Regarding IDEs, the recommended setup is VS Code, Neovim or Jetbrains IDEs.' তুমি যেকোনো একটি বেছে নিতে পারো।"]]},{"t":"৩. প্রজেক্ট তৈরি করো","b":[["p","Tauri Slideshow-এ উল্লেখ করা হয়েছে দুটি প্রাইমারি টুলের কথা: create-tauri-app (scaffolding-এর জন্য) এবং Tauri CLI। আমরা create-tauri-app ব্যবহার করবো।"],["tbl",[["Step 1","create-tauri-app দিয়ে প্রজেক্ট তৈরি\nনিচের কমান্ড রান করো এবং প্রশ্নের উত্তরগুলো নোট করো।"]]],["code","npm create tauri-app@latest note-taker"],["p","# যা যা জিজ্ঞেস করবে:"],["code","# Project name: note-taker"],["p","# Frontend language: TypeScript / JavaScript  -->  JavaScript বেছে নাও"],["code","# Package manager: npm"],["p","# UI template: Vanilla  (কোনো framework নয়)"],["tbl",[["Step 2","প্রজেক্ট ফোল্ডারে যাও এবং dependencies ইনস্টল করো\n"]]],["code","cd note-taker\nnpm install"],["tbl",[["Step 3","প্রজেক্ট স্ট্রাকচার বোঝো\nTauri Slideshow বলে — 'Rust code and Tauri configuration live in the src-tauri folder'"]]],["code","note-taker/\n├── src/                    <-- Frontend: HTML, CSS, JS\n│   ├── index.html\n│   ├── main.js\n│   └── styles.css\n├── src-tauri/              <-- Backend: Rust + Tauri config\n│   ├── src/\n│   │   └── main.rs         <-- Rust entry point\n│   ├── Cargo.toml          <-- Rust dependencies\n│   └── tauri.conf.json     <-- Tauri configuration\n├── package.json\n└── index.html"],["tbl",[["Step 4","Dev mode-এ রান করো\nসবকিছু ঠিক আছে কিনা দেখো।"]]],["code","npm run tauri dev"],["p","# প্রথমবার build করতে কয়েক মিনিট লাগবে (Rust compile করছে)"],["p","# সফল হলে একটি desktop window খুলবে"]]},{"t":"৪. Rust Backend — Commands লেখো","b":[["p","Tauri-এ frontend (JS) থেকে Rust function কল করার পদ্ধতিকে বলা হয় 'Commands'। Tauri Slideshow-এ বলা আছে: 'Every call is a command' এবং payload-এ Serde::Deserialize implement করতে হয়।"],["h",2,"src-tauri/src/main.rs"],["p","নিচের পুরো কোডটি main.rs-এ রিপ্লেস করো:"],["code","// Prevents additional console window on Windows in release\n#![cfg_attr(not(debug_assertions), windows_subsystem = \"windows\")]\nuse std::fs;\nuse std::sync::Mutex;\nuse tauri::State;"],["p","// ১. Struct — নোটগুলো মেমোরিতে রাখার জন্য"],["code","struct AppState {\n    notes: Mutex<Vec<String>>,\n}"],["p","// ২. Command — নোট সেভ করা (JS থেকে কল হবে)"],["code","#[tauri::command]\nfn save_note(note: String, state: State<AppState>) -> Result<String, String> {\n    let mut notes = state.notes.lock().map_err(|e| e.to_string())?;\n    notes.push(note.clone());"],["p","// ফাইলে সেভ করো"],["code","    let content = notes.join(\"\\n---\\n\");\n    fs::write(\"notes.txt\", &content).map_err(|e| e.to_string())?;\n    Ok(format!(\"Note saved! Total notes: {}\", notes.len()))\n}"],["p","// ৩. Command — সব নোট লোড করা"],["code","#[tauri::command]\nfn get_notes(state: State<AppState>) -> Vec<String> {\n    let notes = state.notes.lock().unwrap();\n    notes.clone()\n}"],["p","// ৪. Command — সব নোট ক্লিয়ার করা"],["code","#[tauri::command]\nfn clear_notes(state: State<AppState>) -> Result<String, String> {\n    let mut notes = state.notes.lock().map_err(|e| e.to_string())?;\n    notes.clear();\n    fs::write(\"notes.txt\", \"\").map_err(|e| e.to_string())?;\n    Ok(\"All notes cleared!\".to_string())\n}"],["p","// ৫. App entry point"],["code","fn main() {"],["p","// ফাইল থেকে আগের নোট লোড করো"],["code","    let saved = fs::read_to_string(\"notes.txt\").unwrap_or_default();\n    let initial_notes: Vec<String> = saved\n        .split(\"\\n---\\n\")\n        .filter(|s| !s.trim().is_empty())\n        .map(|s| s.to_string())\n        .collect();\n    tauri::Builder::default()\n        .manage(AppState {\n            notes: Mutex::new(initial_notes),\n        })\n        .invoke_handler(tauri::generate_handler![\n            save_note,\n            get_notes,\n            clear_notes\n        ])\n        .run(tauri::generate_context!())\n        .expect(\"error while running tauri application\");\n}"],["h",3,"Rust Concepts যা এখানে ব্যবহার হয়েছে (Comprehensive Rust Day 1-3 থেকে)"],["p","struct AppState — custom data type"],["p","Mutex<Vec<String>> — thread-safe shared state (concurrency safety)"],["p","#[tauri::command] — macro, Rust-এর powerful feature"],["p","Result<T, E> — error handling (Ok/Err pattern)"],["p","State<AppState> — Tauri dependency injection"],["p","unwrap_or_default() — safe default value"]]},{"t":"৫. Permissions সেটআপ","b":[["p","Tauri Slideshow-এ বলা আছে: 'Permissions give explicit privileges to commands' এবং 'IPC is the only let CB=[];
function gapHTML(code,max){
  let n=0,k=0;
  return esc(code).replace(/[A-Za-z_][A-Za-z_0-9]*/g,m=>{
    if(!KW.has(m))return m;
    const hide=(k++%3===1)&&n<(max||8);
    if(!hide)return m;n++;
    return `<input class="gap" data-a="${m}" style="--w:${Math.max(m.length,3)+2}ch" size="${m.length}" autocomplete="off" spellcheck="false">`;
  });
}
function codeBlock(code,gap,forceMax){
  const i=CB.push(code)-1,r=isRust(code);
  return `<div class="cb" data-i="${i}" data-g="${gap?1:0}"><pre>${gap?gapHTML(code,forceMax):esc(code)}</pre>${r&&!gap?`<button class="tg">গ্যাপ মোড</button>`:""}${r&&gap?`<button class="tg">পুরো কোড</button>`:""}</div>`;
}
function blocks(bs){
  let h="",ul=false;
  for(const b of bs){
    if(b[0]!=="li"&&ul){h+="</ul>";ul=false}
    if(b[0]==="h")h+=b[1]<=2?`<h3>${esc(b[2])}</h3>`:`<h4>${esc(b[2])}</h4>`;
    else if(b[0]==="p")h+=`<p>${esc(b[1]).replace(/`([^`]+)`/g,"<code>$1</code>")}</p>`;
    else if(b[0]==="li"){if(!ul){h+="<ul>";ul=true}h+=`<li>${esc(b[1])}</li>`}
    else if(b[0]==="code")h+=codeBlock(b[1],false);
    else if(b[0]==="tbl")h+="<table>"+b[1].map((r,i)=>"<tr>"+r.map(c=>`<${i?"td":"th"}>${esc(c)}</${i?"td":"th"}>`).join("")+"</tr>").join("")+"</table>";
  }
  return h+(ul?"</ul>":"");
}

const sec=(ic,t,h)=>`<div class="sec"><h4>${ic} ${t}</h4>${h}</div>`;
const head=(e,i,badge)=>{const [en,bn]=sp(e.t);return `<summary><span class="num">${e.n||i+1}</span><span class="tt"><b>${esc(en)}</b>${bn?`<small>${esc(bn)}</small>`:""}</span><span class="dn">${badge||""}</span></summary>`};
const chips=e=>`<div class="chips">${e.loc?`<span>📁 ${esc(e.loc)}</span>`:""}${pg(e)?`<span>📖 বই, পৃষ্ঠা ${pg(e)}</span>`:""}${(e.f||[]).map(f=>`<span>📄 ${esc(f.n)}</span>`).join("")}</div>`;
const noDesc=e=>!(e.bt&&e.bt.length)&&!(e.en&&e.en.length);
const qsec=(e,L)=>{let h="";
  if(noDesc(e))h=blocks((e.b||[]).slice(1));
  else{if(L!=="en"&&e.bt&&e.bt.length)h+=`<div class="bn">${para(e.bt)}</div>`;if(L!=="bn"&&e.en&&e.en.length)h+=`<div class="en">${para(e.en)}</div>`}
  return sec("🎯","প্রশ্ন — কী করতে হবে",h||"<p>নিচের কোড ও নোট দেখো।</p>")};
const howto=e=>{if(!e.loc)return "";const fl=(e.f||[]).map(f=>`<code>${esc(f.n)}</code>`).join(", ")||"ফাইল";
  return sec("▶","কীভাবে করবে",`<ol class="how"><li>রিপোজিটরির রুট থেকে টার্মিনালে যাও: <code>cd ${esc(e.loc)}</code></li><li>${hasGap(e)?`${fl} খুলে ✏️ চিহ্নিত জায়গায় নিজের কোড লেখো (টেস্ট বদলাবে না)।`:`${fl} মন দিয়ে পড়ো ও বোঝো; এখানে আলাদা কোড লেখার দরকার নেই।`}</li><li><code>cargo test</code> চালাও — সব টেস্টে <b>ok</b> এলে সফল।</li></ol>`)};
const tsec=e=>{const a=asserts(e);return a.length?sec("✅","টেস্ট যা পাস করতে হবে",`<pre class="tests">${a.map(esc).join("\n")}</pre><p class="mt">এই লাইনগুলো দেখে বুঝবে — কোন ইনপুটে ফাংশনের কী ফেরত দেওয়া উচিত।</p>`):""};
const links=e=>e.loc?`<p class="mt">🔗 GitHub: <a href="${GH}main/exercises/${e.loc}" target="_blank" rel="noopener">প্রশ্ন (main)</a> · <a href="${GH}solutions/exercises/${e.loc}" target="_blank" rel="noopener">উত্তর (solutions)</a></p>`:"";
const skel=f=>`<h4>${esc(f.n)}</h4><pre>${f.s.map(s=>s[0]==="g"?`<span class="todo">    // ✏️ এখানে তোমার কোড লেখো\n</span>`:s[0]==="h"?`<span class="hint">${esc(s[1])}</span>`:esc(s[1])).join("")}</pre>`;
const sol=f=>`<h4>${esc(f.n)}</h4><pre>${f.s.filter(s=>s[0]!=="h").map(s=>esc(s[1])+(s[0]==="g"?"\n":"")).join("")}</pre>`;
const LB=(L,k,t)=>`<button data-l="${k}" class="${L===k?"on":""}">${t}</button>`;
function chLearn(x){
  const L=P.lang||"both",d=D(),n=x.ex.length,dn=x.ex.filter(e=>d[e.n]).length;
  $("#body").innerHTML=
  `<div class="chead"><div><b>${n}টি এক্সারসাইজ</b><span>সম্পন্ন: <i id="dc">${dn}</i>/${n}</span></div><div class="bar"><i id="db" style="width:${dn/n*100}%"></i></div><div class="how0">প্রতিটি কার্ডে এই ক্রমে এগোও: <b>প্রশ্ন → কীভাবে করবে → টেস্ট → কোড → সমাধান</b>। পিসিতে রান করার নিয়ম প্রথম পেজ "কমপ্রিহেনসিভ রাস্ট"-এ আছে।</div></div>`+
  `<div class="tabs lg">${LB(L,"both","বাংলা + English")}${LB(L,"bn","শুধু বাংলা")}${LB(L,"en","শুধু English")}<button id="ao">সব খোলো</button><button id="ac">সব বন্ধ</button></div>`+
  `<div class="toc">${x.ex.map((e,i)=>`<button data-i="${i}" class="${d[e.n]?"dn":""}">${e.n||i+1}</button>`).join("")}</div>`+
  x.ex.map((e,i)=>`<details class="ex card">${head(e,i,d[e.n]?"✓ সম্পন্ন":"")}<div class="cbody">${chips(e)}${qsec(e,L)}${howto(e)}${tsec(e)}${(e.f||[]).length?sec("✏️","কোড (skeleton)",e.f.map(skel).join("")):""}${hasGap(e)?`<details class="sub"><summary>💡 সমাধান দেখো (আগে নিজে চেষ্টা করো)</summary>${e.f.map(sol).join("")}</details>`:""}${links(e)}${!noDesc(e)&&e.b&&e.b.length>1?`<details class="sub"><summary>📋 মূল নির্দেশনা ও নোট (English)</summary>${blocks(e.b.slice(1))}</details>`:""}<button class="btn alt dm">${d[e.n]?"✓ সম্পন্ন (চিহ্ন তুলে নাও)":"✓ আমি করেছি"}</button></div></details>`).join("");
  const R=$("#body"),cards=[...R.querySelectorAll("details.card")],tb=[...R.querySelectorAll(".toc button")];
  R.querySelectorAll(".lg button[data-l]").forEach(b=>b.onclick=()=>{P.lang=b.dataset.l;save();chLearn(x)});
  $("#ao").onclick=()=>cards.forEach(z=>z.open=true);
  $("#ac").onclick=()=>cards.forEach(z=>z.open=false);
  tb.forEach(b=>b.onclick=()=>{const z=cards[+b.dataset.i];z.open=true;z.scrollIntoView({behavior:"smooth",block:"start"})});
  cards.forEach((z,i)=>{const e=x.ex[i];z.querySelector(".dm").onclick=ev=>{
    d[e.n]=!d[e.n];P.d=d;save();
    z.querySelector("summary .dn").textContent=d[e.n]?"✓ সম্পন্ন":"";
    ev.target.textContent=d[e.n]?"✓ সম্পন্ন (চিহ্ন তুলে নাও)":"✓ আমি করেছি";
    tb[i].classList.toggle("dn",!!d[e.n]);
    const c=x.ex.filter(y=>d[y.n]).length;$("#dc").textContent=c;$("#db").style.width=(c/n*100)+"%"}});
}
const nz=s=>s.replace(/\s+/g,"");
const ta=a=>`</pre><textarea class="gp" rows="${Math.min(Math.max(a.split("\n").length,2),14)}" spellcheck="false" data-a="${esc(a).replace(/"/g,"&quot;")}"></textarea><pre>`;
const fileT=f=>`<h4>${esc(f.n)}</h4><pre>${f.s.map(s=>s[0]==="g"?ta(s[1]):s[0]==="h"?`<span class="hint">${esc(s[1])}</span>`:esc(s[1])).join("")}</pre>`.replace(/<pre><\/pre>/g,"").replace(/<pre>\n/g,"<pre>");
function chTest(x){
  const T=P.t||(P.t={}),exs=x.ex.filter(hasGap),L=P.lang||"both";
  const cnt=()=>exs.filter(e=>T[e.n]!=null).length;
  $("#body").innerHTML=`<div class="chead"><div><b>${exs.length}টি কোড-লেখার টেস্ট</b><span id="tot">সম্পন্ন: ${cnt()}/${exs.length}</span></div><div class="how0">প্রতিটি কার্ডে প্রশ্ন পড়ে ফাঁকা বক্সে কোড লেখো, তারপর <b>যাচাই করো</b> চাপো। স্পেস ও লাইন-ব্রেক গণ্য হয় না, তবে ভিন্ন বৈধ সমাধান মিলতে নাও পারে — তখন <b>উত্তর দেখাও</b> চাপো।</div></div><div class="tabs lg">${LB(L,"both","বাংলা + English")}${LB(L,"bn","শুধু বাংলা")}${LB(L,"en","শুধু English")}</div>`+
  exs.map((e,i)=>`<details class="ex card" data-n="${e.n}">${head(e,i,T[e.n]!=null?"স্কোর "+T[e.n]:"")}<div class="cbody">${chips(e)}${qsec(e,L)}${tsec(e)}${sec("✍️","এখানে কোড লেখো",e.f.filter(f=>f.s.some(s=>s[0]==="g")).map(fileT).join(""))}<button class="btn ck">যাচাই করো</button><button class="btn alt rv">উত্তর দেখাও</button><span class="sc"></span></div></details>`).join("");
  $("#body").querySelectorAll(".lg button[data-l]").forEach(b=>b.onclick=()=>{P.lang=b.dataset.l;save();chTest(x)});
  $("#body").querySelectorAll("details.ex").forEach(d=>{
    const gs=[...d.querySelectorAll(".gp")],n=d.dataset.n;
    d.querySelector(".ck").onclick=()=>{let r=0;gs.forEach(g=>{const ok=nz(g.value)===nz(g.dataset.a);g.className="gp "+(ok?"ok":"no");r+=ok});const s=r+"/"+gs.length;d.querySelector(".sc").textContent=s;d.querySelector("summary .dn").textContent="স্কোর "+s;T[n]=s;P.t=T;save();$("#tot").textContent="সম্পন্ন: "+cnt()+"/"+exs.length;mark(x.id,cnt()+"/"+exs.length)};
    d.querySelector(".rv").onclick=()=>gs.forEach(g=>{g.value=g.dataset.a;g.className="gp ok"});
  });
}
function steps(x){
  CB=[];
  const n=x.s.length;
  let h=`<div class="bar"><i style="width:${(stepN+1)/n*100}%"></i></div>`;
  for(let i=0;i<=stepN;i++)h+=`<div class="step ${i===stepN?"cur":""}"><h4>ধাপ ${i+1}/${n}: ${esc(x.s[i].t)}</h4>${blocks(x.s[i].b)}</div>`;
  h+=stepN<n-1?`<button class="btn" id="nx">পরের ধাপ</button>`:`<div class="score">সব ধাপ শেষ ✓</div>`;
  if(stepN>0)h+=`<button class="btn alt" id="pv">আগের ধাপ</button>`;
  h+=`<button class="btn alt" id="rs">শুরু থেকে</button>`;
  $("#body").innerHTML=h;
  if($("#nx"))$("#nx").onclick=()=>{stepN++;steps(x);$(".step.cur").scrollIntoView({behavior:"smooth",block:"start"})};else mark(x.id,"✓");
  if($("#pv"))$("#pv").onclick=()=>{stepN--;steps(x)};$("#rs").onclick=()=>{stepN=0;steps(x)};
}
function quiz(x){
  let r=0,d=0;const B=$("#body");
  B.innerHTML=`<p>তিনটি প্রজেক্ট (SD Card Flash, দুটি ক্যালকুলেটর, Tauri) নিয়ে কুইজ।</p>`+x.q.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<button class="o" data-j="${j}">${esc(o)}</button>`).join("")}<div class="exp"></div></div>`).join("")+`<div class="score" id="sc"></div>`;
  B.querySelectorAll(".q").forEach((el,i)=>{const q=x.q[i];el.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j;el.querySelectorAll(".o").forEach(y=>y.disabled=true);el.querySelectorAll(".o")[q.a].classList.add("right");
    if(j===q.a)r++;else b.classList.add("wrong");el.querySelector(".exp").textContent=(j===q.a?"সঠিক। ":"ভুল। ")+q.e;
    if(++d===x.q.length){$("#sc").textContent=`স্কোর: ${r}/${x.q.length}`;mark(x.id,r+"/"+x.q.length)}})});
}
$("#menu").onclick=()=>$("#nav").classList.toggle("open");
render();
</script></body></html>
