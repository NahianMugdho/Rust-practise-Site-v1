 explicitly handle the absent case, preventing null-pointer exceptions. Practice wrapping a nullable field (e.g. `assigned_to: Option<String>`) in your `Ticket` struct. Use `match`, `if let`, `.is_some()`, `.is_none()`, `.unwrap()`, `.unwrap_or()`, and `.map()` to work with `Option` values."],"bt":["উপস্থিত বা অনুপস্থিত থাকতে পারে এমন মান উপস্থাপন করতে `Option<T>` ব্যবহার করো। Rust-এ কোনো null pointer নেই; পরিবর্তে `Option<T>` দুটি variant সহ: `Some(T)` এবং `None`। `Ticket` struct-এ `assigned_to: Option<String>` field যোগ করো।"],"loc":"exercises/05_ticket_v2/05_nullability","f":[{"n":"src/lib.rs","s":[["c","// TODO: Implement `Ticket::assigned_to` using `Option` as the return type.\n\n#[derive(Debug, PartialEq)]\nstruct Ticket {\n    title: String,\n    description: String,\n    status: Status,\n}\n\n#[derive(Debug, PartialEq)]\nenum Status {\n    ToDo,\n    InProgress { assigned_to: String },\n    Done,\n}\n\nimpl Ticket {\n    pub fn new(title: String, description: String, status: Status) -> Ticket {\n        if title.is_empty() {\n            panic!(\"Title cannot be empty\");\n        }\n        if title.len() > 50 {\n            panic!(\"Title cannot be longer than 50 bytes\");\n        }\n        if description.is_empty() {\n            panic!(\"Description cannot be empty\");\n        }\n        if description.len() > 500 {\n            panic!(\"Description cannot be longer than 500 bytes\");\n        }\n\n        Ticket {\n            title,\n            description,\n            status,\n        }\n    }\n    pub fn assigned_to(&self) -> Option<&String> {\n"],["g","        match &self.status {\n            Status::InProgress { assigned_to } => Some(assigned_to),\n            _ => None,\n        }"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{valid_description, valid_title};\n\n    #[test]\n    fn test_todo() {\n        let ticket = Ticket::new(valid_title(), valid_description(), Status::ToDo);\n        assert!(ticket.assigned_to().is_none());\n    }\n\n    #[test]\n    fn test_done() {\n        let ticket = Ticket::new(valid_title(), valid_description(), Status::Done);\n        assert!(ticket.assigned_to().is_none());\n    }\n\n    #[test]\n    fn test_in_progress() {\n        let ticket = Ticket::new(\n            valid_title(),\n            valid_description(),\n            Status::InProgress {\n                assigned_to: \"Alice\".to_string(),\n            },\n        );\n        assert_eq!(ticket.assigned_to(), Some(&\"Alice\".to_string()));\n    }\n}\n"]]}]},{"t":"48. Fallibility — Result<T, E> | ব্যর্থতা — Result<T, E>","b":[["p","Path: 05_ticket_v2/06_fallibility    |    Page Reference: 115"],["p","Use Result<T, E> to represent fallible operations."],["p","Instead of panicking on invalid input, a well-designed API returns a Result:"],["code","enum Result<T, E> { Ok(T), Err(E) }"],["p","Open exercises/05_ticket_v2/06_fallibility/src/lib.rs. Refactor Ticket::new() to return Result<Ticket, String> instead of panicking."],["p","Updated constructor signature:"],["code","pub fn new(title: String, description: String, status: String)"],["p","-> Result<Ticket, String> { ... }"],["p","Return Ok(ticket) on success and Err(\"Title cannot be empty\".to_string()) on failure."],["p","Using the Result in tests:"],["code","let result = Ticket::new(\"Title\".into(), \"Desc\".into(), \"To-Do\".into());\nassert!(result.is_ok());\nlet ticket = result.unwrap();\nlet bad = Ticket::new(\"\".into(), \"Desc\".into(), \"To-Do\".into());\nassert!(bad.is_err());\nassert_eq!(bad.unwrap_err(), \"Title cannot be empty\");"],["p","This is a significant API improvement — callers can now handle errors gracefully instead of worrying about panics."]],"n":48,"en":["Use `Result<T, E>` for operations that can fail. `Result` has two variants: `Ok(T)` for success and `Err(E)` for failure. Using `Result` makes fallibility explicit in function signatures, forcing callers to handle errors. Modify `Ticket::new` to return `Result<Ticket, ValidationError>` instead of panicking on invalid input. Define a `ValidationError` enum (or struct) to represent the possible validation failures. This is the idiomatic Rust approach to error handling for expected, recoverable errors."],"bt":["ব্যর্থ হতে পারে এমন operations-এর জন্য `Result<T, E>` ব্যবহার করো। `Result`-এর দুটি variant: সফলতার জন্য `Ok(T)` এবং ব্যর্থতার জন্য `Err(E)`। invalid input-এ panic করার পরিবর্তে `Ticket::new` পরিবর্তন করো যাতে `Result<Ticket, ValidationError>` রিটার্ন করে।"],"loc":"exercises/05_ticket_v2/06_fallibility","f":[{"n":"src/lib.rs","s":[["c","// TODO: Convert the `Ticket::new` method to return a `Result` instead of panicking.\n//   Use `String` as the error type.\n\n#[derive(Debug, PartialEq)]\nstruct Ticket {\n    title: String,\n    description: String,\n    status: Status,\n}\n\n#[derive(Debug, PartialEq)]\nenum Status {\n    ToDo,\n    InProgress { assigned_to: String },\n    Done,\n}\n\nimpl Ticket {\n"],["g","    pub fn new(title: String, description: String, status: Status) -> Result<Ticket, String> {"],["c","        if title.is_empty() {\n"],["g","            return Err(\"Title cannot be empty\".into());"],["c","        }\n        if title.len() > 50 {\n"],["g","            return Err(\"Title cannot be longer than 50 bytes\".into());"],["c","        }\n        if description.is_empty() {\n"],["g","            return Err(\"Description cannot be empty\".into());"],["c","        }\n        if description.len() > 500 {\n"],["g","            return Err(\"Description cannot be longer than 500 bytes\".into());"],["c","        }\n\n"],["g","        Ok(Ticket {"],["c","            title,\n            description,\n            status,\n"],["g","        })"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{overly_long_description, overly_long_title, valid_description, valid_title};\n\n    #[test]\n    fn title_cannot_be_empty() {\n        let error = Ticket::new(\"\".into(), valid_description(), Status::ToDo).unwrap_err();\n        assert_eq!(error, \"Title cannot be empty\");\n    }\n\n    #[test]\n    fn description_cannot_be_empty() {\n        let error = Ticket::new(valid_title(), \"\".into(), Status::ToDo).unwrap_err();\n        assert_eq!(error, \"Description cannot be empty\");\n    }\n\n    #[test]\n    fn title_cannot_be_longer_than_fifty_chars() {\n        let error =\n            Ticket::new(overly_long_title(), valid_description(), Status::ToDo).unwrap_err();\n        assert_eq!(error, \"Title cannot be longer than 50 bytes\");\n    }\n\n    #[test]\n    fn description_cannot_be_longer_than_500_chars() {\n        let error =\n            Ticket::new(valid_title(), overly_long_description(), Status::ToDo).unwrap_err();\n        assert_eq!(error, \"Description cannot be longer than 500 bytes\");\n    }\n}\n"]]}]},{"t":"49. Unwrapping | আনর্যাপিং","b":[["p","Path: 05_ticket_v2/07_unwrap    |    Page Reference: 116"],["p","Understand the various ways to \"unwrap\" a Result or Option."],["p","When you receive a Result<T, E> or Option<T>, you need to extract the inner value to use it."],["p","Open exercises/05_ticket_v2/07_unwrap/src/lib.rs and use the appropriate unwrapping technique."],["p","Methods for Option:"],["li",".unwrap() — panic with \"called Option::unwrap() on None\" if None"],["li",".expect(\"message\") — panic with your custom message if None"],["li",".unwrap_or(default) — return default if None (default is eagerly evaluated)"],["li",".unwrap_or_else(|| fallback()) — return result of closure if None (lazy)"],["li",".unwrap_or_default() — return T::default() if None"],["p","Methods for Result:"],["li",".unwrap() — panic with the error message if Err"],["li",".expect(\"message\") — panic with custom message + error if Err"],["li",".unwrap_or(default) — return default if Err"],["li",".unwrap_or_else(|_err| fallback()) — return closure result if Err"],["li",".ok() — convert Result<T, E> to Option<T> (discards the error)"],["p","The tests exercise each of these techniques. Use expect() (not unwrap()) in production code so the panic messages are informative."]],"n":49,"en":["Learn about methods to extract the value from `Option` and `Result`. `.unwrap()` extracts the inner value if it is `Some` or `Ok`, and panics otherwise. `.expect(\"message\")` is similar but includes a custom panic message. Use `unwrap` and `expect` sparingly — in production code, prefer explicit error handling via `match` or the `?` operator. They are acceptable in tests, examples, and prototypes. Practice using `match` as an alternative: `match parse_int(\"42\") { Ok(n) => n, Err(e) => panic!(\"{}\", e) }`."],"bt":["`Option` এবং `Result` থেকে মান extract করার মেথড সম্পর্কে জানো। `.unwrap()` `Some` বা `Ok` হলে inner মান extract করে, অন্যথায় panic করে। `.expect(\"message\")` একই কিন্তু custom panic message সহ। `unwrap` সংযতভাবে ব্যবহার করো।"],"loc":"exercises/05_ticket_v2/07_unwrap","f":[{"n":"src/lib.rs","s":[["c","// TODO: `easy_ticket` should panic when the title is invalid.\n//   When the description is invalid, instead, it should use a default description:\n//   \"Description not provided\".\nfn easy_ticket(title: String, description: String, status: Status) -> Ticket {\n"],["g","    match Ticket::new(title.clone(), description, status.clone()) {\n        Ok(ticket) => ticket,\n        Err(error) => {\n            if error.contains(\"Description\") {\n                Ticket::new(title, \"Description not provided\".to_string(), status).unwrap()\n            } else {\n                panic!(\"{error}\");\n            }\n        }\n    }"],["c","}\n\n#[derive(Debug, PartialEq, Clone)]\nstruct Ticket {\n    title: String,\n    description: String,\n    status: Status,\n}\n\n#[derive(Debug, PartialEq, Clone)]\nenum Status {\n    ToDo,\n    InProgress { assigned_to: String },\n    Done,\n}\n\nimpl Ticket {\n    pub fn new(title: String, description: String, status: Status) -> Result<Ticket, String> {\n        if title.is_empty() {\n            return Err(\"Title cannot be empty\".to_string());\n        }\n        if title.len() > 50 {\n            return Err(\"Title cannot be longer than 50 bytes\".to_string());\n        }\n        if description.is_empty() {\n            return Err(\"Description cannot be empty\".to_string());\n        }\n        if description.len() > 500 {\n            return Err(\"Description cannot be longer than 500 bytes\".to_string());\n        }\n\n        Ok(Ticket {\n            title,\n            description,\n            status,\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{overly_long_description, overly_long_title, valid_description, valid_title};\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be empty\")]\n    fn title_cannot_be_empty() {\n        easy_ticket(\"\".into(), valid_description(), Status::ToDo);\n    }\n\n    #[test]\n    fn template_description_is_used_if_empty() {\n        let ticket = easy_ticket(valid_title(), \"\".into(), Status::ToDo);\n        assert_eq!(ticket.description, \"Description not provided\");\n    }\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be longer than 50 bytes\")]\n    fn title_cannot_be_longer_than_fifty_chars() {\n        easy_ticket(overly_long_title(), valid_description(), Status::ToDo);\n    }\n\n    #[test]\n    fn template_description_is_used_if_too_long() {\n        let ticket = easy_ticket(valid_title(), overly_long_description(), Status::ToDo);\n        assert_eq!(ticket.description, \"Description not provided\");\n    }\n}\n"]]}]},{"t":"50. Error Enums | এরর এনুম","b":[["p","Path: 05_ticket_v2/08_error_enums    |    Page Reference: 117"],["p","Define a custom error enum for structured error handling."],["p","Using String as an error type is convenient but not ideal — callers cannot inspect the error type to decide how to recover. A custom error enum gives structured, matchable errors."],["p","Open exercises/05_ticket_v2/08_error_enums/src/lib.rs. Define and use a custom error enum."],["p","Example:"],["code","#[derive(Debug, PartialEq)]\nenum TicketNewError {\n    TitleTooLong,\n    TitleEmpty,\n    DescriptionTooLong,\n    DescriptionEmpty,\n    InvalidStatus,\n}\nimpl Ticket {\n    pub fn new(...) -> Result<Ticket, TicketNewError> { ... }\n}"],["p","Callers can now match on the specific error:"],["code","match Ticket::new(...) {\n    Ok(t) => t,\n    Err(TicketNewError::TitleEmpty) => panic!(\"No title\"),\n    Err(TicketNewError::InvalidStatus) => panic!(\"Bad status\"),\n    Err(e) => panic!(\"Other error: {:?}\", e),\n}"],["p","Update Ticket::new() (and the setters if applicable) to return this new error type."]],"n":50,"en":["Model errors using enums for precise error handling. Instead of using a single string for all errors, define an enum where each variant represents a distinct error case. For example: `enum TicketError { TitleTooLong, TitleEmpty, DescriptionTooLong, DescriptionEmpty, InvalidStatus }`. Using an error enum allows callers to match on specific error variants and react accordingly, rather than parsing error messages. Practice writing a `match` expression that handles different error variants with different logic: e.g. returning a default value, retrying, or logging."],"bt":["সুনির্দিষ্ট error handling-এর জন্য enum ব্যবহার করে error মডেল করো। সব error-এর জন্য একক string-এর পরিবর্তে, প্রতিটি variant একটি ভিন্ন error case উপস্থাপন করে এমন enum সংজ্ঞায়িত করো। Error variant match করার অনুশীলন করো।"],"loc":"exercises/05_ticket_v2/08_error_enums","f":[{"n":"src/lib.rs","s":[["c","// TODO: Use two variants, one for a title error and one for a description error.\n//   Each variant should contain a string with the explanation of what went wrong exactly.\n//   You'll have to update the implementation of `Ticket::new` as well.\n"],["g","#[derive(Debug)]\nenum TicketNewError {\n    TitleError(String),\n    DescriptionError(String),\n}"],["c","\n// TODO: `easy_ticket` should panic when the title is invalid, using the error message\n//   stored inside the relevant variant of the `TicketNewError` enum.\n//   When the description is invalid, instead, it should use a default description:\n//   \"Description not provided\".\nfn easy_ticket(title: String, description: String, status: Status) -> Ticket {\n"],["g","    match Ticket::new(title.clone(), description, status.clone()) {\n        Ok(ticket) => ticket,\n        Err(TicketNewError::DescriptionError(_)) => {\n            Ticket::new(title, \"Description not provided\".to_string(), status).unwrap()\n        }\n        Err(TicketNewError::TitleError(error)) => panic!(\"{error}\"),\n    }"],["c","}\n\n#[derive(Debug, PartialEq)]\nstruct Ticket {\n    title: String,\n    description: String,\n    status: Status,\n}\n\n#[derive(Debug, PartialEq, Clone)]\nenum Status {\n    ToDo,\n    InProgress { assigned_to: String },\n    Done,\n}\n\nimpl Ticket {\n    pub fn new(\n        title: String,\n        description: String,\n        status: Status,\n    ) -> Result<Ticket, TicketNewError> {\n        if title.is_empty() {\n"],["g","            return Err(TicketNewError::TitleError(\n                \"Title cannot be empty\".to_string(),\n            ));"],["c","        }\n        if title.len() > 50 {\n"],["g","            return Err(TicketNewError::TitleError(\n                \"Title cannot be longer than 50 bytes\".to_string(),\n            ));"],["c","        }\n        if description.is_empty() {\n"],["g","            return Err(TicketNewError::DescriptionError(\n                \"Description cannot be empty\".to_string(),\n            ));"],["c","        }\n        if description.len() > 500 {\n"],["g","            return Err(TicketNewError::DescriptionError(\n                \"Description cannot be longer than 500 bytes\".to_string(),\n            ));"],["c","        }\n\n        Ok(Ticket {\n            title,\n            description,\n            status,\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{overly_long_description, overly_long_title, valid_description, valid_title};\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be empty\")]\n    fn title_cannot_be_empty() {\n        easy_ticket(\"\".into(), valid_description(), Status::ToDo);\n    }\n\n    #[test]\n    fn template_description_is_used_if_empty() {\n        let ticket = easy_ticket(valid_title(), \"\".into(), Status::ToDo);\n        assert_eq!(ticket.description, \"Description not provided\");\n    }\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be longer than 50 bytes\")]\n    fn title_cannot_be_longer_than_fifty_chars() {\n        easy_ticket(overly_long_title(), valid_description(), Status::ToDo);\n    }\n\n    #[test]\n    fn template_description_is_used_if_too_long() {\n        let ticket = easy_ticket(valid_title(), overly_long_description(), Status::ToDo);\n        assert_eq!(ticket.description, \"Description not provided\");\n    }\n}\n"]]}]},{"t":"51. The Error Trait | Error ট্রেইট","b":[["p","Path: 05_ticket_v2/09_error_trait    |    Page Reference: 119"],["p","Implement the std::error::Error trait for your custom error type."],["p","The standard library's Error trait marks a type as a \"proper\" error. Implementing it unlocks interoperability with the broader Rust ecosystem (e.g., the ? operator, error-reporting libraries like anyhow and thiserror)."],["p","Open exercises/05_ticket_v2/09_error_trait/src/lib.rs. Implement std::error::Error for your TicketNewError enum."],["p","Minimum requirements:"],["li","Implement std::fmt::Display — human-readable error message."],["li","Implement std::fmt::Debug — derive with #[derive(Debug)]."],["li","Implement std::error::Error — the trait itself has no required methods; just provide the impl block."],["code","use std::fmt;\nimpl fmt::Display for TicketNewError {\n    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {\n        match self {\n            TicketNewError::TitleEmpty => write!(f, \"Title cannot be empty\"),\n            // ... other variants\n        }\n    }\n}\nimpl std::error::Error for TicketNewError {}"],["p","After this, your error type works seamlessly with Box<dyn Error> and the ? operator."]],"n":51,"en":["Implement the `std::error::Error` trait for custom error types. The `Error` trait requires `Display` and `Debug` to be implemented (as super-traits). `Display` provides a human-readable message for end users; `Debug` provides a developer-oriented representation. Implement `Display` for your error enum using the `fmt::Display` trait: `impl fmt::Display for MyError { fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result { ... } }`. The `Error` trait also has an optional `source()` method for error chaining, which we'll explore in a later exercise."],"bt":["Custom error type-এর জন্য `std::error::Error` trait ইমপ্লিমেন্ট করো। `Error` trait-এর জন্য `Display` এবং `Debug` ইমপ্লিমেন্ট করা প্রয়োজন। `Display` শেষ ব্যবহারকারীদের জন্য human-readable message প্রদান করে।"],"loc":"exercises/05_ticket_v2/09_error_trait","f":[{"n":"src/lib.rs","s":[["c","// TODO: Implement `Debug`, `Display` and `Error` for the `TicketNewError` enum.\n//  When implementing `Display`, you may want to use the `write!` macro from Rust's standard library.\n//  The docs for the `std::fmt` module are a good place to start and look for examples:\n//  https://doc.rust-lang.org/std/fmt/index.html#write\n\n"],["g","#[derive(Debug)]"],["c","enum TicketNewError {\n    TitleError(String),\n    DescriptionError(String),\n}\n"],["g","\nimpl std::fmt::Display for TicketNewError {\n    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {\n        match self {\n            TicketNewError::TitleError(msg) => write!(f, \"{}\", msg),\n            TicketNewError::DescriptionError(msg) => write!(f, \"{}\", msg),\n        }\n    }\n}\n\nimpl std::error::Error for TicketNewError {}"],["c","\n// TODO: `easy_ticket` should panic when the title is invalid, using the error message\n//   stored inside the relevant variant of the `TicketNewError` enum.\n//   When the description is invalid, instead, it should use a default description:\n//   \"Description not provided\".\nfn easy_ticket(title: String, description: String, status: Status) -> Ticket {\n"],["g","    match Ticket::new(title.clone(), description, status.clone()) {\n        Ok(ticket) => ticket,\n        Err(err) => match err {\n            TicketNewError::TitleError(_) => panic!(\"{err}\"),\n            TicketNewError::DescriptionError(_) => {\n                Ticket::new(title, \"Description not provided\".to_string(), status).unwrap()\n            }\n        },\n    }"],["c","}\n\n#[derive(Debug, PartialEq, Clone)]\nstruct Ticket {\n    title: String,\n    description: String,\n    status: Status,\n}\n\n#[derive(Debug, PartialEq, Clone)]\nenum Status {\n    ToDo,\n    InProgress { assigned_to: String },\n    Done,\n}\n\nimpl Ticket {\n    pub fn new(\n        title: String,\n        description: String,\n        status: Status,\n    ) -> Result<Ticket, TicketNewError> {\n        if title.is_empty() {\n            return Err(TicketNewError::TitleError(\n                \"Title cannot be empty\".to_string(),\n            ));\n        }\n        if title.len() > 50 {\n            return Err(TicketNewError::TitleError(\n                \"Title cannot be longer than 50 bytes\".to_string(),\n            ));\n        }\n        if description.is_empty() {\n            return Err(TicketNewError::DescriptionError(\n                \"Description cannot be empty\".to_string(),\n            ));\n        }\n        if description.len() > 500 {\n            return Err(TicketNewError::DescriptionError(\n                \"Description cannot be longer than 500 bytes\".to_string(),\n            ));\n        }\n\n        Ok(Ticket {\n            title,\n            description,\n            status,\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{overly_long_description, overly_long_title, valid_description, valid_title};\n    use static_assertions::assert_impl_one;\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be empty\")]\n    fn title_cannot_be_empty() {\n        easy_ticket(\"\".into(), valid_description(), Status::ToDo);\n    }\n\n    #[test]\n    fn template_description_is_used_if_empty() {\n        let ticket = easy_ticket(valid_title(), \"\".into(), Status::ToDo);\n        assert_eq!(ticket.description, \"Description not provided\");\n    }\n\n    #[test]\n    #[should_panic(expected = \"Title cannot be longer than 50 bytes\")]\n    fn title_cannot_be_longer_than_fifty_chars() {\n        easy_ticket(overly_long_title(), valid_description(), Status::ToDo);\n    }\n\n    #[test]\n    fn template_description_is_used_if_too_long() {\n        let ticket = easy_ticket(valid_title(), overly_long_description(), Status::ToDo);\n        assert_eq!(ticket.description, \"Description not provided\");\n    }\n\n    #[test]\n    fn display_is_correctly_implemented() {\n        let ticket = Ticket::new(\"\".into(), valid_description(), Status::ToDo);\n        assert_eq!(format!(\"{}\", ticket.unwrap_err()), \"Title cannot be empty\");\n    }\n\n    assert_impl_one!(TicketNewError: std::error::Error);\n}\n"]]}]},{"t":"52. Libraries and Binaries | লাইব্রেরি এবং বাইনারি","b":[["p","Path: 05_ticket_v2/10_packages    |    Page Reference: 121"],["p","Understand Cargo packages, crates, and the workspace structure."],["p","In Rust, the unit of compilation is a crate. A package is a Cargo project (defined by Cargo.toml) that can contain one or more crates."],["p","Open exercises/05_ticket_v2/10_packages/src/lib.rs (and its Cargo.toml). This exercise explores:"],["p","Key concepts:"],["li","Cargo.toml — the package manifest: defines name, version, edition, dependencies."],["li","A library crate (lib.rs) vs a binary crate (main.rs)."],["li","A package can have multiple binary crates (files under src/bin/)."],["li","A workspace: multiple packages managed together under a single root Cargo.toml."],["p","The exercise may ask you to:"],["code","1. Add a new module file.\n2. Create a binary that uses the library.\n3. Understand how Cargo resolves modules (mod.rs vs named files).\n4. Use extern crate (legacy, no longer needed in Rust 2018+) vs direct use."],["p","Run cargo build and cargo test to verify your package structure is correct."]],"n":52,"en":["Understand the difference between library crates and binary crates. A library crate (`src/lib.rs`) exposes types and functions for use by other crates. A binary crate (`src/main.rs`) provides an entry point with a `main` function and produces an executable. A Cargo package can contain both. Practice splitting your ticket code into a library crate and a small binary that uses it. Understand the `use` keyword for bringing items from the library into scope in the binary, and how to reference the crate by its name in `Cargo.toml`."],"bt":["library crate এবং binary crate-এর মধ্যে পার্থক্য বোঝো। Library crate (`src/lib.rs`) অন্য crate-এর জন্য type ও function expose করে। Binary crate (`src/main.rs`) `main` ফাংশন সহ executable তৈরি করে।"],"loc":"exercises/05_ticket_v2/10_packages","f":[{"n":"src/lib.rs","s":[["g","pub fn hello_world() {\n    println!(\"Hello, world!\");\n}"]]}]},{"t":"53. External Dependencies | বাহ্যিক নির্ভরতা","b":[["p","Path: 05_ticket_v2/11_dependencies    |    Page Reference: 123"],["p","Add and use external crate dependencies from crates.io."],["p","Cargo makes it trivial to depend on libraries published on crates.io."],["p","Open exercises/05_ticket_v2/11_dependencies and update Cargo.toml to add a dependency:"],["code","[dependencies]\nthiserror = \"1\"      # example: derive macro for Error\n# or\nanyhow = \"1\"         # example: easy error handling"],["p","Key concepts:"],["li","Version requirements: \"1\" (compatible with 1.x.x), \"=1.2.3\" (exact), \">=1.0, <2.0\"."],["li","After adding a dep, run cargo build — Cargo downloads and compiles it."],["li","Cargo.lock records the exact resolved versions for reproducible builds."],["li","dev-dependencies (under [dev-dependencies]) are only used in tests."],["p","The exercise likely asks you to use a specific crate to simplify the error type. For example, with thiserror:"],["code","use thiserror::Error;\n#[derive(Debug, Error)]\nenum TicketNewError {\n    #[error(\"Title cannot be empty\")]\n    TitleEmpty,\n}"],["p","Make the tests pass with the external crate integrated."]],"n":53,"en":["Add and use external crate dependencies with Cargo. Open `Cargo.toml` and add a dependency under `[dependencies]`, for example `anyhow = \"1\"`. Run `cargo build` to download and compile the dependency. Then use the crate in your code with `use anyhow::...`. Understand semantic versioning (SemVer) and how Cargo resolves compatible versions. The course uses `thiserror` in the next exercise, so this is a warm-up for working with external crates. Also learn about dev-dependencies (`[dev-dependencies]`) which are only compiled for tests."],"bt":["Cargo দিয়ে বাহ্যিক crate dependency যোগ ও ব্যবহার করো। `Cargo.toml`-এ `[dependencies]`-এর অধীনে dependency যোগ করো। `cargo build` চালাও। Semantic versioning (SemVer) এবং Cargo কীভাবে compatible version resolve করে তা বোঝো।"],"loc":"exercises/05_ticket_v2/11_dependencies","f":[{"n":"Cargo.toml","s":[["c","[package]\nname = \"deps\"\nversion = \"0.1.0\"\nedition = \"2021\"\n"],["g","\n[dependencies]\nanyhow = \"1\""]]}]}]},{"id":"c6","t":"Chapter 6: Ticket Management (Collections & Iterators)","k":"chapter","ex":[{"t":"54. The thiserror Crate | thiserror Crate","b":[["p","Path: 06_ticket_management/01_vec    |    Page Reference: 131"],["p","Work with Vec<T> — Rust's growable, heap-allocated array."],["p","A Vec<T> is the most commonly used collection in Rust. It stores elements of type T contiguously in heap memory and grows dynamically."],["p","Open exercises/06_ticket_management/01_vec/src/lib.rs. Your tasks:"],["p","1. Create a Vec<Ticket> to hold a collection of tickets."],["p","2. Add tickets using .push(ticket)."],["p","3. Access elements by index: vec[0] or vec.get(0) (returns Option)."],["p","4. Iterate over tickets."],["p","Key Vec operations:"],["li","Vec::new() or vec![] macro"],["li","v.push(item) — add to end"],["li","v.pop() — remove and return last element (Option<T>)"],["li","v.len() — number of elements"],["li","v.is_empty() — true if no elements"],["li","v.contains(&item) — linear search"],["li","v[i] — index access (panics if out of bounds)"],["li","v.get(i) — safe access returning Option<&T>"],["li","v.iter() — immutable iterator"],["li","v.iter_mut() — mutable iterator"],["li","v.into_iter() — consuming iterator (takes ownership)"]],"n":54,"en":["Use the `thiserror` crate to derive the `Error` trait implementation ergonomically. `thiserror` provides a derive macro (`#[derive(thiserror::Error)]`) that automatically generates `Display` and `Error` implementations from annotations. Use `#[error(\"message\")]` on each variant to specify the display message; use `{0}` or `{field}` in the message to include variant data. This eliminates boilerplate while keeping full control over error messages. Convert your hand-written `Error` implementation from the previous exercise to use `thiserror`."],"bt":["`thiserror` crate ব্যবহার করে ergonomically `Error` trait implementation derive করো। `#[derive(thiserror::Error)]` macro স্বয়ংক্রিয়ভাবে `Display` এবং `Error` implementation generate করে। প্রতিটি variant-এ `#[error(\"message\")]` ব্যবহার করো।"],"loc":"exercises/05_ticket_v2/12_thiserror","f":[{"n":"Cargo.toml","s":[["c","[package]\nname = \"thiserror_\"\nversion = \"0.1.0\"\nedition = \"2021\"\n\n[dependencies]\n"],["g","thiserror = \"2\""],["c","\n[dev-dependencies]\ncommon = { path = \"../../../helpers/common\" }\n"]]},{"n":"src/lib.rs","s":[["c","// TODO: Implement the `Error` trait for `TicketNewError` using `thiserror`.\n//   We've changed the enum variants to be more specific, thus removing the need for storing\n//   a `String` field into each variant.\n//   You'll also have to add `thiserror` as a dependency in the `Cargo.toml` file.\n\n"],["g","#[derive(Debug, thiserror::Error)]"],["c","enum TicketNewError {\n"],["g","    #[error(\"Title cannot be empty\")]"],["c","    TitleCannotBeEmpty,\n"],["g","    #[error(\"Title cannot be longer than 50 bytes\")]"],["c","    TitleTooLong,\n"],["g","    #[error(\"Description cannot be empty\")]"],["c","    DescriptionCannotBeEmpty,\n"],["g","    #[error(\"Description cannot be longer than 500 bytes\")]"],["c","    DescriptionTooLong,\n}\n\n#[derive(Debug, PartialEq, Clone)]\nstruct Ticket {\n    title: String,\n    description: String,\n    status: Status,\n}\n\n#[derive(Debug, PartialEq, Clone)]\nenum Status {\n    ToDo,\n    InProgress { assigned_to: String },\n    Done,\n}\n\nimpl Ticket {\n    pub fn new(\n        title: String,\n        description: String,\n        status: Status,\n    ) -> Result<Ticket, TicketNewError> {\n        if title.is_empty() {\n            return Err(TicketNewError::TitleCannotBeEmpty);\n        }\n        if title.len() > 50 {\n            return Err(TicketNewError::TitleTooLong);\n        }\n        if description.is_empty() {\n            return Err(TicketNewError::DescriptionCannotBeEmpty);\n        }\n        if description.len() > 500 {\n            return Err(TicketNewError::DescriptionTooLong);\n        }\n\n        Ok(Ticket {\n            title,\n            description,\n            status,\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{overly_long_description, overly_long_title, valid_description, valid_title};\n\n    #[test]\n    fn title_cannot_be_empty() {\n        let err = Ticket::new(\"\".into(), valid_description(), Status::ToDo).unwrap_err();\n        assert_eq!(err.to_string(), \"Title cannot be empty\");\n    }\n\n    #[test]\n    fn description_cannot_be_empty() {\n        let err = Ticket::new(valid_title(), \"\".into(), Status::ToDo).unwrap_err();\n        assert_eq!(err.to_string(), \"Description cannot be empty\");\n    }\n\n    #[test]\n    fn title_cannot_be_longer_than_fifty_chars() {\n        let err = Ticket::new(overly_long_title(), valid_description(), Status::ToDo).unwrap_err();\n        assert_eq!(err.to_string(), \"Title cannot be longer than 50 bytes\");\n    }\n\n    #[test]\n    fn description_cannot_be_too_long() {\n        let err = Ticket::new(valid_title(), overly_long_description(), Status::ToDo).unwrap_err();\n        assert_eq!(\n            err.to_string(),\n            \"Description cannot be longer than 500 bytes\"\n        );\n    }\n}\n"]]}]},{"t":"55. TryFrom and TryInto | TryFrom এবং TryInto","b":[["p","Path: 06_ticket_management/02_iter    |    Page Reference: 133"],["p","Master the Iterator trait and iterator adapters."],["p","Rust's iterator system is powerful and zero-cost (compiled away to efficient loops)."],["p","Open exercises/06_ticket_management/02_iter/src/lib.rs. Use iterators to process a collection of tickets."],["p","Core iterator adapters:"],["li",".map(|x| transform(x)) — apply a function to each element"],["li",".filter(|x| condition(x)) — keep only matching elements"],["li",".filter_map(|x| option) — map and filter in one step"],["li",".fold(init, |acc, x| ...) — reduce to a single value"],["li",".any(|x| cond) — true if any element matches"],["li",".all(|x| cond) — true if all elements match"],["li",".count() — count elements"],["li",".sum::<T>() — sum all elements"],["li",".enumerate() — pairs each element with its index: (0, elem)"],["li",".take(n) — take first n elements"],["li",".skip(n) — skip first n elements"],["li",".flat_map(|x| iter) — flatten nested iterators"],["li",".chain(other_iter) — concatenate two iterators"],["li",".zip(other_iter) — pair up two iterators"],["li",".collect::<Vec<_>>() — materialise into a collection"]],"n":55,"en":["Implement fallible conversions using the `TryFrom` and `TryInto` traits. Unlike `From`/`Into` (which are infallible), `TryFrom` returns a `Result` and allows the conversion to fail with an error. Implement `TryFrom<String>` for `Status` so that `\"To-Do\".try_into()` returns `Ok(Status::ToDo)` and an unrecognised string returns `Err(...)`. Just like `From`/`Into`, `TryFrom` and `TryInto` are dual traits — implementing one automatically provides the other. Use `TryInto` in `Ticket::new` to validate and convert the status string."],"bt":["`TryFrom` এবং `TryInto` trait ব্যবহার করে fallible conversion ইমপ্লিমেন্ট করো। `From`/`Into` (infallible) থেকে ভিন্ন, `TryFrom` একটি `Result` রিটার্ন করে। `Status`-এর জন্য `TryFrom<String>` ইমপ্লিমেন্ট করো।"],"loc":"exercises/05_ticket_v2/13_try_from","f":[{"n":"Cargo.toml","s":[["c","[package]\nname = \"tryfrom\"\nversion = \"0.1.0\"\nedition = \"2021\"\n\n[dependencies]\n"],["g","thiserror = \"2\""]]},{"n":"src/lib.rs","s":[["c","// TODO: Implement `TryFrom<String>` and `TryFrom<&str>` for `Status`.\n//  The parsing should be case-insensitive.\n\n#[derive(Debug, PartialEq, Clone)]\nenum Status {\n    ToDo,\n    InProgress,\n    Done,\n"],["g","}\n\n#[derive(Debug, thiserror::Error)]\n#[error(\"{invalid_status} is not a valid status\")]\nstruct ParseStatusError {\n    invalid_status: String,\n}\n\nimpl TryFrom<String> for Status {\n    type Error = ParseStatusError;\n\n    fn try_from(value: String) -> Result<Self, Self::Error> {\n        value.as_str().try_into()\n    }\n}\n\nimpl TryFrom<&str> for Status {\n    type Error = ParseStatusError;\n\n    fn try_from(value: &str) -> Result<Self, Self::Error> {\n        match value.to_lowercase().as_str() {\n            \"todo\" => Ok(Status::ToDo),\n            \"inprogress\" => Ok(Status::InProgress),\n            \"done\" => Ok(Status::Done),\n            _ => Err(ParseStatusError {\n                invalid_status: value.to_string(),\n            }),\n        }\n    }"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::convert::TryFrom;\n\n    #[test]\n    fn test_try_from_string() {\n        let status = Status::try_from(\"ToDO\".to_string()).unwrap();\n        assert_eq!(status, Status::ToDo);\n\n        let status = Status::try_from(\"inproGress\".to_string()).unwrap();\n        assert_eq!(status, Status::InProgress);\n\n        let status = Status::try_from(\"Done\".to_string()).unwrap();\n        assert_eq!(status, Status::Done);\n\n        let empty = String::new();\n        assert!(Status::try_from(empty).is_err());\n\n        let invalid = \"InValid\".to_string();\n        assert!(Status::try_from(invalid).is_err());\n    }\n\n    #[test]\n    fn test_try_from_str() {\n        let status = Status::try_from(\"todo\").unwrap();\n        assert_eq!(status, Status::ToDo);\n\n        let status = Status::try_from(\"inprogress\").unwrap();\n        assert_eq!(status, Status::InProgress);\n\n        let status = Status::try_from(\"done\").unwrap();\n        assert_eq!(status, Status::Done);\n\n        assert!(Status::try_from(\"\").is_err());\n        assert!(Status::try_from(\"invalid\").is_err());\n    }\n}\n"]]}]},{"t":"56. Error::source — Error Chaining | Error::source — Error চেইনিং","b":[["p","Path: 06_ticket_management/03_option_iter    |    Page Reference: 135"],["p","Combine Option with iterators for concise data transformation."],["p","Option<T> is itself iterable — it yields one element (Some) or zero elements (None). This makes it possible to seamlessly integrate optional values into iterator chains."],["p","Open exercises/06_ticket_management/03_option_iter/src/lib.rs and use Option's iterator capabilities."],["p","Relevant techniques:"],["li","option.iter() — iterator of 0 or 1 elements"],["li","option.into_iter() — consuming iterator of 0 or 1 elements"],["li","iter.flatten() — flattens an iterator of Options (or iterators), removing Nones"],["li","iter.filter_map(|x| f(x)) — equivalent to .map().flatten()"],["p","Example — extract all assignees from a Vec<Ticket> where assignee is Option<String>:"],["code","let assignees: Vec<String> = tickets\n    .iter()\n    .filter_map(|t| t.assignee.clone())\n    .collect();"],["p","Or using flatten:"],["code","let assignees: Vec<&String> = tickets\n    .iter()\n    .flat_map(|t| t.assignee.as_ref())\n    .collect();"]],"n":56,"en":["Implement error chaining using the `Error::source()` method. When one error wraps another (e.g. a `TicketError::ParseFailed` wrapping a `std::num::ParseIntError`), `source()` returns a reference to the underlying error. This forms an error chain that tools and logging frameworks can traverse to show the root cause. With `thiserror`, use the `#[source]` attribute or `#[from]` (which also implements `From`) to annotate the wrapped error field. Practice using the `?` operator to propagate errors automatically — it converts the error type using `From` if needed."],"bt":["`Error::source()` মেথড ব্যবহার করে error chaining ইমপ্লিমেন্ট করো। যখন একটি error অন্যটি wrap করে, `source()` underlying error-এর reference রিটার্ন করে। `thiserror`-এ `#[source]` বা `#[from]` অ্যাট্রিবিউট ব্যবহার করো। `?` operator ব্যবহার করে error propagate করো।"],"loc":"exercises/05_ticket_v2/14_source","f":[{"n":"src/lib.rs","s":[["g","use crate::status::{ParseStatusError, Status};"],["c","\n// We've seen how to declare modules in one of the earliest exercises, but\n// we haven't seen how to extract them into separate files.\n// Let's fix that now!\n//\n// In the simplest case, when the extracted module is a single file, it is enough to\n// create a new file with the same name as the module and move the module content there.\n// The module file should be placed in the same directory as the file that declares the module.\n// In this case, `src/lib.rs`, thus `status.rs` should be placed in the `src` directory.\nmod status;\n\n// TODO: Add a new error variant to `TicketNewError` for when the status string is invalid.\n//   When calling `source` on an error of that variant, it should return a `ParseStatusError` rather than `None`.\n\n#[derive(Debug, thiserror::Error)]\npub enum TicketNewError {\n    #[error(\"Title cannot be empty\")]\n    TitleCannotBeEmpty,\n    #[error(\"Title cannot be longer than 50 bytes\")]\n    TitleTooLong,\n    #[error(\"Description cannot be empty\")]\n    DescriptionCannotBeEmpty,\n    #[error(\"Description cannot be longer than 500 bytes\")]\n    DescriptionTooLong,\n"],["g","    #[error(\"{0}\")]\n    InvalidStatus(#[from] ParseStatusError),"],["c","}\n\n#[derive(Debug, PartialEq, Clone)]\npub struct Ticket {\n    title: String,\n    description: String,\n    status: Status,\n}\n\nimpl Ticket {\n    pub fn new(title: String, description: String, status: String) -> Result<Self, TicketNewError> {\n        if title.is_empty() {\n            return Err(TicketNewError::TitleCannotBeEmpty);\n        }\n        if title.len() > 50 {\n            return Err(TicketNewError::TitleTooLong);\n        }\n        if description.is_empty() {\n            return Err(TicketNewError::DescriptionCannotBeEmpty);\n        }\n        if description.len() > 500 {\n            return Err(TicketNewError::DescriptionTooLong);\n        }\n\n        // TODO: Parse the status string into a `Status` enum.\n"],["g","        let status = Status::try_from(status)?;"],["c","\n        Ok(Ticket {\n            title,\n            description,\n            status,\n        })\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use common::{valid_description, valid_title};\n    use std::error::Error;\n\n    use super::*;\n\n    #[test]\n    fn invalid_status() {\n        let err = Ticket::new(valid_title(), valid_description(), \"invalid\".into()).unwrap_err();\n        assert_eq!(\n            err.to_string(),\n            \"`invalid` is not a valid status. Use one of: ToDo, InProgress, Done\"\n        );\n        assert!(err.source().is_some());\n    }\n}\n"]]}]},{"t":"57. Ticket v2 — Wrapping Up | টিকেট v2 — সমাপ্তি","b":[["p","Path: 06_ticket_management/04_result_iter    |    Page Reference: 137"],["p","Combine Result with iterators — collecting fallible transformations."],["p","When mapping a fallible function over a collection, you get an iterator of Results. Rust provides elegant ways to handle this."],["p","Open exercises/06_ticket_management/04_result_iter/src/lib.rs."],["p","Collecting an iterator of Results into a single Result:"],["code","let results: Result<Vec<Ticket>, String> = raw_tickets\n    .into_iter()\n    .map(|raw| Ticket::try_from(raw))\n    .collect();\n// If any element is Err, the whole collection is Err.\n// If all are Ok, you get Ok(Vec<Ticket>)."],["p","Other patterns:"],["li","Use .filter_map(|r| r.ok()) to discard errors silently."],["li","Use .partition(|r| r.is_ok()) to split successes and failures."],["p","Understand: the collect() method is generic over the output container type. When the output is Result<Vec<T>, E>, it short-circuits on the first error."]],"n":57,"en":["Final exercise for the Ticket v2 chapter. Bring together enums, `match`, `Option`, `Result`, error types, `TryFrom`/`TryInto`, and error chaining to build a complete, production-quality `Ticket` implementation. The goal is to create a type-safe ticket with proper error handling: all invalid states are rejected at the type level, errors carry meaningful information, and callers can match on specific failure cases. This is the \"parse, don't validate\" philosophy in practice."],"bt":["Ticket v2 অধ্যায়ের চূড়ান্ত exercise। enum, `match`, `Option`, `Result`, error type, `TryFrom`/`TryInto`, এবং error chaining একত্রিত করে একটি complete, production-quality `Ticket` ইমপ্লিমেন্টেশন তৈরি করো।"],"loc":"exercises/05_ticket_v2/15_outro","f":[{"n":"Cargo.toml","s":[["c","[package]\nname = \"outro_04\"\nversion = \"0.1.0\"\nedition = \"2021\"\n"],["g","\n[dependencies]\nthiserror = \"2\""]]},{"n":"src/description.rs","s":[["c","// TODO: Implement `TryFrom<String>` and `TryFrom<&str>` for the `TicketDescription` type,\n//   enforcing that the description is not empty and is not longer than 500 bytes.\n//   Implement the traits required to make the tests pass too.\n"],["g","#[derive(Debug, PartialEq, Clone)]\npub struct TicketDescription(String);"],["c","\n"],["g","#[derive(Debug, thiserror::Error)]\npub enum TicketDescriptionError {\n    #[error(\"The description cannot be empty\")]\n    Empty,\n    #[error(\"The description cannot be longer than 500 bytes\")]\n    TooLong,\n}\n\nimpl TryFrom<String> for TicketDescription {\n    type Error = TicketDescriptionError;\n\n    fn try_from(value: String) -> Result<Self, Self::Error> {\n        validate(&value)?;\n        Ok(Self(value))\n    }\n}\n\nimpl TryFrom<&str> for TicketDescription {\n    type Error = TicketDescriptionError;\n\n    fn try_from(value: &str) -> Result<Self, Self::Error> {\n        validate(value)?;\n        Ok(Self(value.to_string()))\n    }\n}\n\nfn validate(description: &str) -> Result<(), TicketDescriptionError> {\n    if description.is_empty() {\n        Err(TicketDescriptionError::Empty)\n    } else if description.len() > 500 {\n        Err(TicketDescriptionError::TooLong)\n    } else {\n        Ok(())\n    }\n}"],["c","\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::convert::TryFrom;\n\n    #[test]\n    fn test_try_from_string() {\n        let description = TicketDescription::try_from(\"A description\".to_string()).unwrap();\n        assert_eq!(description.0, \"A description\");\n    }\n\n    #[test]\n    fn test_try_from_empty_string() {\n        let err = TicketDescription::try_from(\"\".to_string()).unwrap_err();\n        assert_eq!(err.to_string(), \"The description cannot be empty\");\n    }\n\n    #[test]\n    fn test_try_from_long_string() {\n        let description = \"At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis praesentium voluptatum deleniti atque corrupti quos dolores et quas molestias excepturi sint occaecati cupiditate non provident, similique sunt in culpa qui officia deserunt mollitia animi, id est laborum et dolorum fuga. Et harum quidem rerum facilis est et expedita distinctio. Nam libero tempore, cum soluta nobis est eligendi optio cumque nihil impedit quo minus id quod maxime placeat facere possimus, omnis voluptas assumenda est, omnis dolor repellendus. Temporibus autem quibusdam et aut officiis debitis aut rerum necessitatibus saepe eveniet ut et voluptates repudiandae sint et molestiae non recusandae. Itaque earum rerum hic tenetur a sapiente delectus, ut aut reiciendis voluptatibus maiores alias consequatur aut perferendis doloribus asperiores repellat.\".to_string();\n        let err = TicketDescription::try_from(description).unwrap_err();\n        assert_eq!(\n            err.to_string(),\n            \"The description cannot be longer than 500 bytes\"\n        );\n    }\n\n    #[test]\n    fn test_try_from_str() {\n        let description = TicketDescription::try_from(\"A description\").unwrap();\n        assert_eq!(description.0, \"A description\");\n    }\n}\n"]]},{"n":"src/status.rs","s":[["c","// TODO: Implement `TryFrom<String>` and `TryFrom<&str>` for the `Status` enum.\n//  The parsing should be case-insensitive.\n\n"],["g","#[derive(Debug, PartialEq, Clone)]"],["c","pub enum Status {\n    ToDo,\n    InProgress,\n    Done,\n"],["g","}\n\nimpl TryFrom<String> for Status {\n    type Error = ParseStatusError;\n\n    fn try_from(value: String) -> Result<Self, Self::Error> {\n        let value = value.to_lowercase();\n        match value.as_str() {\n            \"todo\" => Ok(Status::ToDo),\n            \"inprogress\" => Ok(Status::InProgress),\n            \"done\" => Ok(Status::Done),\n            _ => Err(ParseStatusError {\n                invalid_status: value,\n            }),\n        }\n    }\n}\n\nimpl TryFrom<&str> for Status {\n    type Error = ParseStatusError;\n\n    fn try_from(value: &str) -> Result<Self, Self::Error> {\n        value.to_lowercase().try_into()\n    }\n}\n\n#[derive(Debug, thiserror::Error)]\n#[error(\"`{invalid_status}` is not a valid status. Use one of: ToDo, InProgress, Done\")]\npub struct ParseStatusError {\n    invalid_status: String,"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::convert::TryFrom;\n\n    #[test]\n    fn test_try_from_string() {\n        let status = Status::try_from(\"ToDO\".to_string()).unwrap();\n        assert_eq!(status, Status::ToDo);\n\n        let status = Status::try_from(\"inproGress\".to_string()).unwrap();\n        assert_eq!(status, Status::InProgress);\n\n        let status = Status::try_from(\"Done\".to_string()).unwrap();\n        assert_eq!(status, Status::Done);\n    }\n\n    #[test]\n    fn test_try_from_str() {\n        let status = Status::try_from(\"ToDO\").unwrap();\n        assert_eq!(status, Status::ToDo);\n\n        let status = Status::try_from(\"inproGress\").unwrap();\n        assert_eq!(status, Status::InProgress);\n\n        let status = Status::try_from(\"Done\").unwrap();\n        assert_eq!(status, Status::Done);\n    }\n\n    #[test]\n    fn test_try_from_invalid() {\n        let status = Status::try_from(\"Invalid\");\n        assert!(status.is_err());\n    }\n}\n"]]},{"n":"src/title.rs","s":[["c","// TODO: Implement `TryFrom<String>` and `TryFrom<&str>` for the `TicketTitle` type,\n//   enforcing that the title is not empty and is not longer than 50 bytes.\n//   Implement the traits required to make the tests pass too.\n\n"],["g","#[derive(Debug, PartialEq, Clone)]"],["c","pub struct TicketTitle(String);\n"],["g","\n#[derive(Debug, thiserror::Error)]\npub enum TicketTitleError {\n    #[error(\"The title cannot be empty\")]\n    Empty,\n    #[error(\"The title cannot be longer than 50 bytes\")]\n    TooLong,\n}\n\nimpl TryFrom<String> for TicketTitle {\n    type Error = TicketTitleError;\n\n    fn try_from(value: String) -> Result<Self, Self::Error> {\n        validate(&value)?;\n        Ok(Self(value))\n    }\n}\n\nimpl TryFrom<&str> for TicketTitle {\n    type Error = TicketTitleError;\n\n    fn try_from(value: &str) -> Result<Self, Self::Error> {\n        validate(value)?;\n        Ok(Self(value.to_string()))\n    }\n}\n\nfn validate(title: &str) -> Result<(), TicketTitleError> {\n    if title.is_empty() {\n        Err(TicketTitleError::Empty)\n    } else if title.len() > 50 {\n        Err(TicketTitleError::TooLong)\n    } else {\n        Ok(())\n    }\n}"],["c","\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::convert::TryFrom;\n\n    #[test]\n    fn test_try_from_string() {\n        let title = TicketTitle::try_from(\"A title\".to_string()).unwrap();\n        assert_eq!(title.0, \"A title\");\n    }\n\n    #[test]\n    fn test_try_from_empty_string() {\n        let err = TicketTitle::try_from(\"\".to_string()).unwrap_err();\n        assert_eq!(err.to_string(), \"The title cannot be empty\");\n    }\n\n    #[test]\n    fn test_try_from_long_string() {\n        let title =\n            \"A title that's definitely longer than what should be allowed in a development ticket\"\n                .to_string();\n        let err = TicketTitle::try_from(title).unwrap_err();\n        assert_eq!(err.to_string(), \"The title cannot be longer than 50 bytes\");\n    }\n\n    #[test]\n    fn test_try_from_str() {\n        let title = TicketTitle::try_from(\"A title\").unwrap();\n        assert_eq!(title.0, \"A title\");\n    }\n}\n"]]}]},{"t":"58. Ticket Management Introduction | টিকেট ম্যানেজমেন্ট ভূমিকা","b":[["p","Path: 06_ticket_management/00_intro    |    Page Reference: 130"],["p","Introduction to Chapter 6: building a ticket management system."],["p","This chapter builds on the Ticket type from previous chapters and extends it into a full in-memory ticket store."],["p","Open exercises/06_ticket_management/00_intro/src/lib.rs. Complete the introductory exercise."],["p","Chapter overview:"],["li","You will build a TicketStore that manages multiple Ticket instances."],["li","The store will support CRUD operations: create, read, update, delete."],["li","You will use Vec, HashMap, and BTreeMap as backing stores."],["li","You will work with slices (&[T]), mutable slices (&mut [T]), and the Index/IndexMut traits."],["li","Error handling will use the Result type throughout."],["p","The intro exercise is a warm-up — implement or fix the provided skeleton so the first test passes. Make note of what data structure is being used as the underlying store."]],"n":58,"en":["Introduction to the ticket management chapter, which covers collections and iterators. Topics include: stack-allocated arrays, `Vec<T>` (the growable array), the `Iterator` and `IntoIterator` traits, slices (both immutable `&[T]` and mutable `&mut [T]`), the `Index` and `IndexMut` traits, `HashMap<K, V>` and `BTreeMap<K, V>`. You will build a ticket management system that can store, retrieve, update, and delete tickets using these collection types."],"bt":["টিকেট ম্যানেজমেন্ট অধ্যায়ের ভূমিকা, যা collection এবং iterator কভার করে। Topics: stack-allocated array, `Vec<T>`, `Iterator` এবং `IntoIterator` trait, slice (`&[T]` এবং `&mut [T]`), `Index` ও `IndexMut` trait, `HashMap` এবং `BTreeMap`।"],"loc":"exercises/06_ticket_management/00_intro","f":[{"n":"src/lib.rs","s":[["c","fn intro() -> &'static str {\n    // TODO: fix me 👇\n"],["g","    \"I'm ready to build a ticket management system!\""],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::intro;\n\n    #[test]\n    fn test_intro() {\n        assert_eq!(intro(), \"I'm ready to build a ticket management system!\");\n    }\n}\n"]]}]},{"t":"59. Arrays | অ্যারে","b":[["p","Path: 06_ticket_management/05_trait_objects    |    Page Reference: 139"],["p","Use trait objects (dyn Trait) for dynamic dispatch."],["p","Sometimes you want a collection of heterogeneous types that all implement a common trait. Trait objects enable this through dynamic dispatch."],["p","Open exercises/06_ticket_management/05_trait_objects/src/lib.rs."],["p","Syntax:"],["code","// On the heap:\nlet obj: Box<dyn SomeTrait> = Box::new(ConcreteType { ... });\n// As a reference:\nlet obj: &dyn SomeTrait = &concrete_instance;"],["p","Differences between static dispatch (generics) and dynamic dispatch (dyn):"],["li","Static: fn f<T: Trait>(x: T) — monomorphised at compile time, zero-cost, but code bloat."],["li","Dynamic: fn f(x: &dyn Trait) — single function, vtable lookup at runtime, small overhead."],["p","Object safety rules for dyn Trait:"],["li","Methods must not have generic type parameters."],["li","Methods must not return Self."],["li","There can be no associated functions (without a receiver)."],["p","Your task: create or use a Vec<Box<dyn SomeTrait>> and call trait methods on its elements."]],"n":59,"en":["Work with Rust's fixed-size, stack-allocated arrays. An array is declared as `[T; N]` where `T` is the element type and `N` is the number of elements (a compile-time constant). The size is part of the type — `[u32; 5]` and `[u32; 6]` are different types. Array elements are accessed with `array[index]` (zero-indexed). The size of an array in bytes is `size_of::<T>() * N`. Practice creating arrays, accessing elements, and iterating over them. Also explore multi-dimensional arrays (arrays of arrays)."],"bt":["Rust-এর fixed-size, stack-allocated array নিয়ে কাজ করো। Array `[T; N]` হিসেবে ঘোষণা করা হয়, যেখানে `T` element টাইপ এবং `N` element-এর সংখ্যা (compile-time constant)। Array element `array[index]` দিয়ে access করা হয়।"],"loc":"exercises/06_ticket_management/01_arrays","f":[{"n":"src/lib.rs","s":[["c","// TODO: Flesh out the `WeekTemperatures` struct and its method implementations to pass the tests.\n\npub struct WeekTemperatures {\n"],["g","    temperatures: [Option<i32>; 7],"],["c","}\n\npub enum Weekday {\n    Monday,\n    Tuesday,\n    Wednesday,\n    Thursday,\n    Friday,\n    Saturday,\n    Sunday,\n}\n\nimpl WeekTemperatures {\n    pub fn new() -> Self {\n"],["g","        WeekTemperatures {\n            temperatures: [None; 7],\n        }"],["c","    }\n\n    pub fn get_temperature(&self, day: Weekday) -> Option<i32> {\n"],["g","        let index = weekday2index(&day);\n        self.temperatures[index]"],["c","    }\n\n    pub fn set_temperature(&mut self, day: Weekday, temperature: i32) {\n"],["g","        let index = weekday2index(&day);\n        self.temperatures[index] = Some(temperature);\n    }\n}\n\nfn weekday2index(day: &Weekday) -> usize {\n    match day {\n        Weekday::Monday => 0,\n        Weekday::Tuesday => 1,\n        Weekday::Wednesday => 2,\n        Weekday::Thursday => 3,\n        Weekday::Friday => 4,\n        Weekday::Saturday => 5,\n        Weekday::Sunday => 6,"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_get_temperature() {\n        let mut week_temperatures = WeekTemperatures::new();\n\n        assert_eq!(week_temperatures.get_temperature(Weekday::Monday), None);\n        assert_eq!(week_temperatures.get_temperature(Weekday::Tuesday), None);\n        assert_eq!(week_temperatures.get_temperature(Weekday::Wednesday), None);\n        assert_eq!(week_temperatures.get_temperature(Weekday::Thursday), None);\n        assert_eq!(week_temperatures.get_temperature(Weekday::Friday), None);\n        assert_eq!(week_temperatures.get_temperature(Weekday::Saturday), None);\n        assert_eq!(week_temperatures.get_temperature(Weekday::Sunday), None);\n\n        week_temperatures.set_temperature(Weekday::Monday, 20);\n        assert_eq!(week_temperatures.get_temperature(Weekday::Monday), Some(20));\n\n        week_temperatures.set_temperature(Weekday::Monday, 25);\n        assert_eq!(week_temperatures.get_temperature(Weekday::Monday), Some(25));\n\n        week_temperatures.set_temperature(Weekday::Tuesday, 30);\n        week_temperatures.set_temperature(Weekday::Wednesday, 35);\n        week_temperatures.set_temperature(Weekday::Thursday, 40);\n        week_temperatures.set_temperature(Weekday::Friday, 45);\n        week_temperatures.set_temperature(Weekday::Saturday, 50);\n        week_temperatures.set_temperature(Weekday::Sunday, 55);\n\n        assert_eq!(week_temperatures.get_temperature(Weekday::Monday), Some(25));\n        assert_eq!(\n            week_temperatures.get_temperature(Weekday::Tuesday),\n            Some(30)\n        );\n        assert_eq!(\n            week_temperatures.get_temperature(Weekday::Wednesday),\n            Some(35)\n        );\n        assert_eq!(\n            week_temperatures.get_temperature(Weekday::Thursday),\n            Some(40)\n        );\n        assert_eq!(week_temperatures.get_temperature(Weekday::Friday), Some(45));\n        assert_eq!(\n            week_temperatures.get_temperature(Weekday::Saturday),\n            Some(50)\n        );\n        assert_eq!(week_temperatures.get_temperature(Weekday::Sunday), Some(55));\n    }\n}\n"]]}]},{"t":"60. Vectors | ভেক্টর","b":[["p","Path: 06_ticket_management/06_impl_trait    |    Page Reference: 141"],["p","Use impl Trait in function signatures for position-based type erasure."],["p","impl Trait is a syntactic shorthand for \"some concrete type that implements Trait\" without naming the type explicitly."],["p","Open exercises/06_ticket_management/06_impl_trait/src/lib.rs."],["p","Two positions for impl Trait:"],["code","1. Argument position (anonymous generic):\n     fn process(items: impl Iterator<Item = Ticket>) { ... }\n   This is sugar for: fn process<T: Iterator<Item = Ticket>>(items: T)\n2. Return position (opaque type):\n     fn find_tickets() -> impl Iterator<Item = &Ticket> { ... }\n   The caller cannot name the concrete type; they can only use it as the trait."],["p","Key differences from dyn Trait:"],["li","impl Trait uses static dispatch (monomorphised) — faster."],["li","dyn Trait uses dynamic dispatch — more flexible (multiple concrete types at runtime)."],["li","impl Trait in return position can only return ONE concrete type."],["p","The tests will call your function and use the returned iterator or pass various concrete types."]],"n":60,"en":["Use `Vec<T>`, Rust's growable, heap-allocated array type. A `Vec` stores its elements contiguously in heap memory and can grow dynamically. Create a `Vec` with `Vec::new()`, `vec![1, 2, 3]`, or `Vec::with_capacity(n)`. Add elements with `.push(value)`, remove the last element with `.pop()`, and access elements with `vec[index]`. Note that `String` is implemented as a `Vec<u8>` internally. Understand the `Vec`'s memory layout: a pointer to the heap buffer, a length (number of elements), and a capacity (allocated buffer size)."],"bt":["Rust-এর growable, heap-allocated array টাইপ `Vec<T>` ব্যবহার করো। `Vec::new()`, `vec![1, 2, 3]`, বা `Vec::with_capacity(n)` দিয়ে তৈরি করো। `.push(value)` দিয়ে element যোগ করো, `.pop()` দিয়ে শেষ element সরাও।"],"loc":"exercises/06_ticket_management/02_vec","f":[{"n":"src/lib.rs","s":[["c","// Given a number `n`, return the `n+1`th number in the Fibonacci sequence.\n//\n// The Fibonacci sequence is defined as follows:\n//\n// - The first number of the sequence is 0.\n// - The second number of the sequence is 1.\n// - Every subsequent number is the sum of the two preceding numbers.\n//\n// So the sequence goes: 0, 1, 1, 2, 3, 5, 8, 13, 21, and so on.\n//\n// We expect `fibonacci(0)` to return `0`, `fibonacci(1)` to return `1`,\n// `fibonacci(2)` to return `1`, and so on.\npub fn fibonacci(n: u32) -> u32 {\n"],["h","    //\n    // Hint: use a `Vec` to memoize the results you have already calculated\n    // so that you don't have to recalculate them several times.\n"],["g","    let n = n as usize;\n    let mut memo = vec![0, 1];\n    for i in 2..=n {\n        memo.push(memo[i - 1] + memo[i - 2]);\n    }\n    memo[n]"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::fibonacci;\n\n    #[test]\n    fn first() {\n        assert_eq!(fibonacci(0), 0);\n    }\n\n    #[test]\n    fn second() {\n        assert_eq!(fibonacci(1), 1);\n    }\n\n    #[test]\n    fn third() {\n        assert_eq!(fibonacci(2), 1);\n    }\n\n    #[test]\n    fn tenth() {\n        assert_eq!(fibonacci(10), 55);\n    }\n\n    #[test]\n    fn thirtieth() {\n        assert_eq!(fibonacci(30), 832040);\n    }\n}\n"]]}]},{"t":"61. Resizing a Vec | Vec রিসাইজ করা","b":[["p","Path: 06_ticket_management/07_convert    |    Page Reference: 143"],["p","Apply TryFrom and TryInto for fallible type conversions."],["p","From/Into are infallible (they always succeed). When a conversion can fail, use TryFrom/TryInto which return Result<Self, Error>."],["p","Open exercises/06_ticket_management/07_convert/src/lib.rs."],["p","TryFrom signature:"],["code","pub trait TryFrom<T>: Sized {\n    type Error;\n    fn try_from(value: T) -> Result<Self, Self::Error>;\n}"],["p","Implementing TryFrom:"],["code","impl TryFrom<String> for Ticket {\n    type Error = TicketNewError;\n    fn try_from(s: String) -> Result<Ticket, TicketNewError> {\n        // parse s, return Ok(ticket) or Err(...)\n    }\n}"],["p","Implementing TryFrom automatically gives you TryInto for free."],["p","The tests will call Ticket::try_from(some_string) and Ticket::try_into() and check both the Ok and Err cases."]],"n":61,"en":["Understand how `Vec` grows and shrinks. When you push an element beyond the current capacity, `Vec` allocates a new, larger buffer (typically doubling in size), copies all existing elements, and frees the old buffer. To avoid repeated reallocations, pre-allocate with `Vec::with_capacity(n)` if you know the approximate size in advance. Use `.reserve(n)` to ensure at least `n` additional slots. `.shrink_to_fit()` releases unused capacity. Implement a function that efficiently builds a `Vec<Ticket>` from a collection of inputs without unnecessary reallocations."],"bt":["`Vec` কীভাবে বাড়ে ও ছোট হয় তা বোঝো। capacity-এর বাইরে push করলে `Vec` একটি নতুন, বড় buffer allocate করে। অপ্রয়োজনীয় reallocation এড়াতে `Vec::with_capacity(n)` ব্যবহার করো।"],"loc":"exercises/06_ticket_management/03_resizing","f":[{"n":"src/lib.rs","s":[["c","#[cfg(test)]\nmod tests {\n    #[test]\n    fn resizing() {\n        let mut v = Vec::with_capacity(2);\n        v.push(1);\n        v.push(2); // max capacity reached\n        assert_eq!(v.capacity(), 2);\n\n        v.push(3); // beyond capacity, needs to resize\n\n        // Can you guess what the new capacity will be?\n        // Beware that the standard library makes no guarantees about the\n        // algorithm used to resize the vector, so this may change in the future.\n"],["g","        assert_eq!(v.capacity(), 4);"],["c","    }\n}\n"]]}]},{"t":"62. Iterators | ইটারেটর","b":[["p","Path: 06_ticket_management/08_rc    |    Page Reference: 145"],["p","Use Rc<T> (reference counted pointer) for shared ownership."],["p","In some scenarios you want multiple parts of your program to share ownership of the same data without copying it. Rc<T> provides this through reference counting."],["p","Open exercises/06_ticket_management/08_rc/src/lib.rs."],["p","Usage:"],["code","use std::rc::Rc;\nlet shared = Rc::new(Ticket::new(...));\nlet clone1 = Rc::clone(&shared); // increments ref count\nlet clone2 = Rc::clone(&shared); // increments again\n// All three handles point to the same Ticket on the heap.\n// Memory freed when the last handle is dropped."],["p","Key points:"],["li","Rc<T> is NOT thread-safe (use Arc<T> for multi-threaded scenarios)."],["li","Rc::clone is cheap — it just increments a counter."],["li","To get a &T from Rc<T>, just use * or let the deref coercion work."],["li","Rc<T> provides immutable access — for mutation, combine with RefCell<T>."],["p","Rc::strong_count(&rc) returns the current reference count."]],"n":62,"en":["Use the `Iterator` and `IntoIterator` traits to iterate over collections. `IntoIterator` converts a collection into an iterator. `Iterator` provides the `next()` method and dozens of adapter methods (`map`, `filter`, `fold`, `sum`, etc.). A `for` loop in Rust calls `.into_iter()` on the collection automatically. Practice consuming an iterator with `for`, `.collect()`, `.sum()`, and `.count()`. Understand the difference between consuming an iterator (takes ownership), iterating by reference (`.iter()` → `&T`), and iterating with mutable references (`.iter_mut()` → `&mut T`)."],"bt":["`Iterator` এবং `IntoIterator` trait ব্যবহার করে collection iterate করো। `for` লুপ স্বয়ংক্রিয়ভাবে `.into_iter()` কল করে। `map`, `filter`, `fold`, `sum` ইত্যাদি adapter মেথড অনুশীলন করো।"],"loc":"exercises/06_ticket_management/04_iterators","f":[{"n":"src/lib.rs","s":[["c","use ticket_fields::{TicketDescription, TicketTitle};\n\n// TODO: Let's start sketching our ticket store!\n//  First task: implement `IntoIterator` on `TicketStore` to allow iterating over all the tickets\n//  it contains using a `for` loop.\n//\n// Hint: you shouldn't have to implement the `Iterator` trait in this case.\n//   You want to *delegate* the iteration to the `Vec<Ticket>` field in `TicketStore`.\n//   Look at the standard library documentation for `Vec` to find the right type\n//   to return from `into_iter`.\n#[derive(Clone)]\npub struct TicketStore {\n    tickets: Vec<Ticket>,\n}\n\n#[derive(Clone, Debug, PartialEq)]\npub struct Ticket {\n    pub title: TicketTitle,\n    pub description: TicketDescription,\n    pub status: Status,\n}\n\n#[derive(Clone, Debug, Copy, PartialEq)]\npub enum Status {\n    ToDo,\n    InProgress,\n    Done,\n}\n\nimpl TicketStore {\n    pub fn new() -> Self {\n        Self {\n            tickets: Vec::new(),\n        }\n    }\n\n    pub fn add_ticket(&mut self, ticket: Ticket) {\n        self.tickets.push(ticket);\n    }\n}\n\n"],["g","impl IntoIterator for TicketStore {\n    type Item = Ticket;\n    type IntoIter = std::vec::IntoIter<Self::Item>;\n\n    fn into_iter(self) -> Self::IntoIter {\n        self.tickets.into_iter()\n    }\n}"],["c","#[cfg(test)]\nmod tests {\n    use super::*;\n    use ticket_fields::test_helpers::{ticket_description, ticket_title};\n\n    #[test]\n    fn add_ticket() {\n        let mut store = TicketStore::new();\n\n        let ticket = Ticket {\n            title: ticket_title(),\n            description: ticket_description(),\n            status: Status::ToDo,\n        };\n        store.add_ticket(ticket);\n\n        let ticket = Ticket {\n            title: ticket_title(),\n            description: ticket_description(),\n            status: Status::InProgress,\n        };\n        store.add_ticket(ticket);\n\n        let tickets: Vec<_> = store.clone().into_iter().collect();\n        assert_eq!(tickets, store.tickets);\n    }\n}\n"]]}]},{"t":"63. The .iter() Method | .iter() মেথড","b":[["p","Path: 06_ticket_management/09_cell    |    Page Reference: 147"],["p","Use Cell<T> and RefCell<T> for interior mutability."],["p","Normally, Rust enforces the borrow rules at compile time. Interior mutability types allow mutation through a shared (&T) reference by moving the borrow checks to runtime."],["p","Open exercises/06_ticket_management/09_cell/src/lib.rs."],["p","Cell<T> — for Copy types, no runtime overhead:"],["code","use std::cell::Cell;\nlet c = Cell::new(5);\nc.set(10);\nprintln!(\"{}\", c.get()); // 10"],["p","RefCell<T> — for non-Copy types, runtime borrow checking:"],["code","use std::cell::RefCell;\nlet r = RefCell::new(Vec::new());\nr.borrow_mut().push(42); // panics if already borrowed\nprintln!(\"{:?}\", r.borrow()); // immutable borrow"],["p","Common pattern: Rc<RefCell<T>> for shared, mutable ownership in single-threaded code:"],["code","let shared: Rc<RefCell<Vec<Ticket>>> = Rc::new(RefCell::new(vec![]));"],["p","RefCell panics at runtime if borrow rules are violated. Use it only when the compiler cannot verify safety statically."]],"n":63,"en":["Distinguish between `.into_iter()`, `.iter()`, and `.iter_mut()`. `.into_iter()` consumes the collection and yields owned values. `.iter()` borrows the collection and yields immutable references (`&T`). `.iter_mut()` borrows the collection mutably and yields mutable references (`&mut T`). When you call `for x in &vec { ... }`, this is syntactic sugar for `for x in vec.iter() { ... }` and `x` is of type `&T`. Use `.iter()` when you want to inspect elements without consuming or modifying the collection."],"bt":["`.into_iter()`, `.iter()`, এবং `.iter_mut()`-এর মধ্যে পার্থক্য করো। `.into_iter()` collection consume করে। `.iter()` immutable reference (`&T`) yield করে। `.iter_mut()` mutable reference (`&mut T`) yield করে।"],"loc":"exercises/06_ticket_management/05_iter","f":[{"n":"src/lib.rs","s":[["c","use ticket_fields::{TicketDescription, TicketTitle};\n\n// TODO: Provide an `iter` method that returns an iterator over `&Ticket` items.\n//\n// Hint: just like in the previous exercise, you want to delegate the iteration to\n//   the `Vec<Ticket>` field in `TicketStore`. Look at the standard library documentation\n//   for `Vec` to find the right type to return from `iter`.\n#[derive(Clone)]\npub struct TicketStore {\n    tickets: Vec<Ticket>,\n}\n\n#[derive(Debug, Clone, PartialEq)]\npub struct Ticket {\n    title: TicketTitle,\n    description: TicketDescription,\n    status: Status,\n}\n\n#[derive(Clone, Debug, Copy, PartialEq)]\npub enum Status {\n    ToDo,\n    InProgress,\n    Done,\n}\n\nimpl TicketStore {\n    pub fn new() -> Self {\n        Self {\n            tickets: Vec::new(),\n        }\n    }\n\n    pub fn add_ticket(&mut self, ticket: Ticket) {\n        self.tickets.push(ticket);\n    }\n"],["g","\n    pub fn iter(&self) -> std::slice::Iter<Ticket> {\n        self.tickets.iter()\n    }"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use ticket_fields::test_helpers::{ticket_description, ticket_title};\n\n    #[test]\n    fn add_ticket() {\n        let mut store = TicketStore::new();\n\n        let ticket = Ticket {\n            title: ticket_title(),\n            description: ticket_description(),\n            status: Status::ToDo,\n        };\n        store.add_ticket(ticket);\n\n        let ticket = Ticket {\n            title: ticket_title(),\n            description: ticket_description(),\n            status: Status::InProgress,\n        };\n        store.add_ticket(ticket);\n\n        let tickets: Vec<&Ticket> = store.iter().collect();\n        let tickets2: Vec<&Ticket> = store.iter().collect();\n        assert_eq!(tickets, tickets2);\n    }\n}\n"]]}]},{"t":"64. Lifetimes | লাইফটাইম","b":[["p","Path: 06_ticket_management/10_slices    |    Page Reference: 149"],["p","Work with slices — dynamically-sized views into contiguous data."],["p","A slice &[T] is a view into a sequence of elements. It does not own the data; it borrows it from an array, Vec, or another slice."],["p","Open exercises/06_ticket_management/10_slices/src/lib.rs."],["p","Creating slices:"],["code","let arr = [1, 2, 3, 4, 5];\nlet slice: &[i32] = &arr[1..4];  // [2, 3, 4]\nlet v = vec![10, 20, 30];\nlet all: &[i32] = &v;"],["p","Key slice operations:"],["li","slice.len() — number of elements"],["li","slice.is_empty()"],["li","slice[i] — index access (panics if out of range)"],["li","slice.get(i) — safe access returning Option<&T>"],["li","slice.iter() — iterator over &T"],["li","slice.first() / slice.last() — first/last element as Option<&T>"],["li","slice.contains(&val)"],["li","slice.sort() (on &mut [T] where T: Ord)"],["li","slice.windows(n) — overlapping windows of size n"],["li","slice.chunks(n) — non-overlapping chunks of size n"]],"n":64,"en":["Understand Rust's lifetime annotations for managing reference validity. A lifetime annotation (e.g. `'a`) names a scope during which a reference is valid. The compiler uses lifetime analysis to ensure that references never outlive the data they point to (no dangling pointers). In many cases, lifetimes can be elided (omitted) and inferred by the compiler. Practice adding explicit lifetime annotations to a function that returns a reference to one of its input references. Understand the lifetime elision rules that allow most simple cases to compile without explicit annotations."],"bt":["Reference validity পরিচালনার জন্য Rust-এর lifetime annotation বোঝো। Lifetime annotation (যেমন `'a`) একটি scope নামকরণ করে যার মধ্যে reference valid। Compiler lifetime বিশ্লেষণ ব্যবহার করে নিশ্চিত করে যে reference কখনো তার data-কে outlive করে না।"],"loc":"exercises/06_ticket_management/06_lifetimes","f":[{"n":"src/lib.rs","s":[["c","use ticket_fields::{TicketDescription, TicketTitle};\n\n// TODO: Implement the `IntoIterator` trait for `&TicketStore` so that the test compiles and passes.\n#[derive(Clone)]\npub struct TicketStore {\n    tickets: Vec<Ticket>,\n}\n\n#[derive(Clone, Debug, PartialEq)]\npub struct Ticket {\n    pub title: TicketTitle,\n    pub description: TicketDescription,\n    pub status: Status,\n}\n\n#[derive(Clone, Debug, Copy, PartialEq)]\npub enum Status {\n    ToDo,\n    InProgress,\n    Done,\n}\n\nimpl TicketStore {\n    pub fn new() -> Self {\n        Self {\n            tickets: Vec::new(),\n        }\n    }\n\n    pub fn add_ticket(&mut self, ticket: Ticket) {\n        self.tickets.push(ticket);\n    }\n\n    pub fn iter(&self) -> std::slice::Iter<Ticket> {\n        self.tickets.iter()\n    }\n}\n\n"],["g","impl<'a> IntoIterator for &'a TicketStore {\n    type Item = &'a Ticket;\n    type IntoIter = std::slice::Iter<'a, Ticket>;\n\n    fn into_iter(self) -> Self::IntoIter {\n        self.tickets.iter()\n    }\n}"],["c","#[cfg(test)]\nmod tests {\n    use super::*;\n    use ticket_fields::test_helpers::{ticket_description, ticket_title};\n\n    #[test]\n    fn add_ticket() {\n        let mut store = TicketStore::new();\n\n        let ticket = Ticket {\n            title: ticket_title(),\n            description: ticket_description(),\n            status: Status::ToDo,\n        };\n        store.add_ticket(ticket);\n\n        let ticket = Ticket {\n            title: ticket_title(),\n            description: ticket_description(),\n            status: Status::InProgress,\n        };\n        store.add_ticket(ticket);\n\n        let tickets: Vec<&Ticket> = store.iter().collect();\n        let tickets2: Vec<&Ticket> = (&store).into_iter().collect();\n        assert_eq!(tickets, tickets2);\n    }\n}\n"]]}]},{"t":"65. Iterator Combinators | ইটারেটর কম্বিনেটর","b":[["p","Path: 06_ticket_management/05_ticket_store    |    Page Reference: 138"],["p","Implement a TicketStore — an in-memory collection of tickets."],["p","Open exercises/06_ticket_management/05_ticket_store/src/lib.rs. Build the TicketStore type."],["p","Requirements:"],["li","The store assigns each ticket a unique TicketId (a newtype wrapper around u64)."],["li","Supported operations:"],["li","add(ticket: Ticket) -> TicketId — adds a ticket, returns its ID."],["li","get(id: TicketId) -> Option<&Ticket> — retrieves a ticket by ID."],["p","Implementation hints:"],["li","Use a Vec<Ticket> as the backing store. The ticket's index in the Vec is its ID."],["li","Alternatively, use HashMap<TicketId, Ticket> for O(1) lookups by ID."],["li","Wrap the ID in a newtype to make the API type-safe: struct TicketId(u64);"],["p","The tests will add tickets, retrieve them by ID, and verify the returned data matches what was inserted. Make sure get() returns None for IDs that were never inserted."]],"n":65,"en":["Use iterator combinators to write concise data-transformation pipelines. `Iterator` provides many powerful methods: `.map(f)` transforms each element, `.filter(predicate)` keeps only elements that satisfy the predicate, `.flat_map(f)` maps and flattens, `.take(n)` takes the first n elements, `.skip(n)` skips the first n, `.enumerate()` pairs each element with its index, `.zip(other)` pairs elements from two iterators, `.chain(other)` concatenates iterators, `.fold(init, f)` reduces to a single value, `.collect::<Vec<_>>()` collects into a collection. Practice composing these to filter and transform a list of tickets."],"bt":["সংক্ষিপ্ত data-transformation pipeline লিখতে iterator combinator ব্যবহার করো। `.map(f)`, `.filter(predicate)`, `.flat_map(f)`, `.take(n)`, `.skip(n)`, `.enumerate()`, `.zip(other)`, `.fold(init, f)`, `.collect()` অনুশীলন করো।"],"loc":"exercises/06_ticket_management/07_combinators","f":[{"n":"src/lib.rs","s":[["c","// TODO: Implement the `to_dos` method. It must return a `Vec` of references to the tickets\n//  in `TicketStore` with status set to `Status::ToDo`.\nuse ticket_fields::{TicketDescription, TicketTitle};\n\n#[derive(Clone)]\npub struct TicketStore {\n    tickets: Vec<Ticket>,\n}\n\n#[derive(Clone, Debug, PartialEq)]\npub struct Ticket {\n    pub title: TicketTitle,\n    pub description: TicketDescription,\n    pub status: Status,\n}\n\n#[derive(Clone, Debug, Copy, PartialEq)]\npub enum Status {\n    ToDo,\n    InProgress,\n    Done,\n}\n\nimpl TicketStore {\n    pub fn new() -> Self {\n        Self {\n            tickets: Vec::new(),\n        }\n    }\n\n    pub fn add_ticket(&mut self, ticket: Ticket) {\n        self.tickets.push(ticket);\n    }\n"],["g","\n    pub fn to_dos(&self) -> Vec<&Ticket> {\n        self.tickets\n            .iter()\n            .filter(|ticket| ticket.status == Status::ToDo)\n            .collect()\n    }"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use ticket_fields::test_helpers::{ticket_description, ticket_title};\n\n    #[test]\n    fn todos() {\n        let mut store = TicketStore::new();\n\n        let todo = Ticket {\n            title: ticket_title(),\n            description: ticket_description(),\n            status: Status::ToDo,\n        };\n        store.add_ticket(todo.clone());\n\n        let ticket = Ticket {\n            title: ticket_title(),\n            description: ticket_description(),\n            status: Status::InProgress,\n        };\n        store.add_ticket(ticket);\n\n        let todos: Vec<&Ticket> = store.to_dos();\n        assert_eq!(todos.len(), 1);\n        assert_eq!(todos[0], &todo);\n    }\n}\n"]]}]},{"t":"66. impl Trait in Return Position | Return Position-এ impl T
