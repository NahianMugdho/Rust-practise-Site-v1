q!(size_of::<u16>(), 2);"],["c","    }\n\n    #[test]\n    fn i32_size() {\n"],["g","        assert_eq!(size_of::<i32>(), 4);"],["c","    }\n\n    #[test]\n    fn bool_size() {\n"],["g","        assert_eq!(size_of::<bool>(), 1);"],["c","    }\n}\n"]]}]},{"t":"23. Heap Allocation | হিপ বরাদ্দ (Heap Allocation)","b":[["p","Path: 03_ticket_v1/09_heap    |    Page Reference: 59"],["p","Explore heap allocation in Rust and how String manages heap memory."],["p","Unlike stack data, heap data has a dynamic size and lifetime. In Rust, heap memory is managed through ownership — when the owner is dropped, the memory is freed automatically (no garbage collector required)."],["p","Open exercises/03_ticket_v1/09_heap/src/lib.rs. This exercise focuses on heap-allocated types."],["p","Key heap types:"],["li","String — owns a heap-allocated UTF-8 byte buffer."],["li","Created with: String::from(\"hello\"), \"hello\".to_string(), String::new()"],["li","Capacity vs length: a String can have extra capacity pre-allocated."],["li","push_str, push, +, format! all modify or create Strings."],["li","Box<T> — places a single value T on the heap."],["li","Vec<T> — a growable, heap-allocated array."],["p","A String's internal representation: (pointer to heap buffer, length, capacity) — three usize values stored on the stack."],["p","Your task: implement the exercise function so tests pass. The tests will verify your understanding of String creation, modification, and ownership."]],"n":23,"en":["Understand heap memory allocation in Rust. The heap is used for data whose size is not known at compile time or which needs to live longer than the current function call. `String` is a heap-allocated type: it stores its character data on the heap and keeps a pointer, length, and capacity on the stack. When a `String` goes out of scope, its `Drop` implementation automatically frees the heap memory. Explore how `String` is implemented internally using `Vec<u8>`, and understand why the heap allocation is not considered part of the `String`'s stack footprint."],"bt":["Rust-এ heap মেমরি allocation বোঝো। Heap ব্যবহার হয় যখন কম্পাইল সময়ে ডেটার আকার জানা নেই বা ডেটা বর্তমান ফাংশন কলের চেয়ে দীর্ঘস্থায়ী হতে হবে। `String` একটি heap-allocated টাইপ।"],"loc":"exercises/03_ticket_v1/09_heap","f":[{"n":"src/lib.rs","s":[["c","pub struct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\n// TODO: based on what you learned in this section, replace `todo!()` with\n//  the correct **stack size** for the respective type.\n#[cfg(test)]\nmod tests {\n    use super::Ticket;\n    use std::mem::size_of;\n\n    #[test]\n    fn string_size() {\n"],["g","        assert_eq!(size_of::<String>(), 24);"],["c","    }\n\n    #[test]\n    fn ticket_size() {\n        // This is a tricky question!\n        // The \"intuitive\" answer happens to be the correct answer this time,\n        // but, in general, the memory layout of structs is a more complex topic.\n        // If you're curious, check out the \"Type layout\" section of The Rust Reference\n        // https://doc.rust-lang.org/reference/type-layout.html for more information.\n"],["g","        assert_eq!(size_of::<Ticket>(), 72);"],["c","    }\n}\n"]]}]},{"t":"24. References in Memory | মেমরিতে রেফারেন্স","b":[["p","Path: 03_ticket_v1/10_references_in_memory    |    Page Reference: 60"],["p","Understand references (borrowing) and how they are represented in memory."],["p","A reference &T is a pointer to a value of type T, plus a lifetime guarantee. References allow you to use a value without taking ownership."],["p","Open exercises/03_ticket_v1/10_references_in_memory/src/lib.rs. Your tasks:"],["p","1. Fix functions that currently take ownership (T) to take references (&T) instead."],["p","2. Understand the difference between &String and &str."],["p","3. Understand that a &String is a reference to the String struct on the stack (which itself points to the heap), while &str points directly into the heap buffer."],["p","Borrowing rules:"],["li","You can have any number of immutable references (&T) at the same time."],["li","You can have exactly one mutable reference (&mut T) at a time."],["li","You cannot have both a mutable and immutable reference at the same time."],["p","In memory, a reference is just a pointer (one machine word). A &str (a string slice) is a fat pointer: (pointer, length)."]],"n":24,"en":["Understand how references are represented in memory. A reference (`&T`) is a pointer — a value on the stack that stores the memory address of another value. References can point to stack or heap memory. The size of any reference is always `std::mem::size_of::<usize>()` bytes — one pointer-sized word — regardless of the size of the data being referenced. Practice using `std::mem::size_of_val()` and `std::mem::size_of::<T>()` to compare the sizes of owned values versus references to those values."],"bt":["রেফারেন্সগুলো মেমরিতে কীভাবে উপস্থাপিত হয় তা বোঝো। একটি রেফারেন্স (`&T`) হলো একটি pointer — stack-এ একটি মান যা অন্য মানের মেমরি ঠিকানা সংরক্ষণ করে। যেকোনো রেফারেন্সের আকার সবসময় `usize` bytes।"],"loc":"exercises/03_ticket_v1/10_references_in_memory","f":[{"n":"src/lib.rs","s":[["c","pub struct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\n// TODO: based on what you learned in this section, replace `todo!()` with\n//  the correct **stack size** for the respective type.\n#[cfg(test)]\nmod tests {\n    use super::Ticket;\n    use std::mem::size_of;\n\n"],["g","    // All numbers below assume you're running on a 64-bit system.\n    // If you're running on a 32-bit system, pointers will be 4 bytes long instead of 8."],["c","    #[test]\n    fn u16_ref_size() {\n"],["g","        assert_eq!(size_of::<&u16>(), 8);"],["c","    }\n\n    #[test]\n    fn u64_mut_ref_size() {\n"],["g","        assert_eq!(size_of::<&mut u64>(), 8);"],["c","    }\n\n    #[test]\n    fn ticket_ref_size() {\n"],["g","        assert_eq!(size_of::<&Ticket>(), 8);"],["c","    }\n}\n"]]}]},{"t":"25. Destructors | ডেস্ট্রাক্টর","b":[["p","Path: 03_ticket_v1/11_destructor    |    Page Reference: 64"],["p","Understand how Rust automatically runs cleanup code (destructors) when values go out of scope."],["p","In Rust, the Drop trait defines a drop method that is automatically called when a value's owner goes out of scope. This is how String, Vec, Box, and other heap-managing types free their memory."],["p","Open exercises/03_ticket_v1/11_destructor/src/lib.rs. This exercise asks you to:"],["p","1. Understand when drop() is called (at end of scope, or when ownership ends)."],["p","2. Possibly implement the Drop trait on a custom type:"],["code","impl Drop for MyType {\n    fn drop(&mut self) {\n        // cleanup code\n    }\n}"],["p","3. Understand that you cannot call drop() directly on a value — use std::mem::drop(value) if you need early deallocation."],["p","4. Understand that Drop and Copy are mutually exclusive — Copy types do not need destructors."],["p","The tests may use a shared counter or a flag to verify that drop runs exactly the expected number of times."]],"n":25,"en":["Understand how Rust automatically cleans up resources through destructors. When a value goes out of scope, Rust calls its destructor — the `drop` function defined by the `Drop` trait — to release any resources it owns. This is RAII (Resource Acquisition Is Initialisation) in action. You can also call `std::mem::drop(value)` explicitly to drop a value early. Importantly, you cannot drop a value while an active reference to it exists — the borrow checker prevents use-after-free bugs at compile time. Practice implementing `Drop` for a custom type."],"bt":["Rust কীভাবে destructor-এর মাধ্যমে স্বয়ংক্রিয়ভাবে resource পরিষ্কার করে তা বোঝো। একটি মান scope-এর বাইরে গেলে, Rust তার destructor — `Drop` trait দ্বারা সংজ্ঞায়িত `drop` ফাংশন — কল করে। একটি কাস্টম টাইপের জন্য `Drop` ইমপ্লিমেন্ট করো।"],"loc":"exercises/03_ticket_v1/11_destructor","f":[{"n":"src/lib.rs","s":[["c","// We need some more machinery to write a proper exercise for destructors.\n// We'll pick the concept up again in a later chapter after covering traits and\n// interior mutability.\nfn outro() -> &'static str {\n"],["g","    \"I have a basic understanding of destructors!\""],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::outro;\n\n    #[test]\n    fn test_outro() {\n        assert_eq!(outro(), \"I have a basic understanding of destructors!\");\n    }\n}\n"]]}]},{"t":"26. Ticket — Wrapping Up | টিকেট — সমাপ্তি","b":[["p","Path: 03_ticket_v1/12_outro    |    Page Reference: 65"],["p","Consolidate everything you have learned in Chapter 3."],["p","This is the wrap-up exercise for the \"Modelling a Ticket\" chapter. You will receive minimal guidance — the exercise description and the tests are your only guides."],["p","Concepts covered in this chapter that may appear in the exercise:"],["li","Struct definition and instantiation"],["li","Private fields with public constructors and accessors"],["li","Input validation with panic!"],["li","Modules and visibility (pub, pub(crate))"],["li","Ownership and borrowing"],["li","Mutable references and setter methods"],["li","Stack vs heap allocation"],["li","The Drop trait and automatic cleanup"],["p","Your task: read the tests carefully, determine what the code must do, and implement it. There is no single correct solution — focus on making the tests pass with idiomatic, clean Rust."]],"n":26,"en":["A consolidation exercise covering all the concepts from Chapter 3: structs, visibility, encapsulation, ownership, mutable references, stack vs. heap, and destructors. You will receive minimal guidance — the goal is to combine everything you have learned to build a complete, well-encapsulated `Ticket` type with a constructor, getters, setters, and validation. This exercise tests your ability to reason about ownership and borrowing in a realistic scenario."],"bt":["অধ্যায় ৩-এর সমস্ত ধারণা কভার করে একটি consolidation exercise: struct, visibility, encapsulation, ownership, mutable references, stack বনাম heap, এবং destructor। সম্পূর্ণ, সুসংহত `Ticket` টাইপ তৈরি করো।"],"loc":"exercises/03_ticket_v1/12_outro","f":[{"n":"src/lib.rs","s":[["c","// TODO: Define a new `Order` type.\n//   It should keep track of three pieces of information: `product_name`, `quantity`, and `unit_price`.\n//   The product name can't be empty and it can't be longer than 300 bytes.\n//   The quantity must be strictly greater than zero.\n//   The unit price is in cents and must be strictly greater than zero.\n//   Order must include a method named `total` that returns the total price of the order.\n//   Order must provide setters and getters for each field.\n//\n// Tests are located in a different place this time—in the `tests` folder.\n// The `tests` folder is a special location for `cargo`. It's where it looks for **integration tests**.\n// Integration here has a very specific meaning: they test **the public API** of your project.\n// You'll need to pay attention to the visibility of your types and methods; integration\n// tests can't access private or `pub(crate)` items.\n"],["g","pub struct Order {\n    product_name: String,\n    quantity: u32,\n    unit_price: u32,\n}\n\nimpl Order {\n    pub fn new(product_name: String, quantity: u32, unit_price: u32) -> Order {\n        validate_product_name(&product_name);\n        validate_quantity(&quantity);\n        validate_unit_price(&unit_price);\n\n        Order {\n            product_name,\n            quantity,\n            unit_price,\n        }\n    }\n\n    pub fn product_name(&self) -> &String {\n        &self.product_name\n    }\n\n    pub fn quantity(&self) -> &u32 {\n        &self.quantity\n    }\n\n    pub fn unit_price(&self) -> &u32 {\n        &self.unit_price\n    }\n\n    pub fn set_product_name(&mut self, product_name: String) {\n        validate_product_name(&product_name);\n        self.product_name = product_name;\n    }\n\n    pub fn set_quantity(&mut self, quantity: u32) {\n        validate_quantity(&quantity);\n        self.quantity = quantity;\n    }\n\n    pub fn set_unit_price(&mut self, unit_price: u32) {\n        validate_unit_price(&unit_price);\n        self.unit_price = unit_price;\n    }\n\n    pub fn total(&self) -> u32 {\n        self.quantity * self.unit_price\n    }\n}\n\nfn validate_product_name(product_name: &String) {\n    if product_name.is_empty() {\n        panic!(\"Product name cannot be empty\");\n    }\n    if product_name.len() > 300 {\n        panic!(\"Product name cannot be longer than 300 bytes\");\n    }\n}\n\nfn validate_quantity(quantity: &u32) {\n    if quantity == &0 {\n        panic!(\"Quantity must be greater than zero\");\n    }\n}\n\nfn validate_unit_price(unit_price: &u32) {\n    if unit_price == &0 {\n        panic!(\"Unit price must be greater than zero\");\n    }\n}"]]}]}]},{"id":"c4","t":"Chapter 4: Traits","k":"chapter","ex":[{"t":"27. Traits — Introduction | ট্রেইট — ভূমিকা","b":[["p","Path: 04_traits/00_intro    |    Page Reference: 66"],["p","Introduction to Chapter 4: Traits."],["p","This introductory exercise bridges Chapter 3 and Chapter 4. It revisits the Ticket type and introduces the concept of traits."],["p","Topics you will encounter in this chapter:"],["li","Traits: defining shared behaviour across types"],["li","The Deref and DerefCoercion traits: automatic reference coercions"],["li","Sized: a marker trait for types with a known compile-time size"],["li","Drop: for custom cleanup logic"],["li","From/Into: for value conversions"],["li","Clone and Copy: for duplication semantics"],["li","Operator overloading via std::ops traits"],["p","Open exercises/04_traits/00_intro/src/lib.rs and implement the function/struct as required by the tests. This exercise is a gentle warm-up — the real complexity begins in the following exercises."]],"n":27,"en":["Introduction to Rust's trait system. A trait defines a set of methods that a type must implement to satisfy the trait contract. Traits are Rust's mechanism for abstraction and polymorphism, similar to interfaces in Java or C#. This chapter will cover: defining traits, implementing traits for existing and custom types, operator overloading via traits, derive macros, trait bounds in generic functions, string slices, the `Deref` trait, the `Sized` marker trait, the `From`/`Into` conversion traits, associated types vs. generic parameters, and the `Clone`, `Copy`, and `Drop` traits."],"bt":["Rust-এর trait সিস্টেমের ভূমিকা। একটি trait মেথডের একটি সেট সংজ্ঞায়িত করে যা একটি টাইপকে অবশ্যই ইমপ্লিমেন্ট করতে হবে। Trait হলো Rust-এর abstraction ও polymorphism-এর মেকানিজম, Java বা C#-এর interface-এর মতো।"],"loc":"exercises/04_traits/00_intro","f":[{"n":"src/lib.rs","s":[["c","fn intro() -> &'static str {\n    // TODO: fix me 👇\n"],["g","    \"I'm ready to learn about traits!\""],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::intro;\n\n    #[test]\n    fn test_intro() {\n        assert_eq!(intro(), \"I'm ready to learn about traits!\");\n    }\n}\n"]]}]},{"t":"28. Defining and Implementing Traits | ট্রেইট সংজ্ঞায়িত ও ইমপ্লিমেন্ট করা","b":[["p","Path: 04_traits/01_trait    |    Page Reference: 69"],["p","Define and implement a trait."],["p","A trait defines a set of methods that a type must provide. It is Rust's mechanism for polymorphism."],["p","Open exercises/04_traits/01_trait/src/lib.rs. Your tasks:"],["p","1. Define a trait (the exact name and methods will be specified in the file/tests)."],["p","2. Implement the trait for at least one concrete type."],["p","3. Write a generic function that accepts any type implementing the trait:"],["code","fn do_something<T: MyTrait>(value: T) { ... }\n// or with where clause:\nfn do_something<T>(value: T) where T: MyTrait { ... }"],["p","Trait syntax:"],["code","trait Greet {\n    fn hello(&self) -> String;\n    fn goodbye(&self) -> String {  // default implementation\n        String::from(\"Bye!\")\n    }\n}\nimpl Greet for Ticket {\n    fn hello(&self) -> String {\n        format!(\"Hello from ticket: {}\", self.title)\n    }\n}"],["p","Traits are central to Rust — the standard library uses them for Display, Debug, Iterator, and many more."]],"n":28,"en":["Define a custom trait and implement it for one or more types. A trait is declared with the `trait` keyword followed by the trait name and a block containing method signatures. An implementation is provided using `impl TraitName for TypeName { ... }`. Practice defining a `Greet` trait (or similar) with a method `greeting(&self) -> String`, and implementing it for a custom struct. Learn the difference between a required method (no default body) and a provided method (default implementation that can be overridden). Trait methods can be called just like regular methods."],"bt":["একটি কাস্টম trait সংজ্ঞায়িত করো এবং এক বা একাধিক টাইপের জন্য ইমপ্লিমেন্ট করো। `trait` কীওয়ার্ড দিয়ে trait ঘোষণা করো। একটি `Greet` trait (বা অনুরূপ) সংজ্ঞায়িত করো এবং একটি কাস্টম struct-এর জন্য ইমপ্লিমেন্ট করো।"],"loc":"exercises/04_traits/01_trait","f":[{"n":"src/lib.rs","s":[["c","// Define a trait named `IsEven` that has a method `is_even` that returns a `true` if `self` is\n// even, otherwise `false`.\n//\n// Then implement the trait for `u32` and `i32`.\n"],["g","pub trait IsEven {\n    fn is_even(&self) -> bool;\n}\n\nimpl IsEven for u32 {\n    fn is_even(&self) -> bool {\n        self % 2 == 0\n    }\n}\n\nimpl IsEven for i32 {\n    fn is_even(&self) -> bool {\n        self % 2 == 0\n    }\n}"],["c","\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_u32_is_even() {\n        assert!(42u32.is_even());\n        assert!(!43u32.is_even());\n    }\n\n    #[test]\n    fn test_i32_is_even() {\n        assert!(42i32.is_even());\n        assert!(!43i32.is_even());\n        assert!(0i32.is_even());\n        assert!(!(-1i32).is_even());\n    }\n}\n"]]}]},{"t":"29. The Orphan Rule | অরফান নিয়ম","b":[["p","Path: 04_traits/02_orphan_rule    |    Page Reference: 72"],["p","Understand the orphan rule — a restriction on trait implementations."],["p","The orphan rule states: you can implement a trait for a type only if either the trait OR the type is defined in your crate. You cannot implement a foreign trait for a foreign type."],["p","Open exercises/04_traits/02_orphan_rule/src/lib.rs. The exercise will present a scenario that violates (or respects) the orphan rule."],["p","Examples:"],["li","OK: implement your own trait (MyTrait) for String (foreign type) ✓"],["li","OK: implement Display (foreign trait) for your Ticket (your type) ✓"],["li","NOT OK: implement Display (foreign) for String (foreign) ✗"],["p","Why the orphan rule exists: it prevents two crates from each providing conflicting implementations of the same trait for the same type."],["p","Your task: restructure or fix the code so it compiles while following the orphan rule. You may need to introduce a newtype wrapper (a tuple struct that wraps a foreign type) to work around the restriction."]],"n":29,"en":["Learn about Rust's orphan rule, which governs where trait implementations may be written. The rule states: you can implement a trait for a type only if either the trait or the type is defined in the current crate. You cannot implement a foreign trait for a foreign type (a combination of traits and types both defined in external crates). This rule prevents conflicting implementations across crates. Practice working within the orphan rule constraints and understand why it exists — to ensure global coherence of trait implementations."],"bt":["Rust-এর orphan rule সম্পর্কে জানো, যা নির্ধারণ করে trait implementation কোথায় লেখা যায়। নিয়ম: শুধুমাত্র তখনই একটি টাইপের জন্য trait ইমপ্লিমেন্ট করা যাবে যদি trait বা টাইপ বর্তমান crate-এ সংজ্ঞায়িত হয়।"],"loc":"exercises/04_traits/02_orphan_rule","f":[{"n":"src/lib.rs","s":[["c","// TODO: this is an example of an orphan rule violation.\n//  We're implementing a foreign trait (`PartialEq`, from `std`) on\n//  a foreign type (`u32`, from `std`).\n//  Look at the compiler error to get familiar with what it looks like.\n//  Then delete the code below and move on to the next exercise.\n"]]}]},{"t":"30. Operator Overloading | অপারেটর ওভারলোডিং","b":[["p","Path: 04_traits/03_operator_overloading    |    Page Reference: 74"],["p","Implement operator overloading for custom types using std::ops traits."],["p","In Rust, operators like +, -, *, ==, < are syntactic sugar for trait method calls. You can overload them for custom types by implementing the corresponding trait."],["p","Open exercises/04_traits/03_operator_overloading/src/lib.rs. Implement operator overloading as required by the tests."],["p","Common operator traits:"],["li","std::ops::Add — overloads the + operator (fn add(self, rhs: Rhs) -> Output)"],["li","std::ops::Sub — overloads the - operator"],["li","std::ops::Mul — overloads the * operator"],["li","std::ops::Neg — overloads the unary - operator"],["li","std::ops::Not — overloads the ! operator"],["li","std::cmp::PartialEq — overloads == and != (or use #[derive(PartialEq)])"],["li","std::cmp::PartialOrd — overloads <, >, <=, >="],["p","The tests will create instances of your type and use operators on them, verifying the results. Implement the traits that make the tests compile and pass."]],"n":30,"en":["Implement operator overloading in Rust using standard library traits. Rust's arithmetic and comparison operators correspond to traits in `std::ops` and `std::cmp`. For example, `+` is `std::ops::Add`, `-` is `std::ops::Sub`, `==` is `std::cmp::PartialEq`, `<` is `std::cmp::PartialOrd`. Implement the `Add` trait for a custom type (such as a 2D point or a vector) so that the `+` operator works on instances of that type. Note that `PartialEq` provides a default `ne` implementation; you only need to implement `eq`."],"bt":["Standard library trait ব্যবহার করে Rust-এ operator overloading ইমপ্লিমেন্ট করো। `+` হলো `std::ops::Add`, `-` হলো `std::ops::Sub`, `==` হলো `std::cmp::PartialEq`। একটি কাস্টম টাইপের জন্য `Add` trait ইমপ্লিমেন্ট করো।"],"loc":"exercises/04_traits/03_operator_overloading","f":[{"n":"src/lib.rs","s":[["c","use std::cmp::PartialEq;\n\nstruct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\n// TODO: Implement the `PartialEq` trait for `Ticket`.\n\n"],["g","impl PartialEq for Ticket {\n    fn eq(&self, other: &Self) -> bool {\n        self.title == other.title\n            && self.description == other.description\n            && self.status == other.status\n    }\n}"],["c","\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_partial_eq() {\n        let title = \"title\";\n        let description = \"description\";\n        let status = \"To-Do\";\n        let ticket1 = Ticket {\n            title: title.to_string(),\n            description: description.to_string(),\n            status: status.to_string(),\n        };\n        let ticket2 = Ticket {\n            title: title.to_string(),\n            description: description.to_string(),\n            status: status.to_string(),\n        };\n        assert!(ticket1 == ticket2);\n    }\n\n    #[test]\n    fn test_description_not_matching() {\n        let title = \"title\";\n        let status = \"To-Do\";\n        let ticket1 = Ticket {\n            title: title.to_string(),\n            description: \"description\".to_string(),\n            status: status.to_string(),\n        };\n        let ticket2 = Ticket {\n            title: title.to_string(),\n            description: \"description2\".to_string(),\n            status: status.to_string(),\n        };\n        assert!(ticket1 != ticket2);\n    }\n\n    #[test]\n    fn test_title_not_matching() {\n        let status = \"To-Do\";\n        let description = \"description\";\n        let ticket1 = Ticket {\n            title: \"title\".to_string(),\n            description: description.to_string(),\n            status: status.to_string(),\n        };\n        let ticket2 = Ticket {\n            title: \"title2\".to_string(),\n            description: description.to_string(),\n            status: status.to_string(),\n        };\n        assert!(ticket1 != ticket2);\n    }\n\n    #[test]\n    fn test_status_not_matching() {\n        let title = \"title\";\n        let description = \"description\";\n        let ticket1 = Ticket {\n            title: title.to_string(),\n            description: description.to_string(),\n            status: \"status\".to_string(),\n        };\n        let ticket2 = Ticket {\n            title: title.to_string(),\n            description: description.to_string(),\n            status: \"status2\".to_string(),\n        };\n        assert!(ticket1 != ticket2);\n    }\n}\n"]]}]},{"t":"31. Derive Macros | ডেরাইভ ম্যাক্রো","b":[["p","Path: 04_traits/04_derive    |    Page Reference: 77"],["p","Use derive macros to automatically generate trait implementations."],["p","Rust provides #[derive(...)] attribute macros that automatically generate boilerplate trait implementations for structs and enums."],["p","Open exercises/04_traits/04_derive/src/lib.rs. Your tasks:"],["p","1. Add appropriate derive attributes to the Ticket struct or enum."],["p","2. Understand which traits can be derived and what they provide."],["p","Commonly derived traits:"],["li","#[derive(Debug)] — enables {:?} and {:#?} formatting for debugging."],["li","#[derive(Clone)] — adds a .clone() method to duplicate the value."],["li","#[derive(Copy)] — makes the type Copy (implicitly copied instead of moved). Requires Clone."],["li","#[derive(PartialEq, Eq)] — enables == and != comparison."],["li","#[derive(PartialOrd, Ord)] — enables <, >, <=, >= comparison."],["li","#[derive(Hash)] — enables using the type as a HashMap key."],["li","#[derive(Default)] — adds a Default::default() constructor."],["p","The tests will use formatting, comparison, or cloning on your type — add the required derives to make them compile."]],"n":31,"en":["Use derive macros to automatically generate trait implementations. The `#[derive(...)]` attribute instructs the Rust compiler to automatically generate an implementation of the listed traits. Commonly derived traits include: `Debug` (enables `{:?}` formatting), `PartialEq` / `Eq` (equality comparisons), `Clone` (cloning a value), `Copy` (stack-copyable values), `Hash` (hashing for HashMap keys), and `PartialOrd` / `Ord` (ordering). Annotate your `Ticket` struct with the appropriate derive attributes and verify that the auto-generated implementations work correctly."],"bt":["Trait implementation স্বয়ংক্রিয়ভাবে তৈরি করতে derive macro ব্যবহার করো। `#[derive(...)]` অ্যাট্রিবিউট listed trait-এর implementation generate করে। `Debug`, `PartialEq`, `Eq`, `Clone`, `Copy`, `Hash`, `PartialOrd`, `Ord` সাধারণভাবে derive করা হয়।"],"loc":"exercises/04_traits/04_derive","f":[{"n":"src/lib.rs","s":[["c","// TODO: A (derivable) trait implementation is missing for this exercise to compile successfully.\n//   Fix it!\n//\n// # `Debug` primer\n//\n// `Debug` returns a representation of a Rust type that's suitable for debugging (hence the name).\n// `assert_eq!` requires `Ticket` to implement `Debug` because, when the assertion fails, it tries to\n// print both sides of the comparison to the terminal.\n// If the compared type doesn't implement `Debug`, it doesn't know how to represent them!\n\n"],["g","#[derive(Debug, PartialEq)]"],["c","struct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_partial_eq() {\n        let title = \"title\";\n        let description = \"description\";\n        let status = \"To-Do\";\n        let ticket1 = Ticket {\n            title: title.to_string(),\n            description: description.to_string(),\n            status: status.to_string(),\n        };\n        let ticket2 = Ticket {\n            title: title.to_string(),\n            description: description.to_string(),\n            status: status.to_string(),\n        };\n        assert_eq!(ticket1, ticket2);\n    }\n\n    #[test]\n    fn test_description_not_matching() {\n        let title = \"title\";\n        let status = \"To-Do\";\n        let ticket1 = Ticket {\n            title: title.to_string(),\n            description: \"description\".to_string(),\n            status: status.to_string(),\n        };\n        let ticket2 = Ticket {\n            title: title.to_string(),\n            description: \"description2\".to_string(),\n            status: status.to_string(),\n        };\n        assert_ne!(ticket1, ticket2);\n    }\n\n    #[test]\n    fn test_title_not_matching() {\n        let status = \"To-Do\";\n        let description = \"description\";\n        let ticket1 = Ticket {\n            title: \"title\".to_string(),\n            description: description.to_string(),\n            status: status.to_string(),\n        };\n        let ticket2 = Ticket {\n            title: \"title2\".to_string(),\n            description: description.to_string(),\n            status: status.to_string(),\n        };\n        assert_ne!(ticket1, ticket2);\n    }\n\n    #[test]\n    fn test_status_not_matching() {\n        let title = \"title\";\n        let description = \"description\";\n        let ticket1 = Ticket {\n            title: title.to_string(),\n            description: description.to_string(),\n            status: \"status\".to_string(),\n        };\n        let ticket2 = Ticket {\n            title: title.to_string(),\n            description: description.to_string(),\n            status: \"status2\".to_string(),\n        };\n        assert_ne!(ticket1, ticket2);\n    }\n}\n"]]}]},{"t":"32. Trait Bounds | ট্রেইট বাউন্ড","b":[["p","Path: 04_traits/05_trait_bounds    |    Page Reference: 81"],["p","Write generic functions and structs with trait bounds."],["p","A trait bound constrains a generic type parameter to only accept types that implement a specific trait."],["p","Open exercises/04_traits/05_trait_bounds/src/lib.rs. Your tasks:"],["p","1. Write a generic function with one or more trait bounds."],["p","2. Use the + syntax to require multiple traits: fn f<T: Debug + Clone>(x: T) { ... }"],["p","3. Consider using where clauses for complex bounds:"],["code","fn f<T>(x: T) where T: Debug + Clone { ... }"],["p","Common patterns:"],["li","T: Display — the type can be printed with {}"],["li","T: Debug — the type can be printed with {:?}"],["li","T: Clone — the type can be duplicated with .clone()"],["li","T: PartialOrd — the type can be compared with < and >"],["li","T: Into<String> — the type can be converted into a String"],["p","The tests will call your generic functions with various concrete types. The function must accept all types that satisfy the bounds and reject (at compile time) those that do not."]],"n":32,"en":["Write generic functions with trait bounds to constrain the types they accept. A trait bound specifies that a type parameter must implement a given trait. Syntax: `fn my_func<T: TraitName>(value: T) { ... }` or using a `where` clause: `fn my_func<T>(value: T) where T: TraitName { ... }`. Multiple bounds can be combined with `+`. The function signature is a contract: the compiler verifies at the call site that the concrete type satisfies all bounds. Practice writing a generic print function that requires `Debug` or `Display`, and a generic max function requiring `PartialOrd`."],"bt":["Generic ফাংশনে trait bound ব্যবহার করো যাতে কোন টাইপ গ্রহণ করা হবে তা সীমাবদ্ধ করা যায়। Syntax: `fn my_func<T: TraitName>(value: T)` বা `where` clause ব্যবহার করো। একাধিক bound `+` দিয়ে মেলানো যায়।"],"loc":"exercises/04_traits/05_trait_bounds","f":[{"n":"src/lib.rs","s":[["c","// TODO: Add the necessary trait bounds to `min` so that it compiles successfully.\n//   Refer to the documentation of the `std::cmp` module for more information on the traits you might need.\n//\n// Note: there are different trait bounds that'll make the compiler happy, but they come with\n// different _semantics_. We'll cover those differences later in the course when we talk about ordered\n// collections (e.g. BTreeMap).\n\n/// Return the minimum of two values.\n"],["g","pub fn min<T: Ord>(left: T, right: T) -> T {\n    // `Ord` guarantees that the values can be compared.\n    // `PartialOrd` would also make the compiler happy, but it would have different semantics:\n    // it'd either return the minimum value or `right` if they can't be compared."],["c","    if left <= right {\n        left\n    } else {\n        right\n    }\n}\n"]]}]},{"t":"33. String Slices (&str) | স্ট্রিং স্লাইস (&str)","b":[["p","Path: 04_traits/06_str_slice    |    Page Reference: 84"],["p","Understand the str type and string slices (&str)."],["p","&str is a string slice — a reference to a sequence of UTF-8 bytes stored somewhere (in a binary, on the stack, or in heap memory owned by a String)."],["p","Open exercises/04_traits/06_str_slice/src/lib.rs. Your tasks:"],["p","1. Understand the difference between String (owned, heap-allocated) and &str (borrowed view)."],["p","2. Write functions that accept &str instead of String to be more flexible."],["p","3. Use the Deref coercion: a &String automatically coerces to &str."],["p","Key operations on &str:"],["li","s.len() — byte length (not character count for non-ASCII)"],["li","s.is_empty() — true if zero bytes"],["li","s.contains(\"needle\") — substring search"],["li","s.starts_with(\"prefix\"), s.ends_with(\"suffix\")"],["li","s.split_whitespace() — iterator over words"],["li","s.trim() — remove leading/trailing whitespace"],["li","&s[0..3] — slice a sub-range (must be on valid UTF-8 boundaries)"],["p","The general rule of thumb: prefer &str in function parameters; use String when you need ownership."]],"n":33,"en":["Understand the relationship between `String` and `&str`. `String` is an owned, heap-allocated string. `&str` is a borrowed string slice — a reference to a contiguous sequence of UTF-8 bytes somewhere in memory (heap, stack, or binary). Functions that only need to read a string should accept `&str` rather than `&String`, because `&String` automatically coerces to `&str` (via `Deref`) but not vice versa. Modify your getter methods to return `&str` instead of `&String` and update the function signatures for maximum flexibility."],"bt":["`String` এবং `&str`-এর মধ্যে সম্পর্ক বোঝো। `String` একটি owned, heap-allocated string। `&str` একটি borrowed string slice। শুধুমাত্র string read করতে হলে `&String`-এর পরিবর্তে `&str` গ্রহণ করো।"],"loc":"exercises/04_traits/06_str_slice","f":[{"n":"src/lib.rs","s":[["c","// TODO: Re-implement `Ticket`'s accessor methods. This time return a `&str` rather than a `&String`.\n\npub struct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\nimpl Ticket {\n    pub fn new(title: String, description: String, status: String) -> Ticket {\n        if title.is_empty() {\n            panic!(\"Title cannot be empty\");\n        }\n        if title.len() > 50 {\n            panic!(\"Title cannot be longer than 50 bytes\");\n        }\n        if description.is_empty() {\n            panic!(\"Description cannot be empty\");\n        }\n        if description.len() > 500 {\n            panic!(\"Description cannot be longer than 500 bytes\");\n        }\n        if status != \"To-Do\" && status != \"In Progress\" && status != \"Done\" {\n            panic!(\"Only `To-Do`, `In Progress`, and `Done` statuses are allowed\");\n        }\n\n        Ticket {\n            title,\n            description,\n            status,\n        }\n    }\n\n"],["g","    pub fn title(&self) -> &str {"],["c","        &self.title\n    }\n\n"],["g","    pub fn description(&self) -> &str {"],["c","        &self.description\n    }\n\n"],["g","    pub fn status(&self) -> &str {"],["c","        &self.status\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{valid_description, valid_title};\n    use std::any::{Any, TypeId};\n\n    #[test]\n    fn test_type() {\n        let ticket = Ticket::new(valid_title(), valid_description(), \"To-Do\".to_string());\n        // Some dark magic to verify that you used the expected return types\n        assert_eq!(TypeId::of::<str>(), ticket.title().type_id());\n        assert_eq!(TypeId::of::<str>(), ticket.description().type_id());\n        assert_eq!(TypeId::of::<str>(), ticket.status().type_id());\n    }\n}\n"]]}]},{"t":"34. The Deref Trait | ডেরেফ ট্রেইট","b":[["p","Path: 04_traits/07_deref    |    Page Reference: 86"],["p","Understand the Deref trait and deref coercion."],["p","The Deref trait allows a type to behave like a reference to another type. Deref coercion is an automatic conversion that Rust applies when types don't match but a Deref chain connects them."],["p","Open exercises/04_traits/07_deref/src/lib.rs. Explore and implement Deref."],["p","How deref coercion works:"],["li","String implements Deref<Target = str>, so &String coerces to &str automatically."],["li","Vec<T> implements Deref<Target = [T]>, so &Vec<T> coerces to &[T]."],["li","Box<T> implements Deref<Target = T>, so &Box<T> coerces to &T."],["p","The coercion chain can be applied multiple times: &Box<String> → &String → &str."],["p","Implementing Deref for a custom type:"],["code","use std::ops::Deref;\nimpl Deref for MyBox<T> {\n    type Target = T;\n    fn deref(&self) -> &T { &self.0 }\n}"],["p","Your task: implement the necessary Deref impls and fix the code so the tests compile and pass."]],"n":34,"en":["Learn about the `Deref` trait and Rust's automatic deref coercion. `Deref` allows a type to behave like a reference to another type. `String` implements `Deref<Target = str>`, which means `&String` automatically coerces to `&str` in many contexts. Similarly, `Vec<T>` implements `Deref<Target = [T]>`, so `&Vec<T>` coerces to `&[T]`. Deref coercions are applied automatically by the compiler when passing arguments to functions, making code more ergonomic. Understand when deref coercion applies and be aware it can sometimes make code harder to understand."],"bt":["`Deref` trait এবং Rust-এর স্বয়ংক্রিয় deref coercion সম্পর্কে জানো। `String` `Deref<Target = str>` ইমপ্লিমেন্ট করে, তাই `&String` অনেক context-এ স্বয়ংক্রিয়ভাবে `&str`-এ coerce হয়।"],"loc":"exercises/04_traits/07_deref","f":[{"n":"src/lib.rs","s":[["c","// TODO: whenever `title` and `description` are returned via their accessor methods, they\n//   should be normalized—i.e. leading and trailing whitespace should be removed.\n//   There is a method in Rust's standard library that can help with this, but you won't\n//   find it in the documentation for `String`.\n//   Can you figure out where it is defined and how to use it?\n\npub struct Ticket {\n    title: String,\n    description: String,\n    status: String,\n}\n\nimpl Ticket {\n    pub fn title(&self) -> &str {\n"],["g","        self.title.trim()"],["c","    }\n\n    pub fn description(&self) -> &str {\n"],["g","        self.description.trim()"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_normalization() {\n        let ticket = Ticket {\n            title: \"   A title \".to_string(),\n            description: \" A description   \".to_string(),\n            status: \"To-Do\".to_string(),\n        };\n\n        assert_eq!(\"A title\", ticket.title());\n        assert_eq!(\"A description\", ticket.description());\n    }\n}\n"]]}]},{"t":"35. The Sized Trait | সাইজড ট্রেইট","b":[["p","Path: 04_traits/08_sized    |    Page Reference: 88"],["p","Understand the Sized trait and its implications for generics."],["p","Sized is a marker trait automatically implemented for all types whose size is known at compile time. Almost every type in Rust is Sized."],["p","Open exercises/04_traits/08_sized/src/lib.rs. This exercise deals with types that are NOT Sized:"],["li","str — a dynamically-sized string slice (unknown length at compile time)"],["li","[T] — a dynamically-sized slice"],["li","dyn Trait — a trait object with dynamic dispatch"],["p","Key concepts:"],["li","All generic type parameters have an implicit Sized bound: fn f<T>(x: T) is equivalent to fn f<T: Sized>(x: T)."],["li","To allow unsized types, use the special ?Sized bound: fn f<T: ?Sized>(x: &T) { ... }"],["li","Unsized types can only be used behind a reference (&T, &mut T, Box<T>)."],["p","Your task: fix the generic functions or struct definitions that currently fail to compile because of Sized-related issues. You will likely need to add ?Sized bounds or change function parameters to use references."]],"n":35,"en":["Explore the `Sized` marker trait and dynamically sized types (DSTs). `Sized` is automatically implemented for all types whose size is known at compile time. Most types are `Sized`. Types like `str` and `[T]` are not `Sized` — they are dynamically sized types (DSTs). DSTs can only be used behind a reference or pointer (`&str`, `Box<str>`, `&[T]`, etc.). The `?Sized` bound is used to relax the default `Sized` requirement on a generic type parameter, allowing DSTs to be passed. Understand why this matters for generic programming."],"bt":["`Sized` marker trait এবং dynamically sized types (DSTs) অন্বেষণ করো। `Sized` কম্পাইল সময়ে জানা আকারের সমস্ত টাইপের জন্য স্বয়ংক্রিয়ভাবে ইমপ্লিমেন্ট হয়। `str` এবং `[T]` DST, শুধুমাত্র reference বা pointer-এর পিছনে ব্যবহার করা যায়।"],"loc":"exercises/04_traits/08_sized","f":[{"n":"src/lib.rs","s":[["c","pub fn example() {\n    // Trying to get the size of a str (or any other DST)\n    // via `std::mem::size_of` will result in a compile-time error.\n    //\n    // TODO: Comment out the following line and move on to the next exercise.\n"],["g","    // std::mem::size_of::<str>();"],["c","}\n"]]}]},{"t":"36. From and Into | From এবং Into","b":[["p","Path: 04_traits/09_from    |    Page Reference: 91"],["p","Implement the From trait for type conversions."],["p","The From<T> trait defines how to construct Self from a value of type T. Implementing From automatically gives you Into for free (due to a blanket impl in the standard library)."],["p","Open exercises/04_traits/09_from/src/lib.rs. Your tasks:"],["p","1. Implement From<SomeType> for Ticket (or the type specified in the exercise)."],["p","2. Use the conversion via Ticket::from(value) or value.into()."],["p","Standard library examples:"],["li","String::from(\"hello\") — converts &str to String"],["li","i64::from(42i32) — widens i32 to i64"],["p","Implementing From for Ticket to accept structured input:"],["code","impl From<(String, String, String)> for Ticket {\n    fn from((title, description, status): (String, String, String)) -> Self {\n        Ticket::new(title, description, status)\n    }\n}"],["p","After implementing From<T> for Ticket, you get Into<Ticket> for T for free:"],["code","let t: Ticket = (\"Title\".into(), \"Desc\".into(), \"To-Do\".into()).into();"]],"n":36,"en":["Use the `From` and `Into` conversion traits for infallible type conversions. `From<T>` defines how to create `Self` from `T`. Once you implement `From<T>` for a type, `Into<Self> for T` is automatically derived (they are dual traits). The `.into()` method works when the compiler can infer the target type. Use `From` to enable ergonomic conversions: `String::from(\"hello\")`, `u64::from(42u32)`. Implement `From<&str>` for your `Ticket` type or a related type, and understand why `From` is preferred over custom conversion functions."],"bt":["Infallible type conversion-এর জন্য `From` এবং `Into` conversion trait ব্যবহার করো। `From<T>` সংজ্ঞায়িত করে কীভাবে `T` থেকে `Self` তৈরি করা যায়। `From<T>` ইমপ্লিমেন্ট করলে `Into<Self> for T` স্বয়ংক্রিয়ভাবে derived হয়।"],"loc":"exercises/04_traits/09_from","f":[{"n":"src/lib.rs","s":[["c","// TODO: Implement the `From` trait for the `WrappingU32` type to make `example` compile.\n\npub struct WrappingU32 {\n    value: u32,\n}\n\n"],["g","impl From<u32> for WrappingU32 {\n    fn from(value: u32) -> Self {\n        WrappingU32 { value }\n    }\n}"],["c","fn example() {\n    let wrapping: WrappingU32 = 42.into();\n    let wrapping = WrappingU32::from(42);\n}\n"]]}]},{"t":"37. Generics vs. Associated Types | জেনেরিক্স বনাম অ্যাসোসিয়েটেড টাইপ","b":[["p","Path: 04_traits/10_assoc_vs_generic    |    Page Reference: 94"],["p","Understand the difference between associated types and generic type parameters in traits."],["p","Both associated types and generics allow a trait to be parameterised by a type, but they are used differently."],["p","Open exercises/04_traits/10_assoc_vs_generic/src/lib.rs."],["p","Generic type parameter on a trait:"],["code","trait Converter<T> {\n    fn convert(&self) -> T;\n}\n// A type can implement Converter<String> AND Converter<i32>"],["p","Associated type on a trait:"],["code","trait Converter {\n    type Output;\n    fn convert(&self) -> Self::Output;\n}\n// A type can only implement Converter once (one Output type)"],["p","When to use each:"],["li","Use an associated type when there is a single \"natural\" output type for the implementation (e.g., Iterator::Item)."],["li","Use a generic parameter when you want to allow multiple implementations for different types."],["p","The exercise will demonstrate a scenario where using the wrong approach causes compilation issues. Fix or complete the implementation so the tests pass."]],"n":37,"en":["Understand when to use associated types versus generic type parameters in traits. An associated type (`type Output;` inside a trait) binds a concrete type to each implementation, so a given type can only implement the trait once. A generic parameter (`trait Add<Rhs>`) allows multiple implementations with different type arguments. Use associated types when the relationship is one-to-one (e.g. the output of adding two values of the same type). Use generic parameters when a type should be able to interoperate with multiple other types (e.g. adding a `Point` to a `Vector`)."],"bt":["Trait-এ associated type বনাম generic type parameter কখন ব্যবহার করবে তা বোঝো। Associated type (`type Output;`) প্রতিটি implementation-এ একটি concrete type bind করে। Generic parameter একই trait-এর বিভিন্ন type argument-এর সাথে একাধিক implementation-এর সুযোগ দেয়।"],"loc":"exercises/04_traits/10_assoc_vs_generic","f":[{"n":"src/lib.rs","s":[["c","// TODO: Define a new trait, `Power`, that has a method `power` that raises `self`\n//  to the power of `n`.\n//  The trait definition and its implementations should be enough to get\n//  the tests to compile and pass.\n//\n// Recommendation: you may be tempted to write a generic implementation to handle\n// all cases at once. However, this is fairly complicated and requires the use of\n// additional crates (i.e. `num-traits`).\n// Even then, it might be preferable to use a simple macro instead to avoid\n// the complexity of a highly generic implementation. Check out the\n// \"Little book of Rust macros\" (https://veykril.github.io/tlborm/) if you're\n// interested in learning more about it.\n// You don't have to though: it's perfectly okay to write three separate\n// implementations manually. Venture further only if you're curious.\n"],["g","\npub trait Power<Exponent = Self> {\n    type Output;\n\n    fn power(&self, n: Exponent) -> Self::Output;\n}\n\nimpl Power<u16> for u32 {\n    type Output = u32;\n\n    fn power(&self, n: u16) -> Self::Output {\n        self.pow(n.into())\n    }\n}\n\nimpl Power<&u32> for u32 {\n    type Output = u32;\n\n    fn power(&self, n: &u32) -> Self::Output {\n        self.power(*n)\n    }\n}\n\nimpl Power<u32> for u32 {\n    type Output = u32;\n\n    fn power(&self, n: u32) -> Self::Output {\n        self.pow(n)\n    }\n}"],["c","\n#[cfg(test)]\nmod tests {\n    use super::Power;\n\n    #[test]\n    fn test_power_u16() {\n        let x: u32 = 2_u32.power(3u16);\n        assert_eq!(x, 8);\n    }\n\n    #[test]\n    fn test_power_u32() {\n        let x: u32 = 2_u32.power(3u32);\n        assert_eq!(x, 8);\n    }\n\n    #[test]\n    fn test_power_ref_u32() {\n        let x: u32 = 2_u32.power(&3u32);\n        assert_eq!(x, 8);\n    }\n}\n"]]}]},{"t":"38. The Clone Trait | ক্লোন ট্রেইট","b":[["p","Path: 04_traits/11_clone    |    Page Reference: 97"],["p","Understand and implement the Clone trait."],["p","Clone provides an explicit .clone() method to create a deep copy of a value. It is opt-in — you must implement it (or derive it) for your type."],["p","Open exercises/04_traits/11_clone/src/lib.rs. Your tasks:"],["p","1. Either derive Clone (#[derive(Clone)]) or implement it manually for a type."],["p","2. Use .clone() to duplicate values in the exercise function."],["p","Manual Clone implementation:"],["code","impl Clone for Ticket {\n    fn clone(&self) -> Self {\n        Ticket {\n            title: self.title.clone(),\n            description: self.description.clone(),\n            status: self.status.clone(),\n        }\n    }\n}"],["p","Important notes:"],["li","Deriving Clone requires all fields to also implement Clone."],["li","String, Vec<T>, and most standard library types implement Clone."],["li","Clone performs a deep copy (allocates new heap memory for String fields)."],["li","Clone and Copy differ: Copy is implicit and cheap (bitwise copy); Clone is explicit and potentially expensive."]],"n":38,"en":["Use the `Clone` trait to create explicit copies of values. Calling `.clone()` on a value produces a new value that is a deep copy of the original. Unlike `Copy`, cloning is an explicit, potentially expensive operation (it may allocate heap memory). You can derive `Clone` automatically if all fields of a struct implement `Clone`. Implement `Clone` manually for a type where the derived implementation would not be appropriate. Practice cloning `String` and custom types and understand the difference between a shallow copy (raw bit copy) and a deep copy (cloning heap data)."],"bt":["মানের স্পষ্ট কপি তৈরি করতে `Clone` trait ব্যবহার করো। `.clone()` কল করলে original-এর একটি deep copy তৈরি হয়। সব field `Clone` ইমপ্লিমেন্ট করলে `Clone` automatically derive করা যায়।"],"loc":"exercises/04_traits/11_clone","f":[{"n":"src/lib.rs","s":[["c","// TODO: add the necessary `Clone` implementations (and invocations)\n//  to get the code to compile.\n\npub fn summary(ticket: Ticket) -> (Ticket, Summary) {\n"],["g","    (ticket.clone(), ticket.summary())"],["c","}\n\n"],["g","#[derive(Clone)]"],["c","pub struct Ticket {\n    pub title: String,\n    pub description: String,\n    pub status: String,\n}\n\nimpl Ticket {\n    pub fn summary(self) -> Summary {\n        Summary {\n            title: self.title,\n            status: self.status,\n        }\n    }\n}\n\npub struct Summary {\n    pub title: String,\n    pub status: String,\n}\n"]]}]},{"t":"39. The Copy Trait | কপি ট্রেইট","b":[["p","Path: 04_traits/12_copy    |    Page Reference: 100"],["p","Understand the Copy trait and when to use it."],["p","Copy is a marker trait that tells Rust: \"values of this type should be copied (bitwise) whenever they would otherwise be moved.\" After a copy, both the original and the new binding are valid."],["p","Open exercises/04_traits/12_copy/src/lib.rs. Your tasks:"],["p","1. Derive or implement Copy for a type where appropriate."],["p","2. Understand why String cannot implement Copy (heap allocation means you cannot do a simple bitwise copy without double-free issues)."],["p","3. Verify that after \"copying\" a Copy type, the original is still usable."],["p","Types that are Copy:"],["li","All integer types (i32, u8, etc.), f32, f64, bool, char"],["li","Immutable references &T (but NOT &mut T)"],["li","Tuples and arrays of Copy types"],["li","Structs/enums with #[derive(Copy, Clone)] where all fields are Copy"],["p","Types that are NOT Copy:"],["li","String, Vec<T>, Box<T> — they own heap memory"],["li","Any type that implements Drop"],["p","Rule: if a type implements Drop, it cannot implement Copy."]],"n":39,"en":["Understand the `Copy` marker trait and how it affects move semantics. Types that implement `Copy` are copied implicitly (bitwise) when assigned or passed to a function, rather than moved. All primitive types (`u32`, `bool`, `f64`, etc.) are `Copy`. A type can be `Copy` only if all its fields are `Copy` and it does not implement `Drop`. Derive `Copy` (along with `Clone`, since `Copy` requires it) for your struct with `#[derive(Copy, Clone)]`. Verify that after `let b = a;`, the variable `a` is still usable because it was copied rather than moved."],"bt":["`Copy` marker trait এবং এটি move semantics-কে কীভাবে প্রভাবিত করে তা বোঝো। `Copy` ইমপ্লিমেন্ট করা টাইপগুলো assign বা ফাংশনে pass করার সময় implicitly (bitwise) copy হয়। `#[derive(Copy, Clone)]` দিয়ে তোমার struct-এ `Copy` যোগ করো।"],"loc":"exercises/04_traits/12_copy","f":[{"n":"src/lib.rs","s":[["c","// TODO: implement the necessary traits to make the test compile and pass.\n//  You *can't* modify the test.\n\n"],["g","#[derive(Debug, Clone, Copy, PartialEq)]"],["c","pub struct WrappingU32 {\n    value: u32,\n}\n\nimpl WrappingU32 {\n    pub fn new(value: u32) -> Self {\n        Self { value }\n"],["g","    }\n}\n\nimpl std::ops::Add for WrappingU32 {\n    type Output = Self;\n\n    fn add(self, rhs: Self) -> Self::Output {\n        Self::new(self.value.wrapping_add(rhs.value))"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_ops() {\n        let x = WrappingU32::new(42);\n        let y = WrappingU32::new(31);\n        let z = WrappingU32::new(u32::MAX);\n        assert_eq!(x + y + y + z, WrappingU32::new(103));\n    }\n}\n"]]}]},{"t":"40. The Drop Trait | ড্রপ ট্রেইট","b":[["p","Path: 04_traits/13_drop    |    Page Reference: 102"],["p","Implement the Drop trait for custom cleanup logic."],["p","The Drop trait lets you specify code that runs automatically when a value goes out of scope. It is the Rust equivalent of a destructor."],["p","Open exercises/04_traits/13_drop/src/lib.rs. Your tasks:"],["p","1. Implement the Drop trait for a custom struct."],["p","2. Understand the order of drops: fields are dropped in declaration order; local variables are dropped in reverse declaration order."],["p","3. Use std::mem::drop(value) if you need to explicitly drop a value before end of scope."],["p","Drop implementation:"],["code","impl Drop for MyResource {\n    fn drop(&mut self) {\n        println!(\"MyResource is being dropped!\");\n        // Release resources, close connections, etc.\n    }\n}"],["p","Remember:"],["li","You CANNOT directly call .drop() on a value (it's not a regular method call)."],["li","Use std::mem::drop(value) to trigger an early drop."],["li","Drop and Copy are mutually exclusive — a Copy type is never dropped."],["p","The tests likely use a shared counter (e.g., Rc<Cell<i32>>) to count how many times drop is invoked."]],"n":40,"en":["Implement the `Drop` trait to run custom cleanup logic when a value is destroyed. The `Drop` trait has a single method: `fn drop(&mut self)`. You cannot implement both `Copy` and `Drop` for the same type — they are mutually exclusive. Practice implementing `Drop` for a resource-managing type (e.g. a type that wraps a file handle or a network connection) to print a message or release a resource when the value is dropped. Understand that `drop` is called automatically by the runtime and cannot be called explicitly; use `std::mem::drop(value)` to force early dropping."],"bt":["একটি মান ধ্বংস হলে custom cleanup logic চালাতে `Drop` trait ইমপ্লিমেন্ট করো। `Drop` trait-এ একটিমাত্র মেথড আছে: `fn drop(&mut self)`। `Copy` এবং `Drop` একই টাইপের জন্য একসাথে ইমপ্লিমেন্ট করা যায় না।"],"loc":"exercises/04_traits/13_drop","f":[{"n":"src/lib.rs","s":[["c","// TODO: implement a so-called \"Drop bomb\": a type that panics when dropped\n//  unless a certain operation has been performed on it.\n//  You can see the expected API in the tests below.\n"],["g","pub struct DropBomb {\n    defused: bool,\n}\n\nimpl DropBomb {\n    pub fn new() -> Self {\n        DropBomb { defused: false }\n    }\n\n    pub fn defuse(&mut self) {\n        self.defused = true;\n    }\n}\n\nimpl Drop for DropBomb {\n    fn drop(&mut self) {\n        if !self.defused {\n            panic!(\"Boom!\");\n        }\n    }\n}"],["c","\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    #[should_panic]\n    fn test_drop_bomb() {\n        let bomb = DropBomb::new();\n        // The bomb should panic when dropped\n    }\n\n    #[test]\n    fn test_defused_drop_bomb() {\n        let mut bomb = DropBomb::new();\n        bomb.defuse();\n        // The bomb should not panic when dropped\n        // since it has been defused\n    }\n}\n"]]}]},{"t":"41. Traits — Wrapping Up | ট্রেইট — সমাপ্তি","b":[["p","Path: 04_traits/14_outro    |    Page Reference: 103"],["p","Consolidate everything you have learned in Chapter 4: Traits."],["p","This wrap-up exercise covers the full breadth of traits from this chapter. You will receive minimal guidance — the tests are your specification."],["p","Possible challenges in this exercise:"],["li","Defining a new trait with one or more methods and default implementations"],["li","Implementing standard library traits (Display, From, Clone, etc.) for Ticket"],["li","Writing a generic function constrained by trait bounds"],["li","Using derive macros to reduce boilerplate"],["li","Combining multiple trait bounds with + syntax"],["li","Distinguishing between associated types and generic parameters"],["li","Understanding the orphan rule to decide where implementations should live"],["p","Read the tests, understand what they require, and implement the necessary code. There should be no clippy warnings in your final solution."]],"n":41,"en":["A final consolidation exercise for the Traits chapter. You will receive minimal guidance and must apply all the trait concepts covered so far: defining and implementing traits, derive macros, operator overloading, trait bounds, `From`/`Into`, `Clone`/`Copy`/`Drop`, and the differences between associated types and generic parameters. The exercise tests your ability to reason about which trait to use in a given situation and to write clean, idiomatic Rust code that leverages the full power of the trait system."],"bt":["Traits অধ্যায়ের চূড়ান্ত consolidation exercise। ন্যূনতম guidance সহ এতক্ষণ কভার করা সমস্ত trait ধারণা প্রয়োগ করো: trait সংজ্ঞায়িত ও ইমপ্লিমেন্ট করা, derive macro, operator overloading, trait bound, `From`/`Into`, `Clone`/`Copy`/`Drop`।"],"loc":"exercises/04_traits/14_outro","f":[{"n":"src/lib.rs","s":[["c","// TODO: Define a new `SaturatingU16` type.\n//   It should hold a `u16` value.\n//   It should provide conversions from `u16`, `u8`, `&u16` and `&u8`.\n//   It should support addition with a right-hand side of type\n//   SaturatingU16, u16, &u16, and &SaturatingU16. Addition should saturate at the\n//   maximum value for `u16`.\n//   It should be possible to compare it with another `SaturatingU16` or a `u16`.\n//   It should be possible to print its debug representation.\n//\n// Tests are located in the `tests` folder—pay attention to the visibility of your types and methods.\n"],["g","\n#[derive(Debug, Clone, Copy, PartialEq)]\npub struct SaturatingU16 {\n    value: u16,\n}\n\nimpl From<u16> for SaturatingU16 {\n    fn from(value: u16) -> Self {\n        Self { value }\n    }\n}\n\nimpl From<u8> for SaturatingU16 {\n    fn from(value: u8) -> Self {\n        Self {\n            value: value.into(),\n        }\n    }\n}\n\nimpl From<&u16> for SaturatingU16 {\n    fn from(value: &u16) -> Self {\n        (*value).into()\n    }\n}\n\nimpl From<&u8> for SaturatingU16 {\n    fn from(value: &u8) -> Self {\n        (*value).into()\n    }\n}\n\nimpl std::ops::Add for SaturatingU16 {\n    type Output = SaturatingU16;\n\n    fn add(self, rhs: Self) -> Self::Output {\n        self + rhs.value\n    }\n}\n\nimpl std::ops::Add<&SaturatingU16> for SaturatingU16 {\n    type Output = SaturatingU16;\n\n    fn add(self, rhs: &SaturatingU16) -> Self::Output {\n        self + *rhs\n    }\n}\n\nimpl std::ops::Add<u16> for SaturatingU16 {\n    type Output = Self;\n\n    fn add(self, rhs: u16) -> Self::Output {\n        let sum = self.value.saturating_add(rhs);\n        Self {\n            value: sum,\n        }\n    }\n}\n\nimpl std::ops::Add<&u16> for SaturatingU16 {\n    type Output = SaturatingU16;\n\n    fn add(self, rhs: &u16) -> Self::Output {\n        self + *rhs\n    }\n}\n\nimpl PartialEq<u16> for SaturatingU16 {\n    fn eq(&self, other: &u16) -> bool {\n        self.value == *other\n    }\n}"]]}]}]},{"id":"c5","t":"Chapter 5: Modelling a Ticket (Part 2)","k":"chapter","ex":[{"t":"42. Ticket v2 Introduction | টিকেট v2 ভূমিকা","b":[["p","Path: 05_ticket_v2/00_intro    |    Page Reference: 104"],["p","Introduction to Chapter 5: upgrading the Ticket model."],["p","In Chapter 3 you modelled Ticket with String fields for everything, including status. This chapter improves the design using enums, error handling, and external crates."],["p","Open exercises/05_ticket_v2/00_intro/src/lib.rs and implement the introductory exercise."],["p","What is coming in this chapter:"],["li","Replace the status: String field with a proper enum (Status)"],["li","Use match expressions to handle all enum variants"],["li","Learn about enum variants that carry data"],["li","Use Option<T> to represent optional values instead of sentinel strings"],["li","Use Result<T, E> for fallible operations"],["li","Understand the ? operator for early-return error propagation"],["li","Integrate external crates from crates.io via Cargo.toml"],["p","The intro exercise should be straightforward — get the compile working and the initial test passing before the chapter proper begins."]],"n":42,"en":["Introduction to the second phase of ticket modelling. This chapter covers: enums for data modelling, the `match` expression, `Option<T>` for nullable values, `Result<T, E>` for fallible operations, error handling patterns, the `Error` trait, Rust's package/crate system, external dependencies with Cargo, the `thiserror` crate, `TryFrom`/`TryInto` traits, and error chaining with `Error::source`. By the end you will have a much more robust, type-safe ticket implementation."],"bt":["টিকেট মডেলিং-এর দ্বিতীয় পর্যায়ের ভূমিকা। এই অধ্যায়ে কভার: data modelling-এর জন্য enum, `match` expression, nullable মানের জন্য `Option<T>`, fallible operations-এর জন্য `Result<T, E>`, error handling pattern, `Error` trait, `thiserror` crate, `TryFrom`/`TryInto`।"],"loc":"exercises/05_ticket_v2/00_intro","f":[{"n":"src/lib.rs","s":[["c","fn intro() -> &'static str {\n    // TODO: fix me 👇\n"],["g","    \"I'm ready to refine the `Ticket` type!\""],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::intro;\n\n    #[test]\n    fn test_intro() {\n        assert_eq!(intro(), \"I'm ready to refine the `Ticket` type!\");\n    }\n}\n"]]}]},{"t":"43. Enumerations | এনুমেরেশন","b":[["p","Path: 05_ticket_v2/01_enum    |    Page Reference: 105"],["p","Replace the String status field with a proper enum."],["p","An enum in Rust is a type that can be one of several variants. Unlike a plain string, an enum variant is checked at compile time — you cannot accidentally pass \"Funnny\" as a status."],["p","Open exercises/05_ticket_v2/01_enum/src/lib.rs. Your tasks:"],["p","1. Define a Status enum with appropriate variants:"],["code","enum Status { ToDo, InProgress, Done }"],["p","2. Change the Ticket.status field from String to Status."],["p","3. Update the constructor and setters accordingly."],["p","4. Remove the string-comparison validation for status (the compiler enforces valid values now)."],["p","Enum syntax:"],["code","enum Direction { North, South, East, West }\nlet d = Direction::North;"],["p","Enums can also carry data (covered in Exercise 45). For now, use simple unit variants."],["p","#[derive(Debug, PartialEq)] on the enum will help with testing. Update all places that previously compared status as a string."]],"n":43,"en":["Define an enum to model the `Status` field of a ticket. An `enum` (enumeration) defines a type that can be one of several named variants. Replace the `String` status field with a proper `Status` enum that has variants `ToDo`, `InProgress`, and `Done`. Using an enum instead of a raw string prevents invalid states (you can no longer accidentally set the status to \"Funny\"). Update `Ticket::new` and other related code to work with `Status` values. Remember that `enum` creates a new type, just like `struct`."],"bt":["Ticket-এর `Status` field মডেল করতে enum সংজ্ঞায়িত করো। `enum` একটি টাইপ সংজ্ঞায়িত করে যা বেশ কয়েকটি named variant-এর একটি হতে পারে। `ToDo`, `InProgress`, এবং `Done` variant সহ একটি `Status` enum তৈরি করো।"],"loc":"exercises/05_ticket_v2/01_enum","f":[{"n":"src/lib.rs","s":[["c","// TODO: use `Status` as type for `Ticket::status`\n//   Adjust the signature and implementation of all other methods as necessary.\n\n#[derive(Debug, PartialEq)]\n// `derive`s are recursive: it can only derive `PartialEq` if all fields also implement `PartialEq`.\n// Same holds for `Debug`. Do what you must with `Status` to make this work.\nstruct Ticket {\n    title: String,\n    description: String,\n"],["g","    status: Status,"],["c","}\n\n"],["g","#[derive(Debug, PartialEq, Copy, Clone)]"],["c","enum Status {\n"],["g","    ToDo,\n    InProgress,\n    Done,"],["c","}\n\nimpl Ticket {\n"],["g","    pub fn new(title: String, description: String, status: Status) -> Ticket {"],["c","        if title.is_empty() {\n            panic!(\"Title cannot be empty\");\n        }\n        if title.len() > 50 {\n            panic!(\"Title cannot be longer than 50 bytes\");\n        }\n        if description.is_empty() {\n            panic!(\"Description cannot be empty\");\n        }\n        if description.len() > 500 {\n            panic!(\"Description cannot be longer than 500 bytes\");\n"],["c","        }\n\n        Ticket {\n            title,\n            description,\n            status,\n        }\n    }\n\n    pub fn title(&self) -> &String {\n        &self.title\n    }\n\n    pub fn description(&self) -> &String {\n        &self.description\n    }\n\n"],["g","    pub fn status(&self) -> &Status {"],["c","        &self.status\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{valid_description, valid_title};\n\n    #[test]\n    fn test_partial_eq() {\n        let title = valid_title();\n        let description = valid_description();\n        let ticket1 = Ticket {\n            title: title.clone(),\n            description: description.clone(),\n            status: Status::ToDo,\n        };\n        let ticket2 = Ticket {\n            title: title.clone(),\n            description: description.clone(),\n            status: Status::ToDo,\n        };\n        assert_eq!(ticket1, ticket2);\n    }\n\n    #[test]\n    fn test_description_not_matching() {\n        let title = valid_title();\n        let status = Status::ToDo;\n        let ticket1 = Ticket {\n            title: title.clone(),\n            description: \"description\".to_string(),\n            status,\n        };\n        let ticket2 = Ticket {\n            title: title.clone(),\n            description: \"description2\".to_string(),\n            status,\n        };\n        assert_ne!(ticket1, ticket2);\n    }\n\n    #[test]\n    fn test_title_not_matching() {\n        let description = valid_description();\n        let status = Status::InProgress;\n        let ticket1 = Ticket {\n            title: \"title\".to_string(),\n            description: description.clone(),\n            status,\n        };\n        let ticket2 = Ticket {\n            title: \"title2\".to_string(),\n            description: description.clone(),\n            status,\n        };\n        assert_ne!(ticket1, ticket2);\n    }\n\n    #[test]\n    fn test_status_not_matching() {\n        let title = valid_title();\n        let description = valid_description();\n        let ticket1 = Ticket {\n            title: title.clone(),\n            description: description.clone(),\n            status: Status::InProgress,\n        };\n        let ticket2 = Ticket {\n            title: title.clone(),\n            description: description.clone(),\n            status: Status::Done,\n        };\n        assert_ne!(ticket1, ticket2);\n    }\n}\n"]]}]},{"t":"44. Pattern Matching with match | match দিয়ে প্যাটার্ন ম্যাচিং","b":[["p","Path: 05_ticket_v2/02_match    |    Page Reference: 107"],["p","Use match expressions to handle all enum variants exhaustively."],["p","The match expression is Rust's powerful pattern-matching construct. It forces you to handle every possible case — the compiler rejects non-exhaustive matches."],["p","Open exercises/05_ticket_v2/02_match/src/lib.rs. Use match to implement the required function."],["p","Match syntax:"],["code","match ticket.status {\n    Status::ToDo    => println!(\"Not started\"),\n    Status::InProgress => println!(\"In progress\"),\n    Status::Done    => println!(\"Completed\"),\n}"],["p","Key features:"],["li","Exhaustive: all variants must be handled (or use _ as a catch-all)."],["li","Each arm can be an expression that returns a value."],["li","Guards: add extra conditions with if: Status::InProgress if is_urgent => ..."],["li","Binding: capture the variant's data into a variable."],["li","match is an expression and can be used on the right side of let."],["p","The tests will call your function with various Status values and verify the correct output for each variant."]],"n":44,"en":["Use the `match` expression to exhaustively handle all variants of an enum. `match` is Rust's most powerful control-flow construct. It compares a value against a series of patterns and executes the code for the matching arm. The compiler enforces exhaustiveness: you must handle every possible variant or include a catch-all `_` arm. Practice using `match` on your `Status` enum to produce different output for each variant. `match` can also destructure enum variants that carry data, bind names to the extracted values, and use guard expressions."],"bt":["`match` expression ব্যবহার করে enum-এর সব variant exhaustively সামলাও। `match` হলো Rust-এর সবচেয়ে শক্তিশালী control-flow construct। Compiler exhaustiveness enforce করে। তোমার `Status` enum-এ `match` ব্যবহার করো।"],"loc":"exercises/05_ticket_v2/02_match","f":[{"n":"src/lib.rs","s":[["c","enum Shape {\n    Circle,\n    Square,\n    Rectangle,\n    Triangle,\n    Pentagon,\n}\n\nimpl Shape {\n    // TODO: Implement the `n_sides` method using a `match`.\n    pub fn n_sides(&self) -> u8 {\n"],["g","        match self {\n            Shape::Circle => 0,\n            Shape::Square | Shape::Rectangle => 4,\n            Shape::Triangle => 3,\n            Shape::Pentagon => 5,\n        }"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_circle() {\n        assert_eq!(Shape::Circle.n_sides(), 0);\n    }\n\n    #[test]\n    fn test_square() {\n        assert_eq!(Shape::Square.n_sides(), 4);\n    }\n\n    #[test]\n    fn test_rectangle() {\n        assert_eq!(Shape::Rectangle.n_sides(), 4);\n    }\n\n    #[test]\n    fn test_triangle() {\n        assert_eq!(Shape::Triangle.n_sides(), 3);\n    }\n\n    #[test]\n    fn test_pentagon() {\n        assert_eq!(Shape::Pentagon.n_sides(), 5);\n    }\n}\n"]]}]},{"t":"45. Enum Variants with Data | ডেটা সহ Enum Variant","b":[["p","Path: 05_ticket_v2/03_variants_with_data    |    Page Reference: 109"],["p","Upgrade enum variants to carry associated data."],["p","Rust enums can hold data inside their variants. This makes them more expressive than simple C-style enums."],["p","Open exercises/05_ticket_v2/03_variants_with_data/src/lib.rs. Modify or create an enum where at least one variant holds data."],["p","Variants with data syntax:"],["code","enum Message {\n    Quit,                         // unit variant (no data)\n    Move { x: i32, y: i32 },     // struct-like variant\n    Write(String),                // tuple-like variant (one field)\n    Color(u8, u8, u8),            // tuple-like variant (three fields)\n}"],["p","Accessing the data with match:"],["code","match msg {\n    Message::Move { x, y } => println!(\"Move to ({x}, {y})\"),\n    Message::Write(text)   => println!(\"Write: {text}\"),\n    Message::Color(r, g, b) => println!(\"Color: #{r:02x}{g:02x}{b:02x}\"),\n    Message::Quit           => println!(\"Quit\"),\n}"],["p","Apply this to the Ticket domain: perhaps the InProgress variant should carry the assignee name, or the Done variant should carry the resolution timestamp."]],"n":45,"en":["Extend your enum so that variants can carry data. Unlike simple C-style enums, Rust enum variants can hold fields — they can be tuple-like (unnamed fields) or struct-like (named fields). For example, `Status::InProgress { assigned_to: String }` carries the name of the person the ticket is assigned to. Update the `Status` enum and all related `match` expressions to handle the new data-carrying variant. Use destructuring patterns in `match` arms to extract the data from inside a variant."],"bt":["Variant-এ ডেটা বহন করতে পারে এমনভাবে enum extend করো। Rust enum variant-এ field থাকতে পারে — tuple-like (unnamed field) বা struct-like (named field)। উদাহরণ: `Status::InProgress { assigned_to: String }`।"],"loc":"exercises/05_ticket_v2/03_variants_with_data","f":[{"n":"src/lib.rs","s":[["c","// TODO: Implement `Ticket::assigned_to`.\n//  Return the name of the person assigned to the ticket, if the ticket is in progress.\n//  Panic otherwise.\n\n#[derive(Debug, PartialEq)]\nstruct Ticket {\n    title: String,\n    description: String,\n    status: Status,\n}\n\n#[derive(Debug, PartialEq)]\nenum Status {\n    ToDo,\n    InProgress { assigned_to: String },\n    Done,\n}\n\nimpl Ticket {\n    pub fn new(title: String, description: String, status: Status) -> Ticket {\n        if title.is_empty() {\n            panic!(\"Title cannot be empty\");\n        }\n        if title.len() > 50 {\n            panic!(\"Title cannot be longer than 50 bytes\");\n        }\n        if description.is_empty() {\n            panic!(\"Description cannot be empty\");\n        }\n        if description.len() > 500 {\n            panic!(\"Description cannot be longer than 500 bytes\");\n        }\n\n        Ticket {\n            title,\n            description,\n            status,\n        }\n    }\n    pub fn assigned_to(&self) -> &str {\n"],["g","        match &self.status {\n            Status::InProgress { assigned_to } => assigned_to,\n            _ => panic!(\"Only `In-Progress` tickets can be assigned to someone\"),\n        }"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use common::{valid_description, valid_title};\n\n    #[test]\n    #[should_panic(expected = \"Only `In-Progress` tickets can be assigned to someone\")]\n    fn test_todo() {\n        let ticket = Ticket::new(valid_title(), valid_description(), Status::ToDo);\n        ticket.assigned_to();\n    }\n\n    #[test]\n    #[should_panic(expected = \"Only `In-Progress` tickets can be assigned to someone\")]\n    fn test_done() {\n        let ticket = Ticket::new(valid_title(), valid_description(), Status::Done);\n        ticket.assigned_to();\n    }\n\n    #[test]\n    fn test_in_progress() {\n        let ticket = Ticket::new(\n            valid_title(),\n            valid_description(),\n            Status::InProgress {\n                assigned_to: \"Alice\".to_string(),\n            },\n        );\n        assert_eq!(ticket.assigned_to(), \"Alice\");\n    }\n}\n"]]}]},{"t":"46. Concise Branching — if let / let else | সংক্ষিপ্ত ব্রাঞ্চিং — if let / let else","b":[["p","Path: 05_ticket_v2/04_if_let    |    Page Reference: 111"],["p","Use if let and while let for concise pattern matching."],["p","When you only care about one specific variant of an enum and want to ignore the rest, if let provides a less verbose alternative to match."],["p","Open exercises/05_ticket_v2/04_if_let/src/lib.rs. Rewrite or implement the function using if let."],["p","if let syntax:"],["code","if let Status::InProgress(assignee) = ticket.status {\n    println!(\"Assigned to: {assignee}\");\n} else {\n    println!(\"Not in progress\");\n}"],["p","while let — loops as long as the pattern matches:"],["code","while let Some(item) = stack.pop() {\n    println!(\"Popped: {item}\");\n}"],["p","let else — like if let but inverts: runs the else block when the pattern does NOT match, and the else block must diverge (return, break, continue, or panic):"],["code","let Status::InProgress(assignee) = ticket.status else {\n    return; // ticket is not in progress, exit early\n};\n// assignee is in scope here"],["p","Use whichever pattern-matching construct best fits each scenario in the tests."]],"n":46,"en":["Use `if let` and `let`/`else` for concise single-variant pattern matching. When you only care about one specific variant of an enum and want to ignore the rest, `if let` is more readable than a full `match`. Syntax: `if let Pattern = expression { body }`. The `let`/`else` construct is similar but designed for the case where you want to extract a value from a pattern or terminate early if it doesn't match: `let Pattern = expression else { return; }`. Both are idiomatic Rust for reducing boilerplate when full exhaustiveness is not needed."],"bt":["সংক্ষিপ্ত single-variant pattern matching-এর জন্য `if let` এবং `let`/`else` ব্যবহার করো। যখন শুধুমাত্র একটি নির্দিষ্ট variant সম্পর্কে আগ্রহ আছে, `if let` পূর্ণ `match`-এর চেয়ে বেশি পাঠযোগ্য।"],"loc":"exercises/05_ticket_v2/04_if_let","f":[{"n":"src/lib.rs","s":[["c","enum Shape {\n    Circle { radius: f64 },\n    Square { border: f64 },\n    Rectangle { width: f64, height: f64 },\n}\n\nimpl Shape {\n    // TODO: Implement the `radius` method using\n    //  either an `if let` or a `let/else`.\n    pub fn radius(&self) -> f64 {\n"],["g","        if let Shape::Circle { radius } = self {\n            *radius\n        } else {\n            panic!(\"Not a circle\");\n        }"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn test_circle() {\n        let _ = Shape::Circle { radius: 1.0 }.radius();\n    }\n\n    #[test]\n    #[should_panic]\n    fn test_square() {\n        let _ = Shape::Square { border: 1.0 }.radius();\n    }\n\n    #[test]\n    #[should_panic]\n    fn test_rectangle() {\n        let _ = Shape::Rectangle {\n            width: 1.0,\n            height: 2.0,\n        }\n        .radius();\n    }\n}\n"]]}]},{"t":"47. Nullability — Option<T> | নালযোগ্যতা — Option<T>","b":[["p","Path: 05_ticket_v2/05_nullability    |    Page Reference: 113"],["p","Use Option<T> to represent optional values in Rust."],["p","Rust has no null pointer. Instead, optional values are represented with the Option<T> enum:"],["code","enum Option<T> { Some(T), None }"],["p","Open exercises/05_ticket_v2/05_nullability/src/lib.rs. Use Option to handle optional fields or return values."],["p","Creating options:"],["code","let some_value: Option<i32> = Some(42);\nlet no_value: Option<i32> = None;"],["p","Useful Option methods:"],["li","opt.is_some() / opt.is_none() — check which variant"],["li","opt.unwrap() — get the inner value, panic if None"],["li","opt.unwrap_or(default) — get inner value or a default"],["li","opt.unwrap_or_else(|| expensive_default()) — lazy default"],["li","opt.map(|x| x + 1) — transform the inner value if Some"],["li","opt.and_then(|x| if x > 0 { Some(x) } else { None }) — chain computations"],["li","opt.ok_or(error) — convert Option to Result"],["p","Add an optional field to Ticket (e.g., assignee: Option<String>) and update the constructor and tests accordingly."]],"n":47,"en":["Use `Option<T>` to represent values that may or may not be present. Rust has no null pointer — instead, the standard library provides `Option<T>` with two variants: `Some(T)` (value is present) and `None` (value is absent). This forces callers to
