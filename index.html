d) -> Option<Ticket> {\n        self.store.lock().unwrap().get(id).cloned()\n    }\n}"],["p","Key considerations:"],["li","Hold the lock for as short a time as possible to minimise contention."],["li","Avoid holding the lock while doing I/O or sleeping."],["li","Beware of deadlocks: acquiring two locks in inconsistent order across threads."],["li","Use a MutexGuard carefully — dropping it releases the lock."]],"n":86,"en":["Use `Mutex<T>` for safe shared-state concurrency. A `Mutex` wraps a value and ensures only one thread can access it at a time. Call `.lock()` to acquire the mutex guard (blocks until the lock is free); the guard dereferences to `&mut T`. When the guard goes out of scope, the lock is released automatically. Combine `Mutex<T>` with `Arc<T>` to share a mutex across threads: `Arc<Mutex<TicketStore>>`. Practice building a multi-threaded server that uses `Arc<Mutex<TicketStore>>` instead of channels for state management."],"bt":["Safe shared-state concurrency-র জন্য `Mutex<T>` ব্যবহার করো। `Mutex` একটি value wrap করে এবং নিশ্চিত করে শুধুমাত্র একটি thread একসময় এটি access করতে পারে। Thread জুড়ে mutex share করতে `Arc<Mutex<TicketStore>>` ব্যবহার করো।"],"loc":"exercises/07_threads/11_locks","f":[{"n":"src/store.rs","s":[["c","use crate::data::{Status, Ticket, TicketDraft};\nuse std::collections::BTreeMap;\nuse std::sync::{Arc, Mutex};\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord)]\npub struct TicketId(u64);\n\n#[derive(Clone)]\npub struct TicketStore {\n    tickets: BTreeMap<TicketId, Arc<Mutex<Ticket>>>,\n    counter: u64,\n}\n\nimpl TicketStore {\n    pub fn new() -> Self {\n        Self {\n            tickets: BTreeMap::new(),\n            counter: 0,\n        }\n    }\n\n    pub fn add_ticket(&mut self, ticket: TicketDraft) -> TicketId {\n        let id = TicketId(self.counter);\n        self.counter += 1;\n        let ticket = Ticket {\n            id,\n            title: ticket.title,\n            description: ticket.description,\n            status: Status::ToDo,\n        };\n"],["g","        self.tickets.insert(id, Arc::new(Mutex::new(ticket)));"],["c","        id\n    }\n\n    // The `get` method should return a handle to the ticket\n    // which allows the caller to either read or modify the ticket.\n"],["g","    pub fn get(&self, id: TicketId) -> Option<Arc<Mutex<Ticket>>> {\n        self.tickets.get(&id).cloned()"],["c","    }\n}\n"]]}]},{"t":"87. Readers and Writers — RwLock | রিডার এবং রাইটার — RwLock","b":[["p","Path: 07_threads/12_rw_lock    |    Page Reference: 184"],["p","Use RwLock<T> for readers-writer locking."],["p","A RwLock allows multiple concurrent readers OR one exclusive writer — never both at the same time. It is more efficient than Mutex when reads vastly outnumber writes."],["p","Open exercises/07_threads/12_rw_lock/src/lib.rs."],["code","use std::sync::{Arc, RwLock};\nlet store = Arc::new(RwLock::new(TicketStore::new()));\n// Multiple threads can read concurrently:\nlet guard = store.read().unwrap(); // shared read lock\nlet ticket = guard.get(id);\ndrop(guard); // release read lock\n// Only one thread can write at a time:\nlet mut guard = store.write().unwrap(); // exclusive write lock\nlet id = guard.add(ticket);\ndrop(guard); // release write lock"],["p","When to use RwLock:"],["li","Read operations are much more frequent than writes."],["li","Read operations are expensive (long-held locks), so sharing reads matters."],["p","The tests will spawn many reader threads and a few writer threads, verifying that reads and writes are correctly isolated."]],"n":87,"en":["Use `RwLock<T>` to allow concurrent reads with exclusive writes. `RwLock` provides two modes: shared read (`.read()`) — multiple threads can hold a read lock simultaneously — and exclusive write (`.write()`) — only one thread can hold a write lock. This improves throughput in read-heavy workloads compared to `Mutex`. Replace `Arc<Mutex<TicketStore>>` with `Arc<RwLock<TicketStore>>` and verify that multiple readers can work concurrently while writes are exclusive."],"bt":["Concurrent read এবং exclusive write-এর জন্য `RwLock<T>` ব্যবহার করো। `RwLock` দুটি mode প্রদান করে: shared read (`.read()`) — একাধিক thread একসাথে read lock hold করতে পারে — এবং exclusive write (`.write()`)।"],"loc":"exercises/07_threads/12_rw_lock","f":[{"n":"src/lib.rs","s":[["g","use std::sync::{Arc, Mutex, RwLock};"],["c","// TODO: Replace `Mutex` with `RwLock` in the `TicketStore` struct and\n//  all other relevant places to allow multiple readers to access the ticket store concurrently.\n"],["g","use std::sync::mpsc::{sync_channel, Receiver, SyncSender};"],["c","\nuse crate::data::{Ticket, TicketDraft};\nuse crate::store::{TicketId, TicketStore};\n\npub mod data;\npub mod store;\n\n#[derive(Clone)]\npub struct TicketStoreClient {\n    sender: SyncSender<Command>,\n}\n\nimpl TicketStoreClient {\n    pub fn insert(&self, draft: TicketDraft) -> Result<TicketId, OverloadedError> {\n        let (response_sender, response_receiver) = sync_channel(1);\n        self.sender\n            .try_send(Command::Insert {\n                draft,\n                response_channel: response_sender,\n            })\n            .map_err(|_| OverloadedError)?;\n        Ok(response_receiver.recv().unwrap())\n    }\n\n"],["g","    pub fn get(&self, id: TicketId) -> Result<Option<Arc<RwLock<Ticket>>>, OverloadedError> {"],["c","        let (response_sender, response_receiver) = sync_channel(1);\n        self.sender\n            .try_send(Command::Get {\n                id,\n                response_channel: response_sender,\n            })\n            .map_err(|_| OverloadedError)?;\n        Ok(response_receiver.recv().unwrap())\n    }\n}\n\n#[derive(Debug, thiserror::Error)]\n#[error(\"The store is overloaded\")]\npub struct OverloadedError;\n\npub fn launch(capacity: usize) -> TicketStoreClient {\n    let (sender, receiver) = sync_channel(capacity);\n    std::thread::spawn(move || server(receiver));\n    TicketStoreClient { sender }\n}\n\nenum Command {\n    Insert {\n        draft: TicketDraft,\n        response_channel: SyncSender<TicketId>,\n    },\n    Get {\n        id: TicketId,\n"],["g","        response_channel: SyncSender<Option<Arc<RwLock<Ticket>>>>,"],["c","    },\n}\n\npub fn server(receiver: Receiver<Command>) {\n    let mut store = TicketStore::new();\n    loop {\n        match receiver.recv() {\n            Ok(Command::Insert {\n                draft,\n                response_channel,\n            }) => {\n                let id = store.add_ticket(draft);\n                let _ = response_channel.send(id);\n            }\n            Ok(Command::Get {\n                id,\n                response_channel,\n            }) => {\n                let ticket = store.get(id);\n                let _ = response_channel.send(ticket);\n            }\n            Err(_) => {\n                // There are no more senders, so we can safely break\n                // and shut down the server.\n                break;\n            }\n        }\n    }\n}\n"]]},{"n":"src/store.rs","s":[["c","use crate::data::{Status, Ticket, TicketDraft};\nuse std::collections::BTreeMap;\n"],["g","use std::sync::{Arc, RwLock};"],["c","\n#[derive(Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord)]\npub struct TicketId(u64);\n\n#[derive(Clone)]\npub struct TicketStore {\n"],["g","    tickets: BTreeMap<TicketId, Arc<RwLock<Ticket>>>,"],["c","    counter: u64,\n}\n\nimpl TicketStore {\n    pub fn new() -> Self {\n        Self {\n            tickets: BTreeMap::new(),\n            counter: 0,\n        }\n    }\n\n    pub fn add_ticket(&mut self, ticket: TicketDraft) -> TicketId {\n        let id = TicketId(self.counter);\n        self.counter += 1;\n        let ticket = Ticket {\n            id,\n            title: ticket.title,\n            description: ticket.description,\n            status: Status::ToDo,\n        };\n"],["g","        let ticket = Arc::new(RwLock::new(ticket));"],["c","        self.tickets.insert(id, ticket);\n        id\n    }\n\n    // The `get` method should return a handle to the ticket\n    // which allows the caller to either read or modify the ticket.\n"],["g","    pub fn get(&self, id: TicketId) -> Option<Arc<RwLock<Ticket>>> {"],["c","        self.tickets.get(&id).cloned()\n    }\n}\n"]]}]},{"t":"88. Shared-State Concurrency Without Channels | চ্যানেল ছাড়া Shared-State Concurrency","b":[["p","Path: 07_threads/13_without_channels    |    Page Reference: 186"],["p","Rebuild the concurrent ticket store using shared memory (Arc + Mutex) instead of channels."],["p","The previous channel-based approach used message passing. This exercise demonstrates the alternative: shared memory with explicit locking."],["p","Open exercises/07_threads/13_without_channels/src/lib.rs."],["p","Implement TicketStore using Arc<RwLock<HashMap<TicketId, Ticket>>> directly accessible from multiple threads — no server thread needed."],["p","Compare the two approaches:"],["code","Channels (message passing):\n  + Clear ownership of data\n  + Easy to reason about ordering"],["li","Extra copying/serialisation"],["li","Server thread is a bottleneck"],["code","Shared memory (Arc + Mutex/RwLock):\n  + No copying for read operations\n  + Multiple threads can read simultaneously (with RwLock)"],["li","Must be careful with deadlocks"],["li","More complex ownership reasoning"],["p","Implement the required operations (insert, get, update, delete) using the shared-memory approach."]],"n":88,"en":["Refactor the ticket server to use shared state (`Arc<RwLock<TicketStore>>`) instead of channels for its core operations. Access the shared store directly from client threads using the lock. Compare this design with the channel-based design: channels enforce a strict producer–consumer model and naturally serialize access; shared-state with locks is more flexible but requires careful use of lock scope to avoid deadlocks. Understand the trade-offs and choose the right approach for your use case."],"bt":["Core operations-এর জন্য channel-এর পরিবর্তে shared state (`Arc<RwLock<TicketStore>>`) ব্যবহার করতে ticket server refactor করো। Channel-based design এবং shared-state lock design-এর মধ্যে trade-off বোঝো।"],"loc":"exercises/07_threads/13_without_channels","f":[{"n":"tests/check.rs","s":[["c","use std::sync::{Arc, RwLock};\nuse std::thread::spawn;\n\nuse ticket_fields::test_helpers::{ticket_description, ticket_title};\nuse without_channels::data::TicketDraft;\nuse without_channels::store::TicketStore;\n\n#[test]\nfn works() {\n"],["g","    let store = Arc::new(RwLock::new(TicketStore::new()));"],["c","\n    let store1 = store.clone();\n    let client1 = spawn(move || {\n        let draft = TicketDraft {\n            title: ticket_title(),\n            description: ticket_description(),\n        };\n        store1.write().unwrap().add_ticket(draft)\n    });\n\n    let store2 = store.clone();\n    let client2 = spawn(move || {\n        let draft = TicketDraft {\n            title: ticket_title(),\n            description: ticket_description(),\n        };\n        store2.write().unwrap().add_ticket(draft)\n    });\n\n    let ticket_id1 = client1.join().unwrap();\n    let ticket_id2 = client2.join().unwrap();\n\n    let reader = store.read().unwrap();\n\n    let ticket1 = reader.get(ticket_id1).unwrap();\n    assert_eq!(ticket_id1, ticket1.read().unwrap().id);\n\n    let ticket2 = reader.get(ticket_id2).unwrap();\n    assert_eq!(ticket_id2, ticket2.read().unwrap().id);\n}\n"]]}]},{"t":"89. The Sync Trait | Sync ট্রেইট","b":[["p","Path: 07_threads/14_sync    |    Page Reference: 187"],["p","Understand the Send and Sync marker traits."],["p","These two marker traits encode thread safety in the type system:"],["li","Send: a type can be safely moved to another thread."],["li","Sync: a type can be safely shared by reference (&T) across threads."],["p","If T: Sync, then &T: Send."],["p","Open exercises/07_threads/14_sync/src/lib.rs. Fix the code so that your type is correctly Send and/or Sync."],["p","Auto-derived rules:"],["li","A type is Send if all its fields are Send."],["li","A type is Sync if all its fields are Sync."],["li","Rc<T> is NOT Send (not atomic reference counting)."],["li","RefCell<T> is NOT Sync (non-atomic interior mutability)."],["li","Arc<T> IS Send + Sync (if T: Send + Sync)."],["li","Mutex<T> IS Send + Sync (if T: Send)."],["p","To explicitly assert your type is Send/Sync (when the compiler cannot prove it and you know it is safe):"],["code","unsafe impl Send for MyType {}\nunsafe impl Sync for MyType {}"],["p","Use this only when you have verified safety manually — incorrect implementations are undefined behaviour."]],"n":89,"en":["Understand the `Send` and `Sync` marker traits that govern thread safety. `Send` means: it is safe to transfer ownership of this value to another thread. `Sync` means: it is safe to share a reference to this value across threads (i.e. `&T` is `Send`). Most types implement both automatically. Types that do not are: `Rc<T>` (not `Send` or `Sync`), `RefCell<T>` (not `Sync`), raw pointers (neither). The compiler enforces these at compile time. Practice reasoning about which types are `Send`/`Sync` and why certain designs require `Arc` instead of `Rc`."],"bt":["Thread safety পরিচালনা করে `Send` এবং `Sync` marker trait বোঝো। `Send` মানে: অন্য thread-এ ownership transfer করা নিরাপদ। `Sync` মানে: thread জুড়ে reference share করা নিরাপদ। `Rc<T>` (not `Send` বা `Sync`), `RefCell<T>` (not `Sync`) অনুশীলন করো।"],"loc":"exercises/07_threads/14_sync","f":[{"n":"src/lib.rs","s":[["c","// Not much to be exercised on `Sync`, just a thing to remember.\nfn outro() -> &'static str {\n"],["g","    \"I have a good understanding of Send and Sync!\""],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::outro;\n\n    #[test]\n    fn test_outro() {\n        assert_eq!(outro(), \"I have a good understanding of Send and Sync!\");\n    }\n}\n"]]}]}]},{"id":"c8","t":"Chapter 8: Async Rust","k":"chapter","ex":[{"t":"90. Async Rust Introduction | Async Rust ভূমিকা","b":[["p","Path: 08_futures/00_intro    |    Page Reference: 188"],["p","Introduction to Chapter 8: asynchronous programming with async/await."],["p","Async Rust allows writing concurrent code that looks sequential, using the async/await syntax. It is based on the Future trait — a lazy computation that can be polled to completion."],["p","Open exercises/08_futures/00_intro/src/lib.rs. Complete the introductory exercise."],["p","Chapter overview:"],["li","async fn returns an impl Future<Output = T>"],["li",".await suspends the current task until the future is ready"],["li","tokio is the most popular async runtime (executor)"],["li","spawn concurrent tasks with tokio::spawn"],["li","Use tokio::sync::Mutex and tokio::sync::mpsc for async-aware concurrency primitives"],["p","The introductory exercise warms you up with a simple async function. You will need to add tokio as a dependency and annotate your test with #[tokio::test]."]],"n":90,"en":["Introduction to asynchronous programming in Rust. This chapter covers: the `async`/`.await` keywords, the `Future` trait, Tokio as the async runtime, spawning async tasks, the runtime architecture (single-threaded vs. multi-threaded schedulers), blocking vs. non-blocking operations, async-aware synchronisation primitives, and cancellation. Asynchronous programming allows a single thread to manage many concurrent I/O-bound operations without blocking, making it ideal for web servers and network clients."],"bt":["Rust-এ asynchronous programming-এর ভূমিকা। Topics: `async`/`.await` keyword, `Future` trait, Tokio runtime, async task spawn, blocking বনাম non-blocking operations, async-aware synchronisation primitive, cancellation। Async programming একটি single thread-কে অনেক concurrent I/O-bound operation পরিচালনা করতে দেয়।"],"loc":"exercises/08_futures/00_intro","f":[{"n":"src/lib.rs","s":[["c","fn intro() -> &'static str {\n    // TODO: fix me 👇\n"],["g","    \"I'm ready to learn about futures!\""],["c","}\n\n#[cfg(test)]\nmod tests {\n    use crate::intro;\n\n    #[test]\n    fn test_intro() {\n        assert_eq!(intro(), \"I'm ready to learn about futures!\");\n    }\n}\n"]]}]},{"t":"91. Asynchronous Functions | অ্যাসিঙ্ক্রোনাস ফাংশন","b":[["p","Path: 08_futures/01_async_fn    |    Page Reference: 191"],["p","Write your first async functions using async fn and .await."],["p","An async fn is a function that returns a Future. When called, it returns immediately without executing the body. The body runs when the future is polled (driven by an executor)."],["p","Open exercises/08_futures/01_async_fn/src/lib.rs."],["p","Syntax:"],["code","async fn fetch_ticket(id: TicketId) -> Option<Ticket> {\n    // simulate async work\n    tokio::time::sleep(std::time::Duration::from_millis(10)).await;\n    store.get(id)\n}\n// Calling an async fn from another async fn:\nasync fn process() {\n    let ticket = fetch_ticket(1).await;\n    println!(\"{:?}\", ticket);\n}"],["p","Key concepts:"],["li","async fn desugars to fn() -> impl Future<Output = T>."],["li",".await pauses execution until the awaited future is complete."],["li","Async code does NOT block the OS thread while waiting."],["li","You need an async runtime (tokio, async-std) to execute futures."],["p","Add #[tokio::test] to your test functions."]],"n":91,"en":["Write asynchronous functions using the `async fn` syntax. An `async fn` returns a `Future` — a value representing a computation that has not yet completed. The future is lazy: it does nothing until polled by an executor. Use `.await` to suspend the current async function until the awaited future completes. Use `#[tokio::main]` (or `#[tokio::test]`) to run async code from a synchronous entry point. Practice converting a synchronous function to async and using `.await` to chain asynchronous calls."],"bt":["`async fn` syntax ব্যবহার করে asynchronous ফাংশন লেখো। একটি `async fn` একটি `Future` রিটার্ন করে। Future lazy: executor দ্বারা poll না হওয়া পর্যন্ত কিছু করে না। `.await` ব্যবহার করো awaited future সম্পূর্ণ না হওয়া পর্যন্ত suspend করতে।"],"loc":"exercises/08_futures/01_async_fn","f":[{"n":"src/lib.rs","s":[["c","use tokio::net::TcpListener;\n\n// TODO: write an echo server that accepts incoming TCP connections and\n//  echoes the received data back to the client.\n//  `echo` should not return when it finishes processing a connection, but should\n//  continue to accept new connections.\n//\n// Hint: you should rely on `tokio`'s structs and methods to implement the echo server.\n// In particular:\n// - `tokio::net::TcpListener::accept` to process the next incoming connection\n// - `tokio::net::TcpStream::split` to obtain a reader and a writer from the socket\n// - `tokio::io::copy` to copy data from the reader to the writer\npub async fn echo(listener: TcpListener) -> Result<(), anyhow::Error> {\n"],["g","    loop {\n        let (mut socket, _) = listener.accept().await?;\n        let (mut reader, mut writer) = socket.split();\n        tokio::io::copy(&mut reader, &mut writer).await?;\n    }"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tokio::io::{AsyncReadExt, AsyncWriteExt};\n\n    #[tokio::test]\n    async fn test_echo() {\n        let listener = TcpListener::bind(\"127.0.0.1:0\").await.unwrap();\n        let addr = listener.local_addr().unwrap();\n        tokio::spawn(echo(listener));\n\n        let requests = vec![\"hello\", \"world\", \"foo\", \"bar\"];\n\n        for request in requests {\n            let mut socket = tokio::net::TcpStream::connect(addr).await.unwrap();\n            let (mut reader, mut writer) = socket.split();\n\n            // Send the request\n            writer.write_all(request.as_bytes()).await.unwrap();\n            // Close the write side of the socket\n            writer.shutdown().await.unwrap();\n\n            // Read the response\n            let mut buf = Vec::with_capacity(request.len());\n            reader.read_to_end(&mut buf).await.unwrap();\n            assert_eq!(&buf, request.as_bytes());\n        }\n    }\n}\n"]]}]},{"t":"92. Spawning Async Tasks | Async Task স্পন করা","b":[["p","Path: 08_futures/02_spawn    |    Page Reference: 194"],["p","Spawn concurrent async tasks with tokio::spawn."],["p","tokio::spawn runs a future concurrently — similar to thread::spawn but for async tasks."],["p","Open exercises/08_futures/02_spawn/src/lib.rs."],["code","use tokio::task::JoinHandle;\nasync fn run_concurrent() {\n    let handle1: JoinHandle<i32> = tokio::spawn(async { 42 });\n    let handle2: JoinHandle<String> = tokio::spawn(async { \"hello\".to_string() });\n    let result1 = handle1.await.unwrap(); // 42\n    let result2 = handle2.await.unwrap(); // \"hello\"\n}"],["p","Key differences from thread::spawn:"],["li","Much cheaper to spawn (no OS thread created)."],["li","Closure must be async (wrap code in async { ... } block)."],["li","Returns JoinHandle<T> — awaiting it gives Result<T, JoinError>."],["li","If the task panics, JoinHandle::await returns Err(JoinError)."],["p","tokio::join! macro — await multiple futures concurrently:"],["code","let (r1, r2) = tokio::join!(future1, future2);"],["p","tokio::select! macro — race multiple futures, cancel the losers:"],["code","tokio::select! { r1 = future1 => ..., r2 = future2 => ... }"],["p","The tests verify that your spawned tasks run concurrently, not sequentially."]],"n":92,"en":["Spawn async tasks using `tokio::spawn`. Like `std::thread::spawn` for threads, `tokio::spawn` creates a new async task that runs concurrently with the current task. `tokio::spawn` returns a `JoinHandle<T>`; call `.await` on the handle to wait for the task. Key difference from threads: all tasks run on the same thread pool managed by Tokio, and task switching happens at `.await` points. Panics in spawned tasks are caught and returned as errors from the `JoinHandle`. Practice spawning multiple tasks and collecting their results."],"bt":["`tokio::spawn` ব্যবহার করে async task spawn করো। `tokio::spawn` একটি নতুন async task তৈরি করে যা বর্তমান task-এর সাথে concurrently চলে। Handle-এ `.await` কল করো task-এর জন্য অপেক্ষা করতে।"],"loc":"exercises/08_futures/02_spawn","f":[{"n":"src/lib.rs","s":[["c","use tokio::net::TcpListener;\n\n// TODO: write an echo server that accepts TCP connections on two listeners, concurrently.\n//  Multiple connections (on the same listeners) should be processed concurrently.\n//  The received data should be echoed back to the client.\npub async fn echoes(first: TcpListener, second: TcpListener) -> Result<(), anyhow::Error> {\n"],["g","    let handle1 = tokio::spawn(echo(first));\n    let handle2 = tokio::spawn(echo(second));\n    let (outcome1, outcome2) = tokio::join!(handle1, handle2);\n    outcome1??;\n    outcome2??;\n    Ok(())\n}\n\nasync fn echo(listener: TcpListener) -> Result<(), anyhow::Error> {\n    loop {\n        let (mut socket, _) = listener.accept().await?;\n        tokio::spawn(async move {\n            let (mut reader, mut writer) = socket.split();\n            tokio::io::copy(&mut reader, &mut writer).await.unwrap();\n        });\n    }"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::net::SocketAddr;\n    use std::panic;\n    use tokio::io::{AsyncReadExt, AsyncWriteExt};\n    use tokio::task::JoinSet;\n\n    async fn bind_random() -> (TcpListener, SocketAddr) {\n        let listener = TcpListener::bind(\"127.0.0.1:0\").await.unwrap();\n        let addr = listener.local_addr().unwrap();\n        (listener, addr)\n    }\n\n    #[tokio::test]\n    async fn test_echo() {\n        let (first_listener, first_addr) = bind_random().await;\n        let (second_listener, second_addr) = bind_random().await;\n        tokio::spawn(echoes(first_listener, second_listener));\n\n        let requests = vec![\"hello\", \"world\", \"foo\", \"bar\"];\n        let mut join_set = JoinSet::new();\n\n        for request in requests.clone() {\n            for addr in [first_addr, second_addr] {\n                join_set.spawn(async move {\n                    let mut socket = tokio::net::TcpStream::connect(addr).await.unwrap();\n                    let (mut reader, mut writer) = socket.split();\n\n                    // Send the request\n                    writer.write_all(request.as_bytes()).await.unwrap();\n                    // Close the write side of the socket\n                    writer.shutdown().await.unwrap();\n\n                    // Read the response\n                    let mut buf = Vec::with_capacity(request.len());\n                    reader.read_to_end(&mut buf).await.unwrap();\n                    assert_eq!(&buf, request.as_bytes());\n                });\n            }\n        }\n\n        while let Some(outcome) = join_set.join_next().await {\n            if let Err(e) = outcome {\n                if let Ok(reason) = e.try_into_panic() {\n                    panic::resume_unwind(reason);\n                }\n            }\n        }\n    }\n}\n"]]}]},{"t":"93. Runtime Architecture | রানটাইম আর্কিটেকচার","b":[["p","Path: 08_futures/03_runtime    |    Page Reference: 196"],["p","Understand the async runtime and how futures are executed."],["p","Futures are lazy — they do nothing until polled. An async runtime is responsible for driving futures to completion."],["p","Open exercises/08_futures/03_runtime/src/lib.rs."],["p","Setting up a tokio runtime manually:"],["code","use tokio::runtime::Runtime;\nlet rt = Runtime::new().unwrap();\nrt.block_on(async {\n    // your async code here\n});"],["p","Common runtime configurations:"],["li","#[tokio::main] — macro that wraps main() in a runtime."],["li","#[tokio::test] — macro for async test functions."],["li","Runtime::new() — multi-threaded runtime (default: one thread per CPU core)."],["li","tokio::runtime::Builder::new_current_thread() — single-threaded runtime (useful for testing)."],["p","The exercise will require you to set up the runtime in a specific way (e.g., a single-threaded runtime for deterministic testing). Make the tests compile and pass."]],"n":93,"en":["Understand Tokio's runtime architecture. Tokio provides two scheduler flavours: `#[tokio::main]` with `flavor = \"current_thread\"` (single-threaded) and `flavor = \"multi_thread\"` (the default, which uses a thread pool). In the multi-threaded scheduler, tasks may be run on different threads, so they must be `Send`. `Rc<T>` and `RefCell<T>` are not `Send` and cannot be used across `.await` points in a multi-thread runtime. Practice identifying why certain async code fails to compile and how to fix it by switching from `Rc` to `Arc` and from `RefCell` to `Mutex`."],"bt":["Tokio-র runtime architecture বোঝো। Tokio দুটি scheduler প্রদান করে: `flavor = \"current_thread\"` (single-threaded) এবং `flavor = \"multi_thread\"` (default thread pool)। Multi-thread scheduler-এ task `Send` হতে হবে।"],"loc":"exercises/08_futures/03_runtime","f":[{"n":"src/lib.rs","s":[["c","// TODO: Implement the `fixed_reply` function. It should accept two `TcpListener` instances,\n//  accept connections on both of them concurrently, and always reply to clients by sending\n//  the `Display` representation of the `reply` argument as a response.\nuse std::fmt::Display;\n"],["g","use std::sync::Arc;"],["c","use tokio::io::AsyncWriteExt;\nuse tokio::net::TcpListener;\n\npub async fn fixed_reply<T>(first: TcpListener, second: TcpListener, reply: T)\nwhere\n    // `T` cannot be cloned. How do you share it between the two server tasks?\n    T: Display + Send + Sync + 'static,\n{\n"],["g","    let reply = Arc::new(reply);\n    let handle1 = tokio::spawn(_fixed_reply(first, Arc::clone(&reply)));\n    let handle2 = tokio::spawn(_fixed_reply(second, reply));\n\n    tokio::join!(handle1, handle2,);\n}\n\nasync fn _fixed_reply<T>(listener: TcpListener, reply: Arc<T>)\nwhere\n    T: Display + Send + Sync + 'static,\n{\n    loop {\n        let (mut socket, _) = listener.accept().await.unwrap();\n        let (_reader, mut writer) = socket.split();\n        writer\n            .write_all(format!(\"{}\", reply).as_bytes())\n            .await\n            .unwrap();\n    }"],["c","}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::net::SocketAddr;\n    use std::panic;\n    use tokio::io::AsyncReadExt;\n    use tokio::task::JoinSet;\n\n    async fn bind_random() -> (TcpListener, SocketAddr) {\n        let listener = TcpListener::bind(\"127.0.0.1:0\").await.unwrap();\n        let addr = listener.local_addr().unwrap();\n        (listener, addr)\n    }\n\n    #[tokio::test]\n    async fn test_echo() {\n        let (first_listener, first_addr) = bind_random().await;\n        let (second_listener, second_addr) = bind_random().await;\n        let reply = \"Yo\";\n        tokio::spawn(fixed_reply(first_listener, second_listener, reply));\n\n        let mut join_set = JoinSet::new();\n\n        for _ in 0..3 {\n            for addr in [first_addr, second_addr] {\n                join_set.spawn(async move {\n                    let mut socket = tokio::net::TcpStream::connect(addr).await.unwrap();\n                    let (mut reader, _) = socket.split();\n\n                    // Read the response\n                    let mut buf = Vec::new();\n                    reader.read_to_end(&mut buf).await.unwrap();\n                    assert_eq!(&buf, reply.as_bytes());\n                });\n            }\n        }\n\n        while let Some(outcome) = join_set.join_next().await {\n            if let Err(e) = outcome {\n                if let Ok(reason) = e.try_into_panic() {\n                    panic::resume_unwind(reason);\n                }\n            }\n        }\n    }\n}\n"]]}]},{"t":"94. The Future Trait | Future ট্রেইট","b":[["p","Path: 08_futures/04_future    |    Page Reference: 200"],["p","Implement the Future trait manually to understand how async/await works under the hood."],["p","async/await is syntactic sugar over the Future trait. Implementing it manually shows you the mechanics."],["p","Open exercises/08_futures/04_future/src/lib.rs."],["p","The Future trait:"],["code","use std::task::{Context, Poll};\nuse std::pin::Pin;\npub trait Future {\n    type Output;\n    fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>;\n}\nenum Poll<T> {\n    Ready(T),   // the future is done\n    Pending,    // not done yet; will call cx.waker().wake() when ready\n}"],["p","Implementing a simple future:"],["code","struct ReadyFuture<T>(Option<T>);\nimpl<T: Unpin> Future for ReadyFuture<T> {\n    type Output = T;\n    fn poll(mut self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<T> {\n        Poll::Ready(self.0.take().unwrap())\n    }\n}"],["p","The exercise asks you to build a custom future (e.g., a countdown timer or a one-shot channel receiver)."]],"n":94,"en":["Implement the `Future` trait manually to understand how async/await works under the hood. The `Future` trait has a single method: `fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>`. `Poll::Ready(value)` means the future has completed; `Poll::Pending` means it has not yet and the executor should be woken up (via the `Waker` in `Context`) when it is ready to make progress. Understand that `.await` is syntactic sugar that continuously polls the future until it returns `Poll::Ready`. Practice writing a simple state-machine future by hand."],"bt":["Async/await কীভাবে কাজ করে তা বুঝতে `Future` trait manually ইমপ্লিমেন্ট করো। `Future` trait-এ একটিমাত্র মেথড: `fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<Self::Output>`। `.await` sugar যা future `Poll::Ready` রিটার্ন করা পর্যন্ত continuously poll করে।"],"loc":"exercises/08_futures/04_future","f":[{"n":"src/lib.rs","s":[["c","//! TODO: get the code to compile by **re-ordering** the statements\n//!  in the `example` function. You're not allowed to change the\n//!  `spawner` function nor what each line does in `example`.\n//!   You can wrap existing statements in blocks `{}` if needed.\nuse std::rc::Rc;\nuse tokio::task::yield_now;\n\nfn spawner() {\n    tokio::spawn(example());\n}\n\nasync fn example() {\n"],["g","    {\n        let non_send = Rc::new(1);\n        println!(\"{}\", non_send);\n    }"],["c","    yield_now().await;\n"],["c","}\n"]]}]},{"t":"95. Don't Block the Async Runtime | Async Runtime Block করো না","b":[["p","Path: 08_futures/05_blocking    |    Page Reference: 202"],["p","Handle blocking operations in async code without starving the runtime."],["p","Async runtimes use a fixed thread pool. Blocking an async task (e.g., with std::thread::sleep or heavy CPU work) blocks one of those threads, starving other tasks."],["p","Open exercises/08_futures/05_blocking/src/lib.rs."],["p","Solutions for blocking work in async code:"],["code","1. Use async alternatives:\n     tokio::time::sleep(duration).await; // non-blocking sleep\n2. Offload CPU-bound or blocking I/O to a dedicated thread pool:\n     let result = tokio::task::spawn_blocking(|| {\n         // blocking/CPU-intensive code here\n         heavy_computation()\n     }).await.unwrap();\n3. Use tokio::fs, tokio::net, tokio::io — async versions of I/O operations."],["p","The exercise will present code that incorrectly blocks the async runtime and ask you to fix it using one of the approaches above. Run the tests to confirm that tasks no longer starve each other."]],"n":95,"en":["Learn why blocking operations are dangerous in an async runtime and how to avoid them. The async runtime uses a small thread pool to run tasks. If a task blocks (e.g. by sleeping with `std::thread::sleep`, doing heavy CPU work, or performing synchronous I/O), it blocks one of the runtime's worker threads, potentially starving other tasks. Use `tokio::time::sleep` instead of `std::thread::sleep`, async I/O instead of synchronous I/O, and `tokio::task::spawn_blocking` for CPU-intensive or inherently blocking code."],"bt":["Blocking operation async runtime-এ কেন বিপজ্জনক এবং কীভাবে এড়ানো যায় তা শেখো। Async runtime task চালাতে একটি ছোট thread pool ব্যবহার করে। `std::thread::sleep`-এর পরিবর্তে `tokio::time::sleep` ব্যবহার করো, CPU-intensive কোডের জন্য `tokio::task::spawn_blocking` ব্যবহার করো।"],"loc":"exercises/08_futures/05_blocking","f":[{"n":"src/lib.rs","s":[["c","// TODO: the `echo` server uses non-async primitives.\n//  When running the tests, you should observe that it hangs, due to a\n//  deadlock between the caller and the server.\n//  Use `spawn_blocking` inside `echo` to resolve the issue.\nuse std::io::{Read, Write};\nuse tokio::net::TcpListener;\n"],["g","use tokio::task::spawn_blocking;"],["c","\npub async fn echo(listener: TcpListener) -> Result<(), anyhow::Error> {\n    loop {\n        let (socket, _) = listener.accept().await?;\n        let mut socket = socket.into_std()?;\n"],["g","        spawn_blocking(move || -> Result<(), anyhow::Error> {\n            socket.set_nonblocking(false)?;\n            let mut buffer = Vec::new();\n            socket.read_to_end(&mut buffer)?;\n            socket.write_all(&buffer)?;\n            Ok(())\n        });"],["c","    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::net::SocketAddr;\n    use std::panic;\n    use tokio::io::{AsyncReadExt, AsyncWriteExt};\n    use tokio::task::JoinSet;\n\n    async fn bind_random() -> (TcpListener, SocketAddr) {\n        let listener = TcpListener::bind(\"127.0.0.1:0\").await.unwrap();\n        let addr = listener.local_addr().unwrap();\n        (listener, addr)\n    }\n\n    #[tokio::test]\n    async fn test_echo() {\n        let (listener, addr) = bind_random().await;\n        tokio::spawn(echo(listener));\n\n        let requests = vec![\n            \"hello here we go with a long message\",\n            \"world\",\n            \"foo\",\n            \"bar\",\n        ];\n        let mut join_set = JoinSet::new();\n\n        for request in requests {\n            join_set.spawn(async move {\n                let mut socket = tokio::net::TcpStream::connect(addr).await.unwrap();\n                let (mut reader, mut writer) = socket.split();\n\n                // Send the request\n                writer.write_all(request.as_bytes()).await.unwrap();\n                // Close the write side of the socket\n                writer.shutdown().await.unwrap();\n\n                // Read the response\n                let mut buf = Vec::with_capacity(request.len());\n                reader.read_to_end(&mut buf).await.unwrap();\n                assert_eq!(&buf, request.as_bytes());\n            });\n        }\n\n        while let Some(outcome) = join_set.join_next().await {\n            if let Err(e) = outcome {\n                if let Ok(reason) = e.try_into_panic() {\n                    panic::resume_unwind(reason);\n                }\n            }\n        }\n    }\n}\n"]]}]},{"t":"96. Async-Aware Primitives | Async-সচেতন Primitive","b":[["p","Path: 08_futures/06_async_aware_primitives    |    Page Reference: 205"],["p","Replace std concurrency primitives with their async-aware counterparts."],["p","The standard library's Mutex, mpsc, and other synchronisation primitives block the OS thread when contended. In async code, you should use async-aware versions that yield back to the runtime instead."],["p","Open exercises/08_futures/06_async_aware_primitives/src/lib.rs."],["p","tokio async-aware primitives:"],["li","tokio::sync::Mutex<T> — async mutex (await-able lock())"],["li","tokio::sync::RwLock<T> — async reader-writer lock"],["li","tokio::sync::mpsc — async multi-producer single-consumer channel"],["li","tokio::sync::broadcast — async multi-producer multi-consumer channel"],["li","tokio::sync::oneshot — single-use channel (one send, one receive)"],["li","tokio::sync::Semaphore — limit concurrent access to a resource"],["li","tokio::sync::Notify — notify waiting tasks"],["p","Replace std::sync::Mutex with tokio::sync::Mutex in the exercise and update the lock() calls to use .await."],["code","let mutex = tokio::sync::Mutex::new(store);\nlet guard = mutex.lock().await;"]],"n":96,"en":["Use async-aware synchronisation primitives from `tokio::sync` instead of the standard library equivalents. When a `tokio::sync::Mutex` is locked, the current task yields (suspends) rather than blocking the thread. When a `std::sync::Mutex` is locked, the thread itself blocks. Replace `std::sync::Mutex` with `tokio::sync::Mutex` in async code that holds the lock across `.await` points. The same applies to `tokio::sync::RwLock`, `tokio::sync::Semaphore`, and `tokio::sync::Notify`. Use the correct primitive for each scenario."],"bt":["Standard library-র পরিবর্তে `tokio::sync` থেকে async-aware synchronisation primitive ব্যবহার করো। `tokio::sync::Mutex` lock হলে বর্তমান task yield করে (thread block করে না)। `.await` point জুড়ে lock hold করলে `tokio::sync::Mutex` ব্যবহার করো।"],"loc":"exercises/08_futures/06_async_aware_primitives","f":[{"n":"src/lib.rs","s":[["c","/// TODO: the code below will deadlock because it's using std's channels,\n///  which are not async-aware.\n///  Rewrite it to use `tokio`'s channels primitive (you'll have to touch\n///  the testing code too, yes).\n///\n/// Can you understand the sequence of events that can lead to a deadlock?\n"],["g","use tokio::sync::mpsc;"],["c","\npub struct Message {\n    payload: String,\n    response_channel: mpsc::Sender<Message>,\n}\n\n/// Replies with `pong` to any message it receives, setting up a new\n/// channel to continue communicating with the caller.\npub async fn pong(mut receiver: mpsc::Receiver<Message>) {\n    loop {\n"],["g","        if let Some(msg) = receiver.recv().await {"],["c","            println!(\"Pong received: {}\", msg.payload);\n"],["g","            let (sender, new_receiver) = mpsc::channel(1);"],["c","            msg.response_channel\n                .send(Message {\n                    payload: \"pong\".into(),\n                    response_channel: sender,\n                })\n"],["g","                .await"],["c","                .unwrap();\n            receiver = new_receiver;\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use crate::{pong, Message};\n"],["g","    use tokio::sync::mpsc;"],["c","\n    #[tokio::test]\n    async fn ping() {\n"],["g","        let (sender, receiver) = mpsc::channel(1);\n        let (response_sender, mut response_receiver) = mpsc::channel(1);"],["c","        sender\n            .send(Message {\n                payload: \"pong\".into(),\n                response_channel: response_sender,\n            })\n"],["g","            .await"],["c","            .unwrap();\n\n        tokio::spawn(pong(receiver));\n\n"],["g","        let answer = response_receiver.recv().await.unwrap().payload;"],["c","        assert_eq!(answer, \"pong\");\n    }\n}\n"]]}]},{"t":"97. Cancellation | বাতিলকরণ (Cancellation)","b":[["p","Path: 08_futures/07_cancellation    |    Page Reference: 207"],["p","Handle async task cancellation safely."],["p","In async Rust, a future is cancelled by simply dropping it — the runtime stops polling it and drops its state. This is powerful but requires care: cancelled tasks may leave resources in an inconsistent state."],["p","Open exercises/08_futures/07_cancellation/src/lib.rs."],["p","Cancellation via select!:"],["code","tokio::select! {\n    result = do_work() => handle(result),\n    _ = tokio::time::sleep(timeout) => {\n        eprintln!(\"Timed out!\");\n        // do_work() future is dropped here\n    }\n}"],["p","Making cancellation safe:"],["li","Use tokio::select! with a CancellationToken from the tokio-util crate."],["li","Ensure cleanup logic runs in Drop implementations (not just at end of awaits)."],["li","Be careful with Mutex guards held across .await points — a cancelled task may hold the lock forever."],["p","The exercise models a long-running async operation that must be cancellable within a deadline. Implement it so that cancellation is handled cleanly without resource leaks."]],"n":97,"en":["Handle async task cancellation. In Tokio, a task is cancelled by dropping its `JoinHandle` (or by aborting it via `.abort()`). When a task is cancelled, the future is dropped at the next `.await` point — code after that point does not run. This means destructors run, but any operation spanning an `.await` may be left half-done. Be careful with `select!` macro races: if you race two futures and the losing future has partially completed work, that work is discarded. Practice writing cancel-safe code and understand when cancellation is and is not safe."],"bt":["Async task cancellation সামলাও। Tokio-তে task cancel করা হয় `JoinHandle` drop করে বা `.abort()` দিয়ে। Task cancel হলে, future পরবর্তী `.await` point-এ drop হয়। `select!` macro race-এ সতর্ক থাকো। Cancel-safe কোড লেখার অনুশীলন করো।"],"loc":"exercises/08_futures/07_cancellation","f":[{"n":"src/lib.rs","s":[["c","// TODO: fix the `assert_eq` at the end of the tests.\n//  Do you understand why that's the resulting output?\nuse std::time::Duration;\nuse tokio::io::AsyncReadExt;\nuse tokio::net::TcpListener;\n\npub async fn run(listener: TcpListener, n_messages: usize, timeout: Duration) -> Vec<u8> {\n    let mut buffer = Vec::new();\n    for _ in 0..n_messages {\n        let (mut stream, _) = listener.accept().await.unwrap();\n        let _ = tokio::time::timeout(timeout, async {\n            stream.read_to_end(&mut buffer).await.unwrap();\n        })\n        .await;\n    }\n    buffer\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use tokio::io::AsyncWriteExt;\n\n    #[tokio::test]\n    async fn ping() {\n        let listener = TcpListener::bind(\"127.0.0.1:0\").await.unwrap();\n        let addr = listener.local_addr().unwrap();\n        let messages = vec![\"hello\", \"from\", \"this\", \"task\"];\n        let timeout = Duration::from_millis(20);\n        let handle = tokio::spawn(run(listener, messages.len(), timeout.clone()));\n\n        for message in messages {\n            let mut socket = tokio::net::TcpStream::connect(addr).await.unwrap();\n            let (_, mut writer) = socket.split();\n\n            let (beginning, end) = message.split_at(message.len() / 2);\n\n            // Send first half\n            writer.write_all(beginning.as_bytes()).await.unwrap();\n            tokio::time::sleep(timeout * 2).await;\n            writer.write_all(end.as_bytes()).await.unwrap();\n\n            // Close the write side of the socket\n            let _ = writer.shutdown().await;\n        }\n\n        let buffered = handle.await.unwrap();\n        let buffered = std::str::from_utf8(&buffered).unwrap();\n"],["g","        assert_eq!(buffered, \"hefrthta\");"],["c","    }\n}\n"]]}]},{"t":"98. Async Rust — Outro | Async Rust — সমাপ্তি","b":[["p","Path: 08_futures/08_outro    |    Page Reference: 208"],["p","Consolidate everything from Chapter 8: Async Rust."],["p","This is the final exercise of the course — a comprehensive wrap-up that challenges you to combine all async concepts."],["p","Open exercises/08_futures/08_outro/src/lib.rs. Implement the described async system with minimal guidance."],["p","Concepts that may appear:"],["li","async fn, .await, and async blocks"],["li","tokio::spawn for concurrent tasks"],["li","tokio::join! and tokio::select! for task coordination"],["li","tokio::sync::Mutex, RwLock, mpsc, oneshot channels"],["li","spawn_blocking for CPU-intensive work"],["li","CancellationToken / select! for graceful shutdown"],["li","Implementing Future manually (if required)"],["li","Writing #[tokio::test] async tests"],["p","This exercise is intentionally open-ended. Design a clean solution, write idiomatic async Rust, and ensure all tests pass. Congratulations on completing 100 Exercises To Learn Rust!"]],"n":98,"en":["Final consolidation exercise for the entire course. You will apply everything learned — structs, enums, traits, ownership, iterators, threads, and async/await — to build a complete async ticket management server that can handle concurrent clients. The server should accept commands over an async channel, process them, and return responses. This exercise tests end-to-end understanding of Rust's core concepts and idiomatic patterns. By completing it, you will have the confidence to work on real-world Rust projects."],"bt":["পুরো course-এর জন্য চূড়ান্ত consolidation exercise। struct, enum, trait, ownership, iterator, thread, এবং async/await সব একত্রিত করে একটি complete async ticket management server তৈরি করো যা concurrent client সামলাতে পারে।"],"loc":"exercises/08_futures/08_outro","f":[{"n":"src/lib.rs","s":[["c","// This is our last exercise. Let's go down a more unstructured path!\n// Try writing an **asynchronous REST API** to expose the functionality\n// of the ticket management system we built throughout the course.\n// It should expose endpoints to:\n//  - Create a ticket\n//  - Retrieve ticket details\n//  - Patch a ticket\n//\n// Use Rust's package registry, crates.io, to find the dependencies you need\n// (if any) to build this system.\n"]]}]}]}]},{"g":"৩. প্রজেক্ট সেটআপ ও কুইজ","items":[{"id":"p_sd","t":"SD Card Flash Tool (React + Rust + Tauri)","k":"steps","s":[{"t":"Tauri কী, আর কেন React + Rust একসাথে?","b":[["p","Tauri একটা framework যেটা দিয়ে ডেস্কটপ অ্যাপ বানানো যায়, যার UI হয় ওয়েব টেকনোলজি (HTML/CSS/JavaScript/React) দিয়ে, কিন্তু ভারী বা সিস্টেম-লেভেল কাজ (ফাইল সিস্টেম, hardware access, ইত্যাদি) হয় Rust দিয়ে। এটাকে Electron-এর হালকা বিকল্প বলা যায়।"],["p","আমাদের প্রজেক্টে এই ভাগাভাগিটা এমন:"],["li","React (JavaScript) — শুধু UI দেখানো: বাটন, ফর্ম, প্রোগ্রেস বার। কোনো raw disk access বা Windows API কল এখানে নেই।"],["li","Rust — SD card/pen drive খুঁজে বের করা, capacity পড়া, raw বাইট লেখা (flash করা), verify করা, রিপোর্ট বানানো — এই সব “আসল কাজ”।"]]},{"t":"কেন এভাবে ভাগ করলাম?","b":[["li","Raw disk-এ write করার মতো বিপজ্জনক অপারেশন Rust-এর মতো strict, টাইপ-সেফ ভাষায় করাই নিরাপদ।"],["li","Windows-এর নিচু লেভেলের API (Win32) শুধু C/Rust/C++ থেকেই সরাসরি কল করা যায়, JavaScript থেকে না।"],["li","UI বদলানো (রঙ, লেআউট, নতুন স্ক্রিন) দ্রুত করা যায় React দিয়ে, disk-write লজিক না ছুঁয়ে।"],["p","দুটো অংশ একসাথে কথা বলে IPC (Inter-Process Communication) দিয়ে — এটা এই পুরো প্রজেক্টের সবচেয়ে গুরুত্বপূর্ণ কনসেপ্ট, পরের অংশগুলোতে বিস্তারিত আছে।"]]},{"t":"অংশ ১ — প্রজেক্ট স্ট্রাকচার (ফোল্ডার ম্যাপ)","b":[["code","sd-card-flash-tool/\n├── package.json            ← npm dependencies, scripts (React সাইড)\n├── vite.config.js          ← ফ্রন্টএন্ড build tool কনফিগ\n├── index.html               ← React app-এর entry HTML\n├── src/                      ← পুরো React frontend এখানে\n│   ├── main.jsx              ← React কে DOM-এ mount করে\n│   ├── App.jsx                ← \"কোন স্ক্রিন দেখাবো\" এর মূল লজিক (view router)\n│   ├── styles.css              ← সব CSS, ডিজাইন টোকেন\n│   ├── lib/\n│   │   └── tauriBridge.js      ← Rust API ↔ Mock API সুইচ করার লেয়ার\n│   └── components/             ← প্রতিটা স্ক্রিন/UI অংশ আলাদা ফাইলে\n│       ├── HomeView.jsx\n│       ├── BatchHomeView.jsx\n│       ├── BatchFlashView.jsx\n│       ├── BatchMemoryView.jsx\n│       ├── ReadMeView.jsx\n│       ├── ProgressBar.jsx\n│       └── TerminalStrip.jsx\n└── src-tauri/                 ← পুরো Rust backend এখানে\n    ├── Cargo.toml              ← Rust dependencies\n    ├── tauri.conf.json          ← Tauri অ্যাপ কনফিগ (window সাইজ, permissions)\n    ├── build.rs                  ← compile-time স্ক্রিপ্ট (admin manifest embed করে)\n    ├── windows/app.manifest       ← Windows-কে বলে \"admin দরকার\" (release build-এ)\n    └── src/\n        ├── main.rs                 ← এন্ট্রি পয়েন্ট, সব command রেজিস্টার করে\n        ├── commands.rs              ← IPC boundary — React যা কল করে সব এখানে\n        ├── drive.rs                  ← শুধু READ করে: drive খোঁজা, capacity, hardware identity\n        ├── flash.rs                    ← আসল write করে — একমাত্র জায়গা যেখানে ডিস্কে লেখা হয়\n        └── report.rs                    ← flash শেষে HTML+CSV রিপোর্ট বানায়"],["p","নিয়ম যেটা শুরু থেকে মেনে চলেছি: যেটা শুধু পড়ে (read-only) সেটা drive.rs-এ, আর যেটা লেখে/মুছে (destructive) সেটা flash.rs-এ। এভাবে ভাগ করে রাখলে ভবিষ্যতে “কোন কোড ডেটা নষ্ট করতে পারে” সেটা এক নজরে বোঝা যায় — অডিট করা সহজ হয়।"]]},{"t":"২.১ — Tauri + React প্রজেক্ট বানানো","b":[["code","npm create tauri-app@latest sd-card-flash-tool"],["p","অথবা ম্যানুয়ালি একটা Vite + React প্রজেক্ট বানিয়ে তাতে Tauri যোগ করা যায়:"],["code","npm create vite@latest sd-card-flash-tool -- --template react\ncd sd-card-flash-tool\nnpm install\nnpm install --save-dev @tauri-apps/cli\nnpm install @tauri-apps/api\nnpx tauri init"],["p","এই কমান্ডগুলো src-tauri/ ফোল্ডার বানিয়ে দেয় (Rust প্রজেক্ট), package.json-এ Tauri script যোগ করে।"]]},{"t":"২.২ — package.json — কেন এই dependencies","b":[["code","{\n  \"scripts\": {\n    \"dev\": \"vite\",\n    \"build\": \"vite build\",\n    \"tauri\": \"tauri\"\n  },\n  \"dependencies\": {\n    \"@tauri-apps/api\": \"^1.5.3\",\n    \"react\": \"^18.2.0\",\n    \"react-dom\": \"^18.2.0\"\n  },\n  \"devDependencies\": {\n    \"@tauri-apps/cli\": \"^1.5.11\",\n    \"@vitejs/plugin-react\": \"^4.2.1\",\n    \"vite\": \"^5.1.4\"\n  }\n}"],["li","@tauri-apps/api → এটা দিয়েই React থেকে Rust-কে কল করা হয় (invoke), event শোনা হয় (listen)।"],["li","@tauri-apps/cli → npm run tauri dev / npm run tauri build কমান্ড এখান থেকেই আসে।"],["li","vite → দ্রুত dev server, React বান্ডলিং।"]]},{"t":"২.৩ — vite.config.js","b":[["code","import { defineConfig } from \"vite\";\nimport react from \"@vitejs/plugin-react\";\n\nexport default defineConfig({\n  plugins: [react()],\n  clearScreen: false,\n  server: {\n    port: 1420,\n    strictPort: true,\n  },\n});"],["p","কেন port: 1420 ফিক্সড রাখা? কারণ tauri.conf.json-এ devPath: \"http://localhost:1420\" লেখা থাকে — Tauri window ঠিক এই পোর্টেই React app খুঁজবে। পোর্ট না মিললে Tauri window সাদা/ফাঁকা দেখাবে।"]]},{"t":"২.৪ — src-tauri/Cargo.toml — কেন প্রতিটা dependency","b":[["code","[dependencies]\ntauri = { version = \"1\", features = [\"dialog-open\", \"shell-open\"] }\nserde = { version = \"1\", features = [\"derive\"] }\nserde_json = \"1\"\n\n[target.'cfg(windows)'.dependencies]\nwindows = { version = \"0.54\", features = [\n  \"Win32_Foundation\",\n  \"Win32_Storage_FileSystem\",\n  \"Win32_System_IO\",\n  \"Win32_System_Ioctl\",\n  \"Win32_Security\",\n  \"Win32_System_SystemInformation\",\n] }"],["li","tauri → মূল framework। dialog-open ফিচার লাগে ফাইল-পিকার ডায়ালগ দেখানোর জন্য (image file বাছাই করতে)।"],["li","serde + serde_json → Rust struct ↔ JSON রূপান্তর (React-Rust IPC-এর ডেটা JSON আকারেই যাওয়া-আসা করে)।"],["li","windows crate → এটাই Win32 API (drive detect, raw write ইত্যাদি) কল করতে দেয়। [target.'cfg(windows)'.dependencies] মানে এই dependency শুধু Windows বিল্ডে যোগ হবে।"],["li","প্রতিটা Win32_* ফিচার আলাদা করে enable করতে হয় — শুধু যা লাগবে সেটাই enable করার সিস্টেম (কম্পাইল টাইম কম রাখতে)।"]]},{"t":"৩.১ — main.rs: এন্ট্রি পয়েন্ট","b":[["code","#![cfg_attr(not(debug_assertions), windows_subsystem = \"windows\")]\n\nmod commands;\nmod drive;\nmod flash;\nmod report;\n\nfn main() {\n    tauri::Builder::default()\n        .invoke_handler(tauri::generate_handler![\n            commands::list_drives,\n            commands::get_drive_capacity,\n            commands::get_file_info,\n            commands::flash_image,\n            commands::flash_batch,\n        ])\n        .run(tauri::generate_context!())\n        .expect(\"error while running SD Card Flash Tool\");\n}"],["h",3,"লাইন বাই লাইন লজিক"],["li","#![cfg_attr(...)] — এই লাইনটা শুধু release build-এ (debug না) একটা console window পপ-আপ হওয়া বন্ধ করে। Dev মোডে console দরকার (log/error দেখতে), কিন্তু final .exe-তে কালো CMD window হুট করে খোলাটা অপ্রয়োজনীয় লাগে।"],["li","mod commands; mod drive; ... — Rust-কে বলা হচ্ছে এই ফাইলগুলো এই প্রজেক্টের অংশ।"],["li","invoke_handler(tauri::generate_handler![...]) — এখানে যে ফাংশনগুলোর নাম লেখা আছে, শুধু সেগুলোই React থেকে invoke(\"নাম\", ...) দিয়ে কল করা যাবে।"],["p","ভবিষ্যতে ব্যবহার: নতুন কোনো ফিচার (ধরো, drive-কে eject করা) যোগ করতে চাইলে, commands.rs-এ নতুন #[tauri::command] ফাংশন লিখে, এখানে commands::eject_drive, যোগ করলেই React থেকে সেটা কল করা যাবে।"]]},{"t":"৩.২ — commands.rs: IPC-এর সীমানা (boundary)","b":[["p","এই ফাইলটাই একমাত্র জায়গা যেটা React সরাসরি “দেখে” (কল করে)। এখানে থাকা প্রতিটা ফাংশনের উপরে #[tauri::command] ট্যাগ থাকে।"],["code","#[tauri::command]\npub fn list_drives() -> Vec<DriveInfo> {\n    drive::list_removable_drives()\n}\n\n#[tauri::command]\npub fn get_drive_capacity(path: String) -> Result<CapacityInfo, String> {\n    drive::get_capacity(&path)\n}"],["h",3,"লজিক ও প্যাটার্ন"],["li","প্রতিটা command ফাংশন খুব পাতলা (thin) — নিজে কোনো ভারী কাজ করে না, শুধু drive.rs/flash.rs-এর আসল ফাংশনকে ডাকে। একে “thin controller” প্যাটার্ন বলে — IPC layer আর business logic আলাদা রাখা।"],["li","Rust-এর প্যারামিটার নাম JS-এ camelCase-এ রূপান্তরিত হয়ে কল হয়। যেমন Rust-এ path: String থাকলে, JS-এ invoke(\"get_drive_capacity\", { path: \"E:\\\\\" })।"],["li","রিটার্ন টাইপ Result<T, String> হলে — Ok(value) হলে React-এর await invoke(...) promise resolve হয়ে value পাবে; Err(message) হলে promise reject হয়ে JS-এর catch ব্লকে message পাবে।"],["h",3,"Flash কমান্ড কেন async"],["code","#[tauri::command]\npub async fn flash_image(\n    app: AppHandle,\n    drive_path: String,\n    image_path: String,\n) -> Result<FlashResult, String> {\n    tauri::async_runtime::spawn_blocking(move || {\n        flash::flash_single(&app, &drive_path, &image_path)\n    })\n    .await\n    .map_err(|e| format!(\"Flash task panicked: {e}\"))?\n}"],["p","ফ্ল্যাশ করা একটা ভারী, সময়সাপেক্ষ, blocking কাজ (ফাইল read/write, disk IO)। সরাসরি চালালে পুরো অ্যাপের UI thread আটকে যাবে — বাটনে ক্লিক করলেও রেসপন্স করবে না, window “Not Responding” দেখাবে। তাই:"],["li","async fn করে Tauri-র async runtime ব্যবহার করা হয়েছে।"],["li","spawn_blocking(...) দিয়ে ভারী কাজটা আলাদা থ্রেডে পাঠানো হয়েছে, যাতে মূল UI thread ফাঁকা থাকে।"],["li",".await দিয়ে সেই থ্রেডের কাজ শেষ হওয়ার অপেক্ষা করা হয় — কিন্তু এই অপেক্ষার সময়ও বাকি অ্যাপ সাড়া দিতে থাকে।"],["p","ভবিষ্যতে ব্যবহার: যেকোনো নতুন কমান্ড যেটা disk/file IO করে (বড় ফাইল কপি, network call ইত্যাদি), এই একই প্যাটার্নে লিখতে হবে — async fn + spawn_blocking।"]]},{"t":"৩.৩ — drive.rs: শুধু পড়ে (read-only)","b":[["h",3,"ক) Drive খুঁজে বের করা (list_removable_drives)"],["code","pub fn list_removable_drives() -> Vec<DriveInfo> {\n    let mut drives = Vec::new();\n    let mask = unsafe { GetLogicalDrives() };\n    for i in 0..26u32 {\n        if mask & (1 << i) == 0 { continue; }\n        let letter = (b'A' + i as u8) as char;\n        let root = format!(\"{letter}:\\\\\");\n        let drive_type = unsafe { GetDriveTypeW(...) };\n        if drive_type != DRIVE_REMOVABLE { continue; }\n        // ... DriveInfo বানিয়ে drives ভেক্টরে push\n    }\n    drives\n}"],["p","লজিক: Windows-এ GetLogicalDrives() একটা 32-বিট সংখ্যা (bitmask) রিটার্ন করে — প্রতিটা বিট একটা ড্রাইভ লেটারের (A, B, C...) জন্য। বিট 1 মানে সেই লেটার ব্যবহৃত হচ্ছে। A থেকে Z পর্যন্ত loop করে GetDriveTypeW দিয়ে চেক করা হয় সেটা removable (SD card/USB) কিনা — শুধু removable-গুলোই দেখানো হয়, C: (system drive) বা network drive বাদ যায়।"],["h",3,"খ) Capacity পড়া (get_capacity)"],["p","GetDiskFreeSpaceExW API কল করে total/free bytes বের করা হয়, আর GetVolumeInformationW দিয়ে filesystem-এর নাম (FAT32/exFAT) আর volume label পড়া হয়।"],["h",3,"গ) Hardware Identity বের করা (query_device_identity) — সবচেয়ে ইন্টারেস্টিং অংশ"],["code","pub fn query_device_identity(physical_path: &str) -> DeviceIdentity {\n    // CreateFileW দিয়ে physical drive handle ওপেন\n    // IOCTL_STORAGE_QUERY_PROPERTY কল করে device-এর নিজস্ব তথ্য চাওয়া\n    // ফলাফল থেকে BusType (USB/SD/MMC) আর vendor+product string বের করা\n}"],["p","কেন এটা দরকার হলো: GetDriveTypeW শুধু বলে “removable” — পেনড্রাইভ নাকি SD card সেটা বলে না। IOCTL_STORAGE_QUERY_PROPERTY device-এর নিজস্ব firmware-এর কাছে জিজ্ঞেস করে তার bus type (USB/SD/MMC) আর vendor/product (আসল হার্ডওয়্যার ব্র্যান্ড-মডেল, যেমন “SanDisk Ultra”)। এটাই diagnostics রিপোর্টে “Device Type” আর “Model” কলামের ডেটা যোগায়।"],["code","let bus_type_name = match descriptor.BusType.0 {\n    7 => \"USB Pen Drive\",\n    12 => \"SD Card\",\n    13 => \"MMC / eMMC Card\",\n    _ => \"Removable Drive\",\n}.to_string();"],["p","এই সংখ্যাগুলো (7, 12, 13) Win32-এর STORAGE_BUS_TYPE enum-এর সরকারি ডকুমেন্টেশনের ফিক্সড মান — এগুলো কখনো বদলায় না, তাই সরাসরি ব্যবহার করা নিরাপদ।"]]},{"t":"৩.৪ — flash.rs: একমাত্র জায়গা যেখানে লেখা হয়","b":[["p","এটাই প্রজেক্টের সবচেয়ে গুরুত্বপূর্ণ ও ঝুঁকিপূর্ণ ফাইল। ধাপে ধাপে লজিক বুঝি।"],["h",3,"ধাপ ১ — Volume Path থেকে Physical Drive খুঁজে বের করা"],["p","Windows-এ দুই ধরনের “path” আছে:"],["li","Volume path (E:\\) — ফাইল সিস্টেম লেভেলের, সাধারণ read/write এখানে হয়।"],["li","Physical drive path (\\\\.\\PhysicalDrive2) — raw hardware লেভেলের, পুরো ডিস্কের প্রতিটা বাইট এখান দিয়ে অ্যাক্সেস করা যায়, filesystem-কে পাশ কাটিয়ে।"],["p","Flash করতে হলে physical drive path-এ লিখতে হয় (image ফাইলে filesystem নিজেই থাকে, সেটা বসাতে হবে raw ডিস্কে)। তাই resolve_physical_drive_path() ফাংশন E:\\ থেকে \\\\.\\PhysicalDrive2 বের করে (IOCTL_STORAGE_GET_DEVICE_NUMBER দিয়ে)।"],["h",3,"ধাপ ২ — Volume Lock + Dismount (এটা না করলে Access Denied আসে!)"],["code","fn lock_and_dismount_volume(volume_path: &str) -> Result<HANDLE, String> {\n    let handle = CreateFileW(/* volume-এর handle */);\n    DeviceIoControl(handle, FSCTL_LOCK_VOLUME, ...);\n    DeviceIoControl(handle, FSCTL_DISMOUNT_VOLUME, ...);\n    Ok(handle)\n}"],["p","কেন দরকার: যতক্ষণ কোনো drive-এর volume (E:) Windows-এ mount করা থাকে, ততক্ষণ filesystem driver সেটাকে “ধরে” রাখে। Admin হিসেবে চালালেও, raw physical drive-এ সরাসরি write করতে গেলে Windows আটকে দেয় (Access Denied)। এই lock+dismount volume-টাকে সাময়িকভাবে “ছেড়ে দিতে” বাধ্য করে। এই handle-টা পুরো লেখা+verify শেষ না হওয়া পর্যন্ত খোলা রাখতে হবে — কারণ lock এই handle-এর সাথেই বাঁধা, handle বন্ধ হলেই lock উঠে যাবে।"],["h",3,"ধাপ ৩ — Write Phase: চাংক করে করে লেখা"],["code","const CHUNK_SIZE: usize = 4 * 1024 * 1024; // 4 MiB\n\nloop {\n    let n = src.read(&mut buffer)?; // image file থেকে ৪MB পড়ো\n    if n == 0 { break; }            // ফাইল শেষ\n    dst.write_all(&buffer[..write_len])?; // drive-এ লেখো\n    written += n as u64;\n    // প্রতি ২৫০ms-এ একবার progress পাঠাও\n}"],["p","কেন চাংক করে করে, পুরোটা একবারে না? একটা image ফাইল কয়েক GB-ও হতে পারে — পুরোটা একবারে RAM-এ লোড করলে মেমরি শেষ হয়ে যেতে পারে। ৪MB চাংক যথেষ্ট বড় (ভালো speed দেয়) আবার যথেষ্ট ছোট (progress bar smoothly আপডেট হয়, RAM কম লাগে)।"],["h",3,"Sector Alignment সমস্যা — একটা গুরুত্বপূর্ণ শেখার বিষয়"],["p","প্রথমে FILE_FLAG_NO_BUFFERING ব্যবহার করেছিলাম (raw, cache-বাইপাস করা লেখা) — এতে একটা কড়া নিয়ম আছে: প্রতিটা write/read অবশ্যই sector size (৫১২ বাইট)-এর multiple হতে হবে। image ফাইলের শেষ চাংকটা ঠিক multiple না হলে Windows ERROR_INVALID_PARAMETER (os error 87) দিয়ে রিফিউজ করে।"],["code","let write_len = if n % SECTOR_SIZE == 0 {\n    n\n} else {\n    let padded_len = n + (SECTOR_SIZE - (n % SECTOR_SIZE));\n    for byte in &mut buffer[n..padded_len] { *byte = 0; } // বাড়তি জায়গা শূন্য দিয়ে ভরা\n    padded_len\n};"],["p","সমাধান: শেষ চাংকটা ছোট হলে, পরের সেক্টর-বাউন্ডারি পর্যন্ত শূন্য বাইট দিয়ে প্যাড করে দেওয়া হয়। এই বাড়তি বাইট drive-এর মধ্যেই থাকে (আগেই size-check করা আছে), শুধু image ফাইলের আসল কন্টেন্টের অংশ না — তাই progress আর verify-তে গোনা হয় না।"],["p","পরে এই flag-টাই পুরোপুরি সরিয়ে দিয়েছি, শুধু FILE_FLAG_WRITE_THROUGH + sync_all() দিয়ে নিশ্চিত করেছি লেখা সরাসরি physical media-তে যাচ্ছে। এতে sector-alignment-এর কড়াকড়ি নিয়ম আর প্রযোজ্য হয় না — কোড অনেক সহজ ও নির্ভরযোগ্য হয়ে গেছে।"],["h",3,"ধাপ ৪ — Verify Phase: লিখেছি ঠিক আছে কিনা যাচাই"],["code","fn verify_phase(...) -> Result<bool, String> {\n    // image ফাইল আবার প্রথম থেকে পড়ো\n    // drive থেকেও একই পরিমাণ বাইট আবার পড়ো\n    // দুটো চাংক তুলনা করো — না মিললে false রিটার্ন করো\n}"],["p","কেন verify করা দরকার: লেখা “সফল” হওয়া মানেই ডেটা সঠিকভাবে বসেছে তার গ্যারান্টি না — corrupt card, bad sector, বা connection সমস্যায় ভুল ডেটা লেখা হতে পারে। তাই লেখার পর আবার পড়ে মূল ফাইলের সাথে তুলনা করা হয়।"],["h",3,"ধাপ ৫ — Report তৈরি"],["p","Write+verify শেষে (পাস হোক বা fail), build_and_write_report() কল হয় — এটা drive.rs-এর query_device_identity() দিয়ে hardware info নেয়, report.rs-এর write_reports() কল করে HTML+CSV বানায়।"],["h",3,"Batch Flash-এর লজিক (একই সময়ে একাধিক drive, parallel)"],["code","pub fn flash_batch_parallel(app: &AppHandle, jobs: &[(String, String)]) -> Vec<BatchItemResult> {\n    let results = Mutex::new(Vec::new());\n    std::thread::scope(|scope| {\n        for (drive_path, image_path) in jobs {\n            scope.spawn(move || {\n                let outcome = flash_single(app, drive_path, image_path);\n                // ফলাফল results-এ push করো, event পাঠাও\n            });\n        }\n    });\n    results.into_inner().unwrap()\n}"],["p","std::thread::scope দিয়ে প্রতিটা drive-এর জন্য আলাদা থ্রেড চালানো হয় — সব থ্রেড একসাথে চলে (parallel)। প্রতিটা থ্রেড আলাদা physical drive নিয়ে কাজ করে বলে একটার সাথে আরেকটার conflict নেই (শুধু results Vec-টা share হয়, তাই Mutex দিয়ে protect করা)। প্রতিটা থ্রেডের progress event আলাদা drive_path ট্যাগ নিয়ে যায়, তাই frontend ঠিক কোন row আপডেট করবে সেটা জানে।"]]},{"t":"৩.৫ — report.rs: ডায়াগনস্টিক রিপোর্ট","b":[["code","fn diagnostics_dir() -> Result<PathBuf, String> {\n    let exe_dir = std::env::current_exe()...parent()...;\n    let dir = exe_dir.join(\"diagnostics\");\n    fs::create_dir_all(&dir)?;\n    Ok(dir)\n}"],["p","কেন .exe-এর পাশে, AppData-তে না: এই ধরনের টুল সাধারণত পোর্টেবল — টেকনিশিয়ানরা একে USB drive-এ রেখে এক কম্পিউটার থেকে আরেক কম্পিউটারে নিয়ে যেতে পারে। AppData-তে রাখলে রিপোর্ট প্রতিটা কম্পিউটারে ছড়িয়ে থাকত। .exe-এর পাশে রাখলে সব রিপোর্ট এক জায়গায়, সহজে খুঁজে পাওয়া যায়।"],["p","HTML আর CSV দুটোই বানানো হয় — HTML মানুষের পড়ার জন্য সুন্দর (প্রিন্ট করা যায়), CSV স্প্রেডশিট/লগ সিস্টেমে import করার জন্য সহজ। দুটোর ডেটা একই, শুধু ফরম্যাট আলাদা।"]]},{"t":"৪.১ — App.jsx: “কোন স্ক্রিন দেখাবো” রাউটার","b":[["p","React-এ এই ছোট অ্যাপে built-in “page routing” দরকার নেই — একটা সাধারণ প্যাটার্ন ব্যবহার করা হয়েছে: state variable দিয়ে “কোন view active” ট্র্যাক করা।"],["code","const VIEW = {\n  HOME: \"home\",\n  BATCH_HOME: \"batch_home\",\n  BATCH_FLASH: \"batch_flash\",\n  BATCH_MEMORY: \"batch_memory\",\n  README: \"readme\",\n};\n\nconst [view, setView] = useState(VIEW.HOME);\n\n// render-এ:\n{view === VIEW.HOME && <HomeView onOpenBatch={() => setView(VIEW.BATCH_HOME)} />}\n{view === VIEW.BATCH_HOME && <BatchHomeView ... />}"],["p","লজিক: view একটা string, যেটা বদলালেই React re-render করে সঠিক component দেখায়। প্রতিটা component-কে একটা onBack/onOpenXxx callback দেওয়া হয় — child component নিজে কিছু জানে না কোথায় যেতে হবে, শুধু “আমি শেষ, এবার তুমি (parent) ঠিক করো কোথায় যাব” — এই প্যাটার্নকেই বলে “lifting state up”, React-এর একটা মূল নীতি।"],["p","batchDrives state কেন App.jsx-এ, কোনো child-এ না: কারণ এই ডেটা একাধিক স্ক্রিনের মধ্যে শেয়ার হয় (BatchHomeView detect করে, BatchFlashView/BatchMemoryView সেটাই ব্যবহার করে)। যে ডেটা একাধিক sibling component-এর মধ্যে শেয়ার হবে, সেটা তাদের সবচেয়ে কাছের common parent-এ রাখতে হয় — এটাও React-এর একটা মূল নীতি।"]]},{"t":"৪.২ — lib/tauriBridge.js: সবচেয়ে চালাক অংশ","b":[["code","const isTauri = typeof window !== \"undefined\" && \"__TAURI__\" in window;\n\nexport async function invoke(command, args = {}) {\n  if (isTauri) {\n    const { invoke: realInvoke } = await import(\"@tauri-apps/api/tauri\");\n    return realInvoke(command, args);\n  }\n  // ... mock ডেটা রিটার্ন করো\n}"],["p","কেন এই লেয়ারটা বানানো হলো: প্রতিটা component সরাসরি @tauri-apps/api থেকে import না করে, এই একটা ফাইল থেকে import করে। ফলে:"],["li","Tauri window-এর ভেতরে চললে → real Rust backend কল হয়।"],["li","সাধারণ ব্রাউজারে (npm run dev, কোনো Rust ছাড়াই) চললে → নকল (mock) ডেটা রিটার্ন হয়, যাতে কোনো SD card বা এমনকি Rust compile না করেই পুরো UI টেস্ট করা যায়।"],["p","এই প্যাটার্নের নাম “adapter pattern” — একটা মধ্যবর্তী লেয়ার যেটা “আসল” আর “নকল” বাস্তবায়নের মধ্যে সুইচ করে, বাকি কোডকে না জানিয়েই।"],["p","ভবিষ্যতে ব্যবহার: এই একই প্যাটার্ন যেকোনো প্রজেক্টে কাজে লাগবে যেখানে backend/hardware ছাড়া frontend develop/test করতে হয় — যেমন কোনো IoT ড্যাশবোর্ড যেখানে sensor hardware না থাকা অবস্থাতেও UI বানাতে হবে।"]]},{"t":"৪.৩ — Component-গুলোর প্যাটার্ন (সবগুলোতে একই স্টাইল)","b":[["code","export default function XxxView({ props..., onBack, log }) {\n  const [status, setStatus] = useState(\"idle\");\n  // ... handler ফাংশন যেটা invoke() কল করে\n  return ( /* JSX */ );\n}"],["p","log প্রপটা সব জায়গায় পাস করা হয় — এটা Activity Log-এ একটা লাইন যোগ করার ফাংশন, App.jsx-এ ডিফাইন করা:"],["code","const log = useCallback((text, kind = \"info\") => {\n  setLogLines((prev) => [...prev.slice(-200), { text, kind, id: Date.now() + Math.random() }]);\n}, []);"],["p","prev.slice(-200) মানে সবসময় শুধু শেষ ২০০টা লাইন রাখা হয় — নাহলে অনেকক্ষণ চললে memory-তে অসীম লাইন জমে যেত।"],["h",3,"Progress event শোনার প্যাটার্ন (BatchFlashView-এ)"],["code","useEffect(() => {\n  const unlistenPromise = listen(\"flash-progress\", (event) => {\n    const { drive_path, phase, percent } = event.payload;\n    setRows((prev) => prev.map((row) => (row.path === drive_path ? { ...row, phase, percent } : row)));\n  });\n  return () => { unlistenPromise.then((unlisten) => unlisten()); };\n}, [log]);"],["p","useEffect-এর return ফাংশন cleanup — component unmount হলে (অন্য স্ক্রিনে চলে গেলে) event listener বন্ধ করে দেয়, নাহলে memory leak হতো (পুরনো component আর নেই কিন্তু event এখনো তার কাছে আসতে থাকত)।"]]},{"t":"৪.৪ — CSS/থিম সিস্টেম (styles.css)","b":[["p","CSS variables (:root { --accent: #0ea5e9; ... }) দিয়ে একটা “design token” সিস্টেম বানানো হয়েছে। থিম বদলাতে হলে (dark → light, বা amber → sky-blue) শুধু :root-এর ভ্যারিয়েবলগুলো বদলালেই পুরো অ্যাপ জুড়ে বদলে যায় — প্রতিটা কম্পোনেন্টের CSS আলাদা করে ধরতে হয় না।"]]},{"t":"অংশ ৫ — গুরুত্বপূর্ণ ডিজাইন সিদ্ধান্ত: সংক্ষেপে “কেন”","b":[["tbl",[["সিদ্ধান্ত","কারণ"],["Detection আর Flash আলাদা ফাইলে (drive.rs vs flash.rs)","কোন কোড ধ্বংসাত্মক (destructive) সেটা স্পষ্ট রাখা, audit সহজ করা"],["Flash কমান্ড async + spawn_blocking","UI thread ব্লক না হয়ে যায়"],["Progress event-এ সবসময় drive_path থাকে","একই event single আর batch, উভয় UI-তে কাজ করে"],["Volume lock+dismount, তারপর raw physical drive-এ write","Windows-এর security model অনুযায়ী বাধ্যতামূলক ধাপ"],["Sector-padding (শেষ চাংক শূন্য দিয়ে ভরা)","Windows-এর raw disk IO-এর নিয়ম মেনে চলা"],["Mandatory verify (লিখে আবার পড়ে তুলনা)","নিশ্চিত করা যে লেখা সত্যিই সঠিক হয়েছে"],["Report .exe-এর পাশে, AppData-তে না","Portable ব্যবহারের জন্য সুবিধাজনক"],["tauriBridge.js mock/real সুইচ","Hardware ছাড়াই UI develop/test করা যায়"],["App-level state, component-level না","একাধিক স্ক্রিনে শেয়ার হওয়া ডেটা এক জায়গায় রাখা"]]]]},{"t":"অংশ ৬ — কমন এরর যেগুলো সমাধান করেছি (ভবিষ্যতের জন্য শেখা)","b":[["p","এই প্রজেক্ট বানাতে গিয়ে যেসব এরর এসেছিল, সেগুলো আসলে Windows raw-disk-access প্রোগ্রামিং-এর ক্লাসিক সমস্যা — অন্য কোনো প্রজেক্টে একই ধরনের কাজ করলে এগুলো আবার আসতে পারে:"],["h",3,"১. “Access is denied” (os error 5)"],["p","Elevation দরকার — raw physical drive লিখতে admin লাগেই। সমাধান: elevated terminal থেকে চালানো (dev), অথবা app manifest-এ requireAdministrator (release)।"],["h",3,"২. “Access is denied” লেখার সময়ও"],["p","Volume মাউন্ট করা থাকলে filesystem driver protect করে রাখে। সমাধান: FSCTL_LOCK_VOLUME + FSCTL_DISMOUNT_VOLUME।"],["h",3,"৩. “Incorrect function” (os error 1)"],["p","Physical drive-এ সাধারণ file.metadata().len() কাজ করে না। সমাধান: IOCTL_DISK_GET_LENGTH_INFO ব্যবহার করা।"],["h",3,"৪. “The parameter is incorrect” (os error 87)"],["p","FILE_FLAG_NO_BUFFERING-এর sector-alignment নিয়ম ভাঙা। সমাধান: sector-padding, অথবা flag-টাই বাদ দেওয়া।"],["h",3,"৫. Compile error: “no DRIVE_REMOVABLE in ...”"],["p","কিছু Win32 enum/constant windows crate-এ named constant হিসেবে না থেকে raw integer হিসেবে ব্যবহার করতে হয়।"],["p","সাধারণ শিক্ষা: raw hardware access প্রোগ্রামিং-এ error message-টাই সবচেয়ে বড় বন্ধু — Windows OS error code (যেমন os error 5, os error 87) গুগল করলেই প্রায় সবসময় exact কারণ ও সমাধান পাওয়া যায়, কারণ এগুলো fixed, ডকুমেন্টেড Win32 error code।"]]},{"t":"অংশ ৭ — রিক্রিয়েট করার সাজেস্টেড অর্ডার","b":[["p","পুরো প্রজেক্টটা আবার শুরু থেকে বানাতে চাইলে এই অর্ডারে করাই সবচেয়ে সহজ হবে (প্রতিটা ধাপে আগেরটা কাজ করছে কিনা টেস্ট করে নিয়ে):"],["li","১. Tauri+React স্কেলেটন বানাও — npm create tauri-app, খালি window খুলছে কিনা টেস্ট করো।"],["li","২. drive.rs লেখো, শুধু list_drives — একটা বাটনে ক্লিক করলে console-এ drive লিস্ট প্রিন্ট হচ্ছে কিনা টেস্ট করো (React ছাড়াই, শুধু println! দিয়ে)।"],["li","৩. commands.rs + main.rs দিয়ে IPC ওয়্যার করো — React থেকে invoke(\"list_drives\") কল করে console-এ log করে দেখো ডেটা আসছে কিনা।"],["li","৪. HomeView.jsx/BatchHomeView.jsx বানাও — এবার UI-তে drive লিস্ট দেখাও।"],["li","৫. get_capacity যোগ করো, তারপর Check Memory UI।"],["li","৬. flash.rs-এ flash_single লেখো — প্রথমে শুধু ছোট, নিরাপদ টেস্ট ফাইল দিয়ে টেস্ট করো, real firmware দিয়ে না।"],["li","৭. Progress event সিস্টেম যোগ করো — emit_all/listen।"],["li","৮. Verify phase যোগ করো।"],["li","৯. flash_batch_parallel যোগ করো batch UI-এর সাথে।"],["li","১০. report.rs যোগ করো সবশেষে — কারণ এটা flash কাজ করার পরই দরকারি হয়।"],["li","১১. UI পালিশ (থিম, Read Me পেজ) — সবার শেষে, ফাংশনালিটি ঠিকঠাক কাজ করাটাই আগে দরকার।"],["p","মূল কথা: সবচেয়ে ঝুঁকিপূর্ণ অংশ (raw disk write) সবার আগে ছোট আকারে টেস্ট করে ফেলা, তারপর ধীরে ধীরে ফিচার আর UI যোগ করা — উল্টো করলে (আগে UI, পরে backend) শেষে গিয়ে বড় বাগ পেলে ঠিক করা কঠিন হয়ে যায়।"],["p","এই ডকুমেন্টটা প্রজেক্ট ফোল্ডারে README.md-এর পাশে রাখতে পারো রেফারেন্স হিসেবে। নতুন কোনো ফিচার যোগ করার সময় অংশ ৫-এর টেবিলটা আরেকবার দেখে নিলে বুঝবে নতুন কোডটা কোথায় বসানো উচিত।"]]}]},{"id":"p_ca","t":"ক্যালকুলেটর ১ — JavaScript (PDF ১)","k":"steps","s":[{"t":"আর্কিটেকচার","b":[["p","React (UI) ↔ Tauri IPC Bridge ↔ Rust (Logic)। CLI-এর `input()` বাদ; React UI থেকে ডেটা আসবে, `#[tauri::command]` ফাংশন সেটা নেবে।"],["code","React (Frontend/UI) ←→ Tauri IPC (invoke) ←→ Rust (src-tauri/src/main.rs)"]]},{"t":"Step 1: Prerequisites","b":[["code","curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh\n# Node.js LTS ডাউনলোড করো (nodejs.org)\ncargo install tauri-cli"],["p","Windows-এ Microsoft C++ Build Tools + WebView2 লাগবে। বিস্তারিত: tauri.app/start/prerequisites"]]},{"t":"Step 2: প্রজেক্ট তৈরি","b":[["code","npm create tauri-app@latest\n# Project name: calculator-app | Package manager: npm | UI Template: React | Flavor: JavaScript\ncd calculator-app\nnpm install"],["code","calculator-app/\n├── src/            ← React (App.jsx, main.jsx)\n├── src-tauri/      ← Rust (src/main.rs, Cargo.toml, tauri.conf.json)\n├── index.html\n└── package.json"]]},{"t":"Step 3: Rust Backend — main.rs","b":[["p","পুরনো `add/sub/mul/div` হুবহু থাকবে। শুধু `#[tauri::command]` দিয়ে `calculate` বানাও এবং `generate_handler!` এ register করো।"],["code","fn add(a: i32, b: i32) -> i32 { a + b }\nfn sub(a: i32, b: i32) -> i32 { a - b }\nfn mul(a: i32, b: i32) -> i32 { a * b }\nfn div(a: i32, b: i32) -> i32 {\n    if b == 0 { return 0; }\n    a / b\n}\n\n#[tauri::command]\nfn calculate(val: i32, a: i32, b: i32) -> String {\n    let result = match val {\n        1 => add(a, b),\n        2 => sub(a, b),\n        3 => mul(a, b),\n        4 => div(a, b),\n        _ => return \"Invalid operation\".to_string(),\n    };\n    result.to_string()\n}\n\nfn main() {\n    tauri::Builder::default()\n        .invoke_handler(tauri::generate_handler![calculate])\n        .run(tauri::generate_context!())\n        .expect(\"error while running tauri application\");\n}"]]},{"t":"Step 4: React Frontend — App.jsx (state ও invoke)","b":[["p","PDF-এর import `@tauri-apps/api/tauri` (Tauri v1)। Tauri v2 প্রজেক্টে `@tauri-apps/api/core` ব্যবহার করতে হয়।"],["code","import { useState } from \"react\";\nimport { invoke } from \"@tauri-apps/api/tauri\";\n\nfunction App() {\n  const [a, setA] = useState(\"\");\n  const [b, setB] = useState(\"\");\n  const [operation, setOperation] = useState(1);\n  const [result, setResult] = useState(null);\n  const [error, setError] = useState(\"\");\n\n  async function handleCalculate() {\n    setError(\"\");\n    const numA = parseInt(a);\n    const numB = parseInt(b);\n    if (isNaN(numA) || isNaN(numB)) { setError(\"সঠিক number দিন!\"); return; }\n    if (operation === 4 && numB === 0) { setError(\"শূন্য দিয়ে ভাগ করা যাবে না!\"); return; }\n    const res = await invoke(\"calculate\", { val: operation, a: numA, b: numB });\n    setResult(res);\n  }"]]},{"t":"Step 4 (পর): UI — input, অপারেশন বাটন, ফলাফল","b":[["code","  const operations = [\n    { val: 1, label: \"Add (+)\" }, { val: 2, label: \"Subtract (−)\" },\n    { val: 3, label: \"Multiply (×)\" }, { val: 4, label: \"Divide (÷)\" },\n  ];\n  return (\n    <div>\n      <h1>Calculator<\/h1>\n      <input type=\"number\" value={a} onChange={(e) => setA(e.target.value)} />\n      <input type=\"number\" value={b} onChange={(e) => setB(e.target.value)} />\n      {operations.map((op) => (\n        <button key={op.val} onClick={() => setOperation(op.val)}>{op.label}<\/button>\n      ))}\n      <button onClick={handleCalculate}>Calculate<\/button>\n      {error && <p>{error}<\/p>}\n      {result !== null && !error && <div>Result = <strong>{result}<\/strong><\/div>}\n    <\/div>\n  );\n}\nexport default App;"],["p","PDF-এ inline `styles` অবজেক্টে container, row, opBtn, calcBtn ইত্যাদির CSS আছে (maxWidth 420, border-radius 16 ইত্যাদি) — এটি সাজসজ্জা, লজিক না।"]]},{"t":"Step 5: Run ও Build","b":[["code","npm run tauri dev      # hot reload সহ\nnpm run tauri build    # installer → src-tauri/target/release/bundle/"],["p","CLI → Tauri: `input()` → React `<input>` state; `match val` হুবহু একই; `println!` → `result.to_string()` React-এ দেখায়।"]]},{"t":"সমস্যা হলে","b":[["code","cd src-tauri && cargo update\nrm -rf node_modules && npm install"]]}]},{"id":"p_cb","t":"ক্যালকুলেটর ২ — TypeScript (PDF ২)","k":"steps","s":[{"t":"লক্ষ্য ও Prerequisites","b":[["p","Tauri + Rust এর মূল ধারণা শিখে পরে যেকোনো ডেস্কটপ অ্যাপ একই টেমপ্লেটে বানানো।"],["code","node -v   # v18+\nnpm -v    # 9+\nrustc --version\ncargo --version\ncargo install tauri-cli"],["p","Windows এ C++ Build Tools লাগবে; WebView2 Windows 11 এ আগেই থাকে।"]]},{"t":"ধাপ ২: প্রজেক্ট তৈরি (react-ts)","b":[["p","`vanilla-ts` নয়, React-এর জন্য `react-ts` টেমপ্লেট লাগে।"],["code","npx create-tauri-app tauri-calculator -m npm -t react-ts -y\ncd tauri-calculator\nnpm install\nnpm run tauri dev"]]},{"t":"ধাপ ৩: ফাইল স্ট্রাকচার","b":[["code","tauri-calculator/\n├── src/                 ← React (Frontend)\n│   ├── components/      ← নিজে বানাবে (Calculator.tsx, Display.tsx)\n│   ├── App.tsx\n│   └── App.css\n├── src-tauri/\n│   ├── src/main.rs      ← App চালু হয় এখান থেকে\n│   ├── src/lib.rs       ← তোমার Rust commands\n│   ├── Cargo.toml\n│   └── tauri.conf.json\n└── package.json"],["p","src/ = React+TypeScript (UI); src-tauri/src/ = Rust (logic, system access); দুইটা কথা বলে invoke() দিয়ে।"]]},{"t":"ধাপ ৪: Rust — lib.rs","b":[["p","এবার `f64` ও `Result<f64, String>` ব্যবহার হয়েছে, তাই শূন্য দিয়ে ভাগ হলে Err যায় এবং React-এ catch হয়।"],["code","#[tauri::command]\nfn calculate(a: f64, operator: String, b: f64) -> Result<f64, String> {\n    match operator.as_str() {\n        \"+\" => Ok(a + b),\n        \"-\" => Ok(a - b),\n        \"*\" => Ok(a * b),\n        \"/\" => {\n            if b == 0.0 {\n                Err(String::from(\"শূন্য দিয়ে ভাগ করা যায় না!\"))\n            } else {\n                Ok(a / b)\n            }\n        }\n        _ => Err(format!(\"অজানা অপারেটর: {}\", operator)),\n    }\n}\n\n#[cfg_attr(mobile, tauri::mobile_entry_point)]\npub fn run() {\n    tauri::Builder::default()\n        .plugin(tauri_plugin_opener::init())\n        .invoke_handler(tauri::generate_handler![calculate])\n        .run(tauri::generate_context!())\n        .expect(\"Tauri app চালু করতে সমস্যা হয়েছে\");\n}"]]},{"t":"ধাপ ৫.১–৫.২: Display.tsx","b":[["code","mkdir src/components"],["code","interface DisplayProps {\n  value: string;\n  expression: string;\n}\n\nexport default function Display({ value, expression }: DisplayProps) {\n  return (\n    <div className=\"display\">\n      <div className=\"expression\">{expression}<\/div>\n      <div className=\"value\">{value}<\/div>\n    <\/div>\n  );\n}"]]},{"t":"ধাপ ৫.৩: Calculator.tsx — state ও বাটন হ্যান্ডলার","b":[["code","import { useState } from \"react\";\nimport { invoke } from \"@tauri-apps/api/core\";\nimport Display from \"./Display\";\n\nexport default function Calculator() {\n  const [display, setDisplay] = useState(\"0\");\n  const [firstNum, setFirstNum] = useState(\"\");\n  const [operator, setOperator] = useState(\"\");\n  const [expression, setExpression] = useState(\"\");\n  const [waitingForSecond, setWaitingForSecond] = useState(false);\n\n  function handleNumber(num: string) {\n    if (waitingForSecond) { setDisplay(num); setWaitingForSecond(false); }\n    else { setDisplay(display === \"0\" ? num : display + num); }\n  }\n  function handleDecimal() {\n    if (!display.includes(\".\")) setDisplay(display + \".\");\n  }\n  function handleOperator(op: string) {\n    setFirstNum(display);\n    setOperator(op);\n    setExpression(`${display} ${op}`);\n    setWaitingForSecond(true);\n  }"]]},{"t":"ধাপ ৫.৩ (পর): = চাপলে Rust কে ডাকা","b":[["p","এখানেই Rust function ডাকা হয়। Rust `Err()` পাঠালে `catch` ব্লকে আসে।"],["code","  async function handleEquals() {\n    if (!firstNum || !operator) return;\n    setExpression(`${firstNum} ${operator} ${display} =`);\n    try {\n      const result = await invoke<number>(\"calculate\", {\n        a: parseFloat(firstNum),\n        operator: operator,\n        b: parseFloat(display),\n      });\n      setDisplay(String(result));\n      setFirstNum(\"\");\n      setOperator(\"\");\n      setWaitingForSecond(true);\n    } catch (error) {\n      setDisplay(String(error));\n    }\n  }\n  function handleClear
